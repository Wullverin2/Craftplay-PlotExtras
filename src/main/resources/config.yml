# CraftplayPlotExtras
# Ziel: Ein Menü, das Spielern die Bedienung von PlotSquared Premium 7.5.11 erleichtert.
# Diese Datei enthält nur globale Einstellungen.
# Die Menüs liegen im Ordner gui/, die Texte im Ordner language/.

# Dateiversion dieser Konfigurationsdatei.
# Das Plugin nutzt diesen Wert, um neue Standardwerte zu ergänzen.
file-version: 15

# Befehle dieses Plugins.
command:
  # Hauptbefehl ohne Slash. Der feste Bukkit-Befehl /plotextras bleibt aus technischen Gründen erhalten,
  # aber dieser Wert kann zusätzlich als frei änderbarer Befehlspräfix genutzt werden.
  prefix: plotextras
  # Zusätzliche frei änderbare Kurzbefehle ohne Slash.
  aliases:
    - cpe

# Spracheinstellungen für Nachrichten und GUI-Auswahl.
language:
  # Standardsprache für Nachrichten und GUIs.
  # Mitgeliefert werden de und en. Die Datei muss unter language/<code>.yml liegen.
  # Wenn hier z. B. en steht, wird gui/en/main.yml und language/en.yml genutzt.
  default: de

# Speicher-System für interne Plugin-Daten.
# Hier wird festgelegt, wo das Plugin seine eigenen Daten speichert:
# Plotfavoriten, Tags, Kategorien, Reports, Rollen, Teamdaten, Zukunftsfeatures und Plotbackup-Metadaten.
# Wichtig: Plot-Schematics bleiben immer normale .schem-Dateien im Plotbackup-Ordner.
# Nur die Metadaten und sonstigen Plugin-Daten wechseln je nach storage.type den Speicherort.
# Migration zwischen Speicherarten: /plotextras storage migrate <quelle> <ziel>
# Beispiel: /plotextras storage migrate yaml mysql
storage:
  # ============================================================
  # SPEICHERART AUSWÄHLEN
  # ============================================================
  # Dieser Wert entscheidet, welcher Speicher aktiv genutzt wird.
  # Erlaubte Werte:
  # yaml       = Standard. Speichert alles als .yml-Dateien im Pluginordner. Einfach und gut für kleine Server.
  # sqlite     = Lokale Datenbankdatei. Gut, wenn viele Daten anfallen, aber kein externer Datenbankserver genutzt wird.
  # mysql      = Externer MySQL-Server. Gut für Netzwerke oder mehrere Server.
  # mariadb    = Externer MariaDB-Server. MySQL-kompatibel und oft auf Linux-Servern genutzt.
  # postgresql = Externer PostgreSQL-Server. Stabil für große Datenmengen und langfristige Speicherung.
  # redis      = Sehr schneller Key-Value-Speicher. Nur nutzen, wenn Redis mit Persistenz läuft.
  # mongodb    = Dokumenten-Datenbank. Gut, wenn du MongoDB bereits im Netzwerk nutzt.
  type: yaml

  # ============================================================
  # GEMEINSAME STORAGE-EINSTELLUNGEN
  # ============================================================
  # Tabellenpräfix für SQL-Datenbanken. Aus diesem Wert wird z. B. cpe_data.
  # Betrifft nur sqlite, mysql, mariadb und postgresql.
  table-prefix: cpe_

  # ============================================================
  # SQLITE
  # ============================================================
  sqlite:
    # SQLite-Datei relativ zum Pluginordner.
    # Diese Datei enthält alle internen Plugin-Daten, wenn storage.type auf sqlite steht.
    file: storage/database.db

  # ============================================================
  # MYSQL
  # ============================================================
  mysql:
    # Hostname oder IP des MySQL-Servers.
    host: 127.0.0.1
    # Port des MySQL-Servers.
    port: 3306
    # Datenbankname.
    database: craftplay_plotextras
    # Benutzername.
    username: root
    # Passwort.
    password: ""
    # Wenn true, wird SSL in der JDBC-URL aktiviert.
    # Nur aktivieren, wenn dein MySQL-Server SSL korrekt eingerichtet hat.
    use-ssl: false

  # ============================================================
  # MARIADB
  # ============================================================
  mariadb:
    # Hostname oder IP des MariaDB-Servers.
    host: 127.0.0.1
    # Port des MariaDB-Servers.
    port: 3306
    # Datenbankname.
    database: craftplay_plotextras
    # Benutzername.
    username: root
    # Passwort.
    password: ""
    # Wenn true, wird SSL in der JDBC-URL aktiviert.
    # Nur aktivieren, wenn dein MariaDB-Server SSL korrekt eingerichtet hat.
    use-ssl: false

  # ============================================================
  # POSTGRESQL
  # ============================================================
  postgresql:
    # Hostname oder IP des PostgreSQL-Servers.
    host: 127.0.0.1
    # Port des PostgreSQL-Servers.
    port: 5432
    # Datenbankname.
    database: craftplay_plotextras
    # Benutzername.
    username: postgres
    # Passwort.
    password: ""

  # ============================================================
  # REDIS
  # ============================================================
  redis:
    # Hostname oder IP des Redis-Servers.
    host: 127.0.0.1
    # Port des Redis-Servers.
    port: 6379
    # Redis-Datenbanknummer.
    # Üblich ist 0. Nutze andere Nummern nur, wenn du Redis bewusst trennen möchtest.
    database: 0
    # Passwort. Leer lassen, wenn Redis kein Passwort nutzt.
    password: ""
    # Timeout für Redis-Verbindungen in Millisekunden.
    # Bei langsamen Netzwerken kann dieser Wert erhöht werden.
    timeout-millis: 2000
    # Schlüsselpräfix, damit mehrere Plugins dieselbe Redis-Instanz nutzen können.
    key-prefix: "craftplayplotextras:"

  # ============================================================
  # MONGODB
  # ============================================================
  mongodb:
    # MongoDB-Verbindungs-URI.
    # Hier können auch Benutzername, Passwort und Replica-Sets eingetragen werden.
    uri: "mongodb://127.0.0.1:27017"
    # Datenbankname.
    database: craftplay_plotextras
    # Collection, in der Plugin-Daten gespeichert werden.
    collection: data

# GUI-Grundeinstellungen.
gui:
  # Datei des Hauptmenüs. Geladen wird gui/<sprache>/<main-menu>.
  # Diese Datei ist das Java-Inventar-Hauptmenü.
  main-menu: main.yml
  # Datei des Bedrock-Hauptmenüs. Geladen wird gui/<sprache>/<bedrock-main-menu>.
  # Diese Datei ist eine Floodgate-Form und getrennt vom Java-Inventar.
  bedrock-main-menu: bedrock.yml
  # Datei des Meine-Plots-Untermenüs. Geladen wird gui/<sprache>/<my-plots-menu>.
  # Dieses Menü listet eigene Plots mit Pagination, Sortierung, Favoriten, Tags und Kategorien.
  my-plots-menu: myplots.yml
  # Datei des Bedrock-Meine-Plots-Menüs. Geladen wird gui/<sprache>/<bedrock-my-plots-menu>.
  # Diese Datei ist eine Floodgate-Form und getrennt vom Java-Inventar.
  bedrock-my-plots-menu: bedrock-myplots.yml
  # Datei des Plot-Erstellen-Menüs. Geladen wird gui/<sprache>/<create-menu>.
  # Dieses Menü enthält Plottypen, Biome, Namen/Beschreibungen, Vorlagen und Kostenbuttons.
  create-menu: create.yml
  # Datei des Mitglieder- und Rollen-Menüs. Geladen wird gui/<sprache>/<members-menu>.
  # Dieses Menü enthält Hinzufügen, Entfernen, Rollen, temporäre Rechte und Profile.
  members-menu: members.yml
  # Datei des Such-Menüs. Geladen wird gui/<sprache>/<search-menu>.
  # Dieses Menü enthält Suche nach Besitzer, Name, Tags, Kategorien und Schnellfilter.
  search-menu: search.yml
  # Datei des Community-Menüs. Geladen wird gui/<sprache>/<community-menu>.
  # Dieses Menü enthält öffentliche Listen, Top-Plots, neue Plots und Teilen/Freunde-Buttons.
  community-menu: community.yml
  # Datei des Report-Menüs. Geladen wird gui/<sprache>/<reports-menu>.
  # Dieses Menü enthält Report-Kategorien und eigene Report-Eingaben.
  reports-menu: reports.yml
  # Datei des Verlaufs-Menüs. Geladen wird gui/<sprache>/<history-menu>.
  # Dieses Menü enthält zuletzt besuchte und häufig genutzte Plotlisten.
  history-menu: history.yml
  # Datei des gefährliche-Aktionen-Menüs. Geladen wird gui/<sprache>/<danger-menu>.
  # Dieses Menü enthält Plot löschen, zurücksetzen und Bestätigungs-/Backup-Einstiege.
  danger-menu: danger.yml
  # Datei des Hilfe-Menüs. Geladen wird gui/<sprache>/<help-menu>.
  # Dieses Menü enthält Hilfe, Commands und nützliche PlotSquared-Übersichten.
  help-menu: help.yml
  # Datei des Flag-Untermenüs. Geladen wird gui/<sprache>/<flags-menu>.
  # Dieses Menü zeigt Boolean-Flags von PlotSquared mit Status und Umschaltfunktion.
  flags-menu: flags.yml
  # Datei des Einstellungs-Untermenüs. Geladen wird gui/<sprache>/<settings-menu>.
  # Dieses Menü enthält Tabs für Plot-Homes, Wetter, Biome und Zeit.
  settings-menu: settings.yml
  # Datei des Team-Untermenüs. Geladen wird gui/<sprache>/<team-menu>.
  # Dieses Menü enthält administrative Plotbackup-Funktionen.
  team-menu: team.yml
  # Datei des Zukunfts-/Premiumfeature-Menüs. Geladen wird gui/<sprache>/<future-menu>.
  # Dieses Menü enthält einzeln abschaltbare Featureprofile für spätere Systeme.
  future-menu: future.yml
  # Button-IDs aus dem Hauptmenü, die nicht angezeigt werden sollen.
  # Damit können Standardbuttons entfernt werden, ohne bestehende GUI-Dateien zu überschreiben.
  hidden-main-buttons:
    - info
    - home
  # Globale Öffnungsanimationen für alle Java-Inventar-GUIs.
  # Bedrock-Forms können technisch keine Inventar-Animation nutzen.
  animations:
    # Wenn true, werden Items beim Öffnen der Java-GUIs nacheinander eingeblendet.
    enabled: true
    # Verzögerung zwischen zwei eingeblendeten Items in Ticks. 1 Tick = 0,05 Sekunden.
    delay-ticks: 1
    # Wenn true, bleibt das Füllitem sofort sichtbar und nur Buttons/Deko/Listeneinträge werden animiert.
    keep-filler-visible: true

# Bedrock-/Floodgate-Unterstützung.
bedrock:
  # Wenn true, erkennt das Plugin Spieler über Floodgate und öffnet das Hauptmenü als Bedrock-Form.
  # Java-Spieler erhalten weiterhin das normale Inventar-GUI.
  enabled: true
  # Wenn true, wird bei Problemen mit Floodgate automatisch das Java-Inventar-Menü geöffnet.
  # Bei false erhält der Spieler nur eine Fehlermeldung.
  fallback-to-java-gui: true

# Meine-Plots-System.
my-plots:
  # Datendatei, in der Favoriten, Tags, Kategorien, Sichtbarkeit und Aktivität gespeichert werden.
  data-file: plotdata.yml

# Report-System.
reports:
  # Aktiviert oder deaktiviert das plugininterne Report-System.
  enabled: true
  # Datendatei, in der alle Reports gespeichert werden.
  data-file: reports.yml

# Rollen- und Rechte-System.
roles:
  # Aktiviert oder deaktiviert das plugininterne Rollen-System.
  enabled: true
  # Datendatei, in der Rollen, Rechte und Mitgliederzuweisungen pro Plot gespeichert werden.
  data-file: plotroles.yml
  # Standardrechte der geschützten Owner-Rolle.
  default-owner-permissions:
    - "*"
  # Standardrechte der geschützten Trusted-Rolle.
  default-trusted-permissions:
    - "build"
    - "interact"
    - "container"

# Teamfunktionen.
team-features:
  # Aktiviert oder deaktiviert die internen Teamfunktionen wie Sperren, Einfrieren und Auditlogs.
  enabled: true
  # Datendatei für Plot-Sperren, Plot-Freezes und Auditlogs.
  data-file: teamdata.yml
  lock:
    # Wenn false, kann das Plugin keine Plots per Teamfunktion sperren.
    enabled: true
  freeze:
    # Wenn false, kann das Plugin keine Plots per Teamfunktion einfrieren.
    enabled: true
  audit:
    # Wenn true, werden Teamaktionen in teamdata.yml gespeichert.
    enabled: true
    # Maximale Anzahl gespeicherter Audit-Einträge.
    max-entries: 500
    # Anzahl Audit-Einträge, die im Chat angezeigt werden.
    show-limit: 10

# Technische Einstellungen.
technical:
  # Wenn true, werden plugininterne YAML-Datendateien asynchron gespeichert.
  async-yaml-saves: true
  # Cache-Zeit in Sekunden für zukünftige Repository-/Datenbanklayer.
  cache-ttl-seconds: 60
  # Anzahl Einträge, die Listen standardmäßig puffern dürfen.
  list-buffer-size: 54

# Zukunftsfeatures.
features:
  # Globale Schalter für spätere Premium-/Zukunftssysteme. Die jeweiligen GUI-Buttons können zusätzlich
  # direkt in gui/<sprache>/future.yml per enabled: false abgeschaltet werden.
  heatmaps: true
  visitor-statistics: true
  ranking: true
  ai-tagging: true
  gallery: true
  templates: true
  auto-backups: true
  undo: true
  redstone-analysis: true
  market: true
  trading: true
  auctions: true
  npcs: false
  discord: false
  web-overview: true

# Zukunftsfeature-System.
future:
  # Aktiviert oder deaktiviert die interne Datendatei für Zukunftsfeatures.
  enabled: true
  # Datendatei für Heatmaps, Besucherstatistiken, Galerie, Markt, NPCs und Analysen.
  data-file: futurefeatures.yml
  heatmaps:
    # Wenn false, werden Heatmap-Aktionen komplett deaktiviert.
    enabled: true
    # Größe einer Heatmap-Zelle in Blöcken. Kleinere Werte ergeben genauere, aber größere Daten.
    cell-size: 16
    # Wie viele aktive Zellen im Chat ausgegeben werden.
    top-cells: 8
  visitor-statistics:
    # Wenn true, werden Plotbesuche und Aufenthaltsdauer beim Betreten/Verlassen eines Plots gezählt.
    enabled: true
  ranking:
    # Wenn false, wird das interne Ranking deaktiviert.
    enabled: true
    # Anzahl der Ranking-Einträge, die im Chat angezeigt werden.
    limit: 10
    weights:
      # Punkte pro Besuch.
      visit: 5
      # Punkte pro Besuchsminute.
      visit-minute: 1
      # Bonus, wenn ein Plot in der Galerie gelistet ist.
      gallery: 20
      # Bonus, wenn ein Plot im Markt/Handel/Auktionssystem gelistet ist.
      market: 10
  ai-tagging:
    # Wenn false, wird das automatische Tagging deaktiviert.
    enabled: true
    # Maximale Anzahl Blöcke, die pro Tagging-Scan geprüft werden.
    max-scanned-blocks: 200000
    # Ab wie vielen Redstone-Komponenten der Tag Redstone gesetzt wird.
    redstone-threshold: 12
    # Ab wie vielen Farmblöcken der Tag Farm gesetzt wird.
    farm-threshold: 20
    # Ab wie vielen shopähnlichen Blöcken der Tag Shop gesetzt wird.
    shop-threshold: 8
    # Ab wie vielen farbigen Blöcken der Tag Pixelart gesetzt wird.
    pixelart-threshold: 80
    # Ab wie vielen soliden Baublöcken der Tag Bauprojekt gesetzt wird.
    build-threshold: 120
  gallery:
    # Wenn false, wird die interne Plot-Galerie deaktiviert.
    enabled: true
    # Anzahl der Galerie-Einträge, die im Chat angezeigt werden.
    list-limit: 10
  templates:
    # Wenn false, werden Template-Profile deaktiviert.
    enabled: true
    # Namen der Templates, die im Chat als Übersicht angezeigt werden.
    names:
      - basic
      - shop
      - farm
      - redstone
  auto-backups:
    # Wenn false, wird der Future-Button für manuelle/automatische Backups deaktiviert.
    enabled: true
  undo:
    # Wenn false, wird der Future-Button zum Wiederherstellen des letzten Backups deaktiviert.
    enabled: true
  redstone-analysis:
    # Wenn false, wird die Redstone-Analyse deaktiviert.
    enabled: true
    # Maximale Anzahl Blöcke, die pro Scan geprüft werden.
    max-scanned-blocks: 250000
    # Ab diesem Score gilt ein Plot als auffällig.
    high-score: 350
    # Ab dieser Menge Redstone-Komponenten gilt ein Plot als auffällig.
    high-components: 96
  market:
    # Wenn false, wird der interne Plotmarkt deaktiviert.
    enabled: true
    # Standardwert, wenn kein Preis oder Hinweis eingegeben wird.
    default-value: VB
    # Anzahl der Markteinträge, die im Chat angezeigt werden.
    list-limit: 10
  trading:
    # Wenn false, wird der interne Plothandel deaktiviert.
    enabled: true
  auctions:
    # Wenn false, wird das interne Auktionsprofil deaktiviert.
    enabled: true
  npcs:
    # Wenn false, wird das NPC-Profil deaktiviert.
    enabled: false
    # Optionaler Spielerbefehl zum Erstellen eines NPCs, falls ein externes NPC-Plugin genutzt wird.
    # Platzhalter: {player}, {uuid}
    spawn-command: ""
    # Optionaler Spielerbefehl zum Entfernen eines NPCs.
    remove-command: ""
  discord:
    # Wenn true, kann das Plugin Discord-Webhooks senden.
    enabled: false
    # Discord-Webhook-URL. Leer lassen, wenn Discord nicht genutzt wird.
    webhook-url: ""
    # Anzeigename des Webhooks.
    username: "CraftplayPlotExtras"
    # Wenn true, werden auffällige Redstone-Scans an Discord gesendet.
    notify-redstone-scans: false
    # Wenn true, werden neue Markt-/Handels-/Auktionseinträge an Discord gesendet.
    notify-market: false
  web-overview:
    # Wenn true, kann das Plugin eine plots.json für Webübersichten exportieren.
    enabled: true
    # Unterordner im Pluginordner für den Webexport.
    folder: web

# Plotbackup-System.
plot-backups:
  # Aktiviert oder deaktiviert das komplette Plotbackup-System.
  enabled: true
  # Unterordner im Pluginordner, in dem .schem-Dateien gespeichert werden.
  folder: Plotbackups
  # Speicherpfad für Backup-Metadaten, wenn storage.type yaml ist.
  # Bei Datenbanken/Redis/MongoDB wird dieser Wert nur als Namespace-Fallback genutzt.
  metadata-file: Plotbackups/metadata.yml
  # Wenn true, wird immer die komplette Bauhöhe der Welt gesichert.
  # Wenn false, werden die Höhen genutzt, die PlotSquared für die Plotregion liefert.
  full-world-height: true
  # Untere Bauhöhe, falls die Serverversion keine eigene Welt-Mindesthöhe liefert.
  fallback-min-y: 0
  # Wenn true, werden Entities mit in die Schematic geschrieben.
  include-entities: true
  # Wenn true, werden Biome mit in die Schematic geschrieben.
  include-biomes: true
  # Wie lange der Plot nach einem Backup oder Restore noch gegen Änderungen geschützt bleibt.
  unlock-delay-ticks: 20
  # Anzeigenamen der Aktionen in Nachrichten und Backup-Dateinamen.
  action-names:
    manual: "Manuelles Backup"
    delete: "Plot löschen"
    unmerge: "Plot trennen"
    reset: "Plot zurücksetzen"
  restore:
    # Wenn true, werden Entities beim Wiederherstellen mit eingefügt.
    paste-entities: true
    # Wenn true, werden Biome beim Wiederherstellen mit eingefügt.
    paste-biomes: true
    # Wenn true, wird Luft aus der Schematic nicht eingefügt.
    # Für vollständige Plot-Wiederherstellung sollte dieser Wert false bleiben.
    ignore-air: false
  intercept:
    # Befehlslabels von PlotSquared, die überwacht werden.
    plot-command-labels:
      - plot
      - plots
      - p
    # Wenn true, wird /plot delete abgefangen und erst nach erfolgreichem Backup ausgeführt.
    delete: true
    # Wenn true, wird /plot unmerge abgefangen und erst nach erfolgreichem Backup ausgeführt.
    unmerge: true
    # Wenn true, wird /plot clear oder /plot reset abgefangen und erst nach erfolgreichem Backup ausgeführt.
    reset: true
    # Befehlsnamen, die als Löschen erkannt werden.
    delete-aliases:
      - delete
      - remove
    # Befehlsnamen, die als Unmerge erkannt werden.
    unmerge-aliases:
      - unmerge
    # Befehlsnamen, die als Zurücksetzen erkannt werden.
    reset-aliases:
      - clear
      - reset
    # Wenn true, führt das Plugin nach dem gesicherten PlotSquared-Befehl automatisch /plot confirm aus.
    # Dadurch muss der Spieler nicht zusätzlich noch die PlotSquared-eigene Bestätigung ausführen.
    auto-run-plotsquared-confirm: true
