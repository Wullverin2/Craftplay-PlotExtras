# English deco menu.
# This file controls the menu where players change a plot wall and border.
# Each wall and border category is its own tab, just like the settings menu.
# Block buttons are distributed automatically inside the tab through the slots list.
# Every button can customize name, slot, material, lore, commands, permission, and close behavior.
# The command plot-deco:<command> first checks that the player is standing on their own plot.
# PlaceholderAPI placeholders work in titles, tab names, button names, lore, and commands.

# File version of this GUI file.
# The plugin uses this value to add new menu options automatically.
file-version: 6

# Inventory title. Placeholder: {tab}
title: "&8Deco: {tab}"
# Inventory size. Valid values are 9, 18, 27, 36, 45, or 54 slots.
size: 54
# Tab that opens when no tab is specified.
default-tab: wall-basic
# If true, the player must stand on a plot to use this menu.
require-plot: true
# Optional base permission for the whole deco menu.
permission: "craftplayplotextras.deco"
# Settings for the Bedrock form through Floodgate.
bedrock:
  enabled: true
  title: "Deco"
  content: "Change the wall and border of your current plot."
# Filler item for empty slots.
filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: "&r"

# Animation when this menu opens.
animation:
  enabled: true
  delay-ticks: 1
  keep-filler-visible: true

# Global buttons shown in every deco tab.
buttons:
  back:
    enabled: true
    slot: 49
    material: ARROW
    name: "&eBack"
    lore:
      - "&7Back to the main menu."
    commands:
      - "open-menu:main"
    close: false
    permission: ""
  close:
    enabled: true
    slot: 53
    material: BARRIER
    name: "&cClose"
    lore:
      - "&7Closes this menu."
    commands: []
    close: true
    permission: ""

# Decoration items shown in every tab without running an action.
decorations:
  frame:
    enabled: true
    slot:
      - 9
      - 17
      - 18
      - 26
      - 27
      - 35
      - 36
      - 44
      - 45
      - 46
      - 47
      - 50
      - 51
      - 52
    material: GRAY_STAINED_GLASS_PANE
    name: "&r"
    lore: []
    permission: ""

# Tabs in the deco menu.
# Wall and border categories live directly below tabs so the layout stays like settings.yml.
