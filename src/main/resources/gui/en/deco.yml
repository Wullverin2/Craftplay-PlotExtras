# English deco menu.
# This file controls the PlotSquared deco menu for wall and border.
# All tabs, buttons, materials, names, lore, slots, permissions, and commands can be adjusted.
# The command plot-deco:<command> first checks that the player is standing on their own plot
# or has a matching plot role/permission, then runs the PlotSquared command.

file-version: 1

title: "&8Deco: {tab}"
size: 54
default-tab: wall-basic
require-plot: true
permission: "craftplayplotextras.deco"
bedrock:
  enabled: true
  title: "Deco"
  content: "Change the wall and border of your current plot."
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
animation:
  enabled: true
  delay-ticks: 1
  keep-filler-visible: true

buttons:
  back: {enabled: true, slot: 49, material: ARROW, name: "&eBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {enabled: true, slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}

decorations:
  frame: {enabled: true, slot: [9, 17, 45, 46, 47, 48, 50, 51, 52], material: GRAY_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}

