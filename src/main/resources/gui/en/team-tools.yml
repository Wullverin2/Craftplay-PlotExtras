# Team tools for support, moderation, management and builders.
title: "&8Team Tools"
permission: "craftplayplotextras.teamtools"
size: 54

fill:
  enabled: true
  material: CYAN_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: SPYGLASS
    name: "&bTeam Overview"
    lore:
      - "&7Quick access for"
      - "&7support and administration."
  requests:
    slot: 10
    permission: "craftplayplotextras.requests.manage"
    material: PAPER
    name: "&bPlot Requests"
    lore:
      - "&7Trust, restore, backup,"
      - "&7move and support."
    actions:
      - "OPEN:team-requests"
  reports:
    slot: 12
    permission: "craftplayplotextras.report.view"
    material: BELL
    name: "&cReports"
    lore:
      - "&7View and close"
      - "&7open plot reports."
    actions:
      - "OPEN:reports"
  moderation:
    slot: 14
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bModeration"
    lore:
      - "&7Freeze, cleanup"
      - "&7and frozen plots."
    actions:
      - "PLAYER_COMMAND:pe mod list"
  performance:
    slot: 16
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&bPerformance"
    lore:
      - "&7Snapshot for the"
      - "&7current plot."
    actions:
      - "PLAYER_COMMAND:pe performance"
  backups:
    slot: 28
    permission: "craftplayplotextras.backup.admin"
    material: CHEST
    name: "&bBackups"
    lore:
      - "&7View and restore"
      - "&7schematic backups."
    actions:
      - "OPEN:backups"
  audit:
    slot: 30
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAudit Log"
    lore:
      - "&7Recent team and"
      - "&7plot actions."
    actions:
      - "OPEN:audit-log"
  redstone:
    slot: 32
    permission: "craftplayplotextras.redstone.notify"
    material: REDSTONE_BLOCK
    name: "&cRedstone Alerts"
    lore:
      - "&7Review lag machine"
      - "&7alerts."
    actions:
      - "OPEN:redstone-alerts"
  builder:
    slot: 34
    permission: "craftplayplotextras.builder.tasks"
    material: BRICKS
    name: "&bBuilder Tasks"
    lore:
      - "&7View builder tasks."
    actions:
      - "OPEN:build-tasks"
  create-backup:
    slot: 37
    permission: "craftplayplotextras.backup.create"
    material: CHEST_MINECART
    name: "&bBackup Current Plot"
    lore:
      - "&7Creates a manual"
      - "&7schematic backup."
    actions:
      - "PLAYER_COMMAND:pe backup create GUI-Team"
  stats:
    slot: 39
    permission: "craftplayplotextras.statistics"
    material: LECTERN
    name: "&bStatistics"
    lore:
      - "&7Profiles, requests,"
      - "&7backups and tasks."
    actions:
      - "OPEN:statistics"
  validate:
    slot: 41
    permission: "craftplayplotextras.config.validate"
    material: KNOWLEDGE_BOOK
    name: "&bConfig Check"
    lore:
      - "&7Checks GUIs and"
      - "&7configuration files."
    actions:
      - "OPEN:config-issues"
  features:
    slot: 42
    permission: "craftplayplotextras.features.manage"
    material: COMPARATOR
    name: "&dFeatures"
    lore:
      - "&7Enable or disable"
      - "&7individual options."
    actions:
      - "OPEN:feature-toggles"
  inspector:
    slot: 43
    permission: "craftplayplotextras.audit.view"
    material: COMPASS
    name: "&bInspector"
    lore:
      - "&7Back to the current"
      - "&7plot inspector."
    actions:
      - "OPEN:team-inspector"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:main"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
