# Competition menu with clickable plot list.
title: "&8Competitions"
size: 54

fill:
  enabled: true
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: GOLDEN_APPLE
    name: "&6Competitions"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Click entries below to teleport."
  join-default:
    slot: 10
    material: EMERALD
    name: "&aEnter Current Plot"
    lore:
      - "&7Registers this plot for"
      - "&7the default competition."
    actions:
      - "PLAYER_COMMAND:pe contest join default GUI entry"
  list-chat:
    slot: 12
    material: PAPER
    name: "&aList in Chat"
    actions:
      - "PLAYER_COMMAND:pe contest list"
  judge-help:
    slot: 14
    permission: "craftplayplotextras.competition.judge"
    material: GOLD_BLOCK
    name: "&6Team Scoring"
    lore:
      - "&7Score in chat:"
      - "&f/pe contest score <id> <0-100> <note>"
  team-tools:
    slot: 16
    permission: "craftplayplotextras.teamtools"
    material: COMPASS
    name: "&bTeam Tools"
    actions:
      - "OPEN:team-tools"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: competitions
  slots: "19-25,28-34,37-43"
  entry-item:
    material: GOLDEN_APPLE
    name: "&6{competition_owner}"
    lore:
      - "&7Competition: &f{competition_name}"
      - "&7Plot: &f{competition_plot_key}"
      - "&7Score: &f{competition_score}"
      - "&8{competition_note}"
      - "&eClick to teleport."
    actions:
      - "TELEPORT_PLOT_KEY:{competition_plot_key}"
  scored-item:
    material: GOLD_BLOCK
    name: "&6{competition_owner} &8- &e{competition_score}"
    lore:
      - "&7Competition: &f{competition_name}"
      - "&7Plot: &f{competition_plot_key}"
      - "&7Scored by: &f{competition_scored_by}"
      - "&8{competition_score_note}"
      - "&eClick to teleport."
    actions:
      - "TELEPORT_PLOT_KEY:{competition_plot_key}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
