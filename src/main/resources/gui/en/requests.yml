# Player view for own plot requests.
title: "&8My Requests"
size: 54

fill:
  enabled: true
  material: YELLOW_STAINED_GLASS_PANE
  name: " "

items:
  trust:
    slot: 10
    material: PLAYER_HEAD
    name: "&aRequest trust"
    actions:
      - "REQUEST_PROMPT:trust"
  backup:
    slot: 12
    material: CHEST
    name: "&aRequest backup"
    actions:
      - "REQUEST_PROMPT:backup"
  restore:
    slot: 14
    material: STRUCTURE_BLOCK
    name: "&aRequest restore"
    actions:
      - "REQUEST_PROMPT:restore"
  support:
    slot: 16
    material: PAPER
    name: "&aRequest support"
    actions:
      - "REQUEST_PROMPT:support"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-requests
  scope: own
  slots: [28,29,30,31,32,33,34,37,38,39,40,41,42,43]
  request-item:
    material: PAPER
    name: "&e{request_id}"
    lore:
      - "&7Type: &f{request_type}"
      - "&7Status: &f{request_status}"
      - "&7Plot: &f{request_plot_key}"
      - "&8{request_note}"
      - "&7Response: &f{request_response}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
