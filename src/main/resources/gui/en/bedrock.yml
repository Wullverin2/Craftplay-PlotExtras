# English Bedrock main menu.
# This file controls the main menu for Bedrock players through Floodgate forms.
# It is intentionally separate from the Java inventory GUI in main.yml.
# Each button can run custom commands. Prefixes: console:, player:, op:, open-menu:.
# PlaceholderAPI placeholders work in the title, content, labels, and commands.

# File version of this GUI file.
# The plugin uses this value to add new menu options automatically.
file-version: 9

# If false, this Bedrock menu is not loaded.
enabled: true
# Bedrock form title.
title: "Plot Menu"
# Text shown above the Bedrock buttons.
content: "Choose what you want to do with your plots."
# Default sound played when a button is selected.
click-sound:
  # If true, players hear a button sound when they click.
  enabled: true
  # Bukkit sound name.
  sound: UI_BUTTON_CLICK
  # Sound volume.
  volume: 0.8
  # Sound pitch.
  pitch: 1.0
# Button IDs hidden from the Bedrock form.
hidden-buttons: []
# All buttons in the Bedrock form.
buttons:
  my-plots:
    enabled: true
    # Order in the form. Smaller numbers are shown first.
    order: 10
    # Text shown on the Bedrock button.
    label: "My Plots"
    # Commands run as the player. Prefix with console: to run as console.
    commands:
      - "open-menu:myplots"
    # If true, the form closes after clicking.
    close: false
    # Optional permission required to see the button.
    permission: ""
  search:
    enabled: true
    order: 20
    label: "Search Plot"
    commands:
      - "open-menu:search"
    close: false
    permission: ""
  create:
    enabled: true
    order: 30
    label: "Create Plot"
    commands:
      - "open-menu:create:types"
    close: false
    permission: "plots.auto"
  favorites:
    enabled: true
    order: 40
    label: "Favorites"
    commands:
      - "open-menu:myplots:1:name:favorites"
    close: false
    permission: ""
  community:
    enabled: true
    order: 50
    label: "Community"
    commands:
      - "open-menu:community"
    close: false
    permission: ""
  members:
    enabled: true
    order: 60
    label: "Members"
    commands:
      - "open-menu:members:overview"
    close: false
    permission: ""
  roles:
    enabled: true
    order: 70
    label: "Rights & Roles"
    commands:
      - "open-menu:members:roles"
    close: false
    permission: ""
  flags:
    enabled: true
    order: 80
    label: "Flags"
    commands:
      - "open-menu:flags"
    close: true
    permission: ""
  settings:
    enabled: true
    order: 90
    label: "Settings"
    commands:
      - "open-menu:settings:homes"
    close: true
    permission: ""
  deco:
    enabled: true
    order: 95
    label: "Deco"
    commands:
      - "open-menu:deco:wall:basic"
    close: false
    permission: "craftplayplotextras.deco"
  reports:
    enabled: true
    order: 100
    label: "Reports"
    commands:
      - "open-menu:reports"
    close: false
    permission: ""
  history:
    enabled: true
    order: 110
    label: "History"
    commands:
      - "open-menu:history"
    close: false
    permission: ""
  help:
    enabled: true
    order: 120
    label: "Help"
    commands:
      - "open-menu:help"
    close: false
    permission: ""
  team:
    enabled: true
    order: 130
    label: "Staff"
    commands:
      - "open-menu:team"
    close: true
    permission: "craftplayplotextras.team"
  danger:
    enabled: true
    order: 125
    label: "Delete & Reset"
    commands:
      - "open-menu:danger"
    close: false
    permission: ""
  extras:
    enabled: true
    order: 127
    label: "Extras"
    commands:
      - "open-menu:extras"
