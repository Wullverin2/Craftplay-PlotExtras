# Player tools for plot profile, search, guestbook, requests and cleanup.
title: "&8Plot Tools"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: COMPASS
    name: "&eTool Overview"
    lore:
      - "&7Category: &f{plot_category}"
      - "&7Tags: &f{plot_tags}"
      - "&7Visit mode: &f{plot_access_mode}"
      - "&7Guestbook: &f{plot_guestbook_entries}"
      - "&7Open requests: &f{plot_open_requests}"
  assistant:
    slot: 10
    material: KNOWLEDGE_BOOK
    name: "&aPlot Assistant"
    lore:
      - "&7Shows the most useful"
      - "&7next steps for your plot."
    actions:
      - "SHOW_ASSISTANT"
  profile:
    slot: 12
    material: NAME_TAG
    name: "&aPlot Profile"
    lore:
      - "&7Description, category,"
      - "&7tags and visit mode."
    actions:
      - "OPEN:plot-profile"
  guestbook:
    slot: 14
    material: WRITABLE_BOOK
    name: "&aGuestbook"
    lore:
      - "&7View entries or"
      - "&7write one by command."
    actions:
      - "OPEN:guestbook"
  search:
    slot: 16
    material: SPYGLASS
    name: "&aPlot Search"
    lore:
      - "&7Search tags,"
      - "&7categories and text."
      - "&8Query is entered in chat."
    actions:
      - "OPEN:plot-search"
  favorite:
    slot: 28
    material: EMERALD
    name: "&aToggle Favorite"
    lore:
      - "&7Saves or removes"
      - "&7this plot from your list."
    actions:
      - "TOGGLE_PLOT_LIKE"
  own-requests:
    slot: 30
    material: PAPER
    name: "&aMy Requests"
    lore:
      - "&7Shows your open and"
      - "&7handled plot requests."
    actions:
      - "OPEN:requests"
  trust-request:
    slot: 32
    material: PLAYER_HEAD
    name: "&aRequest Trust"
    lore:
      - "&7Creates a trust request"
      - "&7for the current plot."
    actions:
      - "REQUEST_PROMPT:trust"
  selfcheck:
    slot: 34
    material: CLOCK
    name: "&aSelf Check"
    lore:
      - "&7Shows entities and"
      - "&7performance hints."
    actions:
      - "SHOW_SELFCHECK"
  cleanup:
    slot: 40
    material: HOPPER
    name: "&aClean Drops"
    lore:
      - "&7Removes drops on"
      - "&7your own plot."
    actions:
      - "OPEN:cleanup"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-dashboard"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
