# English plot creation menu.
# This file controls plot creation, plot types, biomes, names, descriptions, templates, and cost buttons.
# Every button is configurable: slot, material, name, lore, commands, permission, and optional bedrock-label.
# Use chat-input:<message-key>:<command with {input}> for private chat input.

# File version of this GUI file.
# The plugin adds new defaults automatically without overwriting existing values.
file-version: 1

title: "&8Create Plot: {tab}"
bedrock:
  enabled: true
  title: "Create Plot"
  content: "Choose an area and create or customize your plot."
size: 54
default-tab: types
require-plot: false
permission: "craftplayplotextras.use"
filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: "&r"
buttons:
  back:
    slot: 49
    material: ARROW
    name: "&eBack"
    lore: ["&7Back to the main menu."]
    commands: ["open-menu:main"]
    close: false
    permission: ""
  close:
    slot: 53
    material: BARRIER
    name: "&cClose"
    lore: ["&7Closes this menu."]
    commands: []
    close: true
    permission: ""
decorations:
  border:
    slot: [0, 8, 45, 46, 47, 48, 50, 51, 52]
    material: GRAY_STAINED_GLASS_PANE
    name: "&r"
    lore: []
    permission: ""
tabs:
  types:
    slot: 10
    material: GRASS_BLOCK
    name: "&aPlot Types"
    lore: ["&7Standard, large,", "&7farm, pixel art, and more."]
    commands: ["open-menu:create:types"]
    permission: ""
    buttons:
      standard: {slot: 19, material: GRASS_BLOCK, name: "&aStandard Plot", lore: ["&7Claims a normal free plot.", "&8Command: /plot auto"], commands: ["plot auto"], close: true, permission: "plots.auto"}
      large: {slot: 20, material: EMERALD_BLOCK, name: "&aLarge Plot", lore: ["&7Default command is configurable.", "&7Adjust it to your plot world."], commands: ["plot auto"], close: true, permission: "plots.auto"}
      merge: {slot: 21, material: MAP, name: "&aMerge Plot", lore: ["&7Creates a plot first.", "&7Merging depends on your server setup."], commands: ["plot auto"], close: true, permission: "plots.auto"}
      farm: {slot: 22, material: WHEAT, name: "&aFarm Plot", lore: ["&7Creates a plot for farms.", "&7Command can be changed."], commands: ["plot auto"], close: true, permission: "plots.auto"}
      pixelart: {slot: 23, material: WHITE_CONCRETE, name: "&aPixel Art Plot", lore: ["&7Creates a plot for pixel art.", "&7Command can be changed."], commands: ["plot auto"], close: true, permission: "plots.auto"}
      redstone: {slot: 24, material: REDSTONE, name: "&aRedstone Plot", lore: ["&7Creates a plot for redstone.", "&7Command can be changed."], commands: ["plot auto"], close: true, permission: "plots.auto"}
      premium: {slot: 25, material: GOLD_BLOCK, name: "&6Premium Plot", lore: ["&7Premium plot type with its own permission.", "&7Costs can be added through commands."], commands: ["plot auto"], close: true, permission: "craftplayplotextras.create.premium"}
  biome:
    slot: 12
    material: OAK_SAPLING
    name: "&aChoose Biome"
    lore: ["&7Set a biome after creating", "&7or while standing on a plot."]
    commands: ["open-menu:create:biome"]
    permission: ""
    buttons:
      plains: {slot: 19, material: GRASS_BLOCK, name: "&aPlains", lore: ["&7Sets biome plains."], commands: ["plot biome plains"], close: false, permission: "plots.set.biome"}
      forest: {slot: 20, material: OAK_LOG, name: "&aForest", lore: ["&7Sets biome forest."], commands: ["plot biome forest"], close: false, permission: "plots.set.biome"}
      desert: {slot: 21, material: SAND, name: "&eDesert", lore: ["&7Sets biome desert."], commands: ["plot biome desert"], close: false, permission: "plots.set.biome"}
      jungle: {slot: 22, material: JUNGLE_LOG, name: "&aJungle", lore: ["&7Sets biome jungle."], commands: ["plot biome jungle"], close: false, permission: "plots.set.biome"}
      snow: {slot: 23, material: SNOW_BLOCK, name: "&bSnow", lore: ["&7Sets biome snow."], commands: ["plot biome snowy_plains"], close: false, permission: "plots.set.biome"}
      swamp: {slot: 24, material: VINE, name: "&2Swamp", lore: ["&7Sets biome swamp."], commands: ["plot biome swamp"], close: false, permission: "plots.set.biome"}
      nether: {slot: 25, material: NETHERRACK, name: "&cNether", lore: ["&7Sets biome nether."], commands: ["plot biome nether_wastes"], close: false, permission: "plots.set.biome"}
  data:
    slot: 14
    material: NAME_TAG
    name: "&aName & Description"
    lore: ["&7Set alias, description,", "&7and starting position."]
    commands: ["open-menu:create:data"]
    permission: ""
    buttons:
      name: {slot: 21, material: NAME_TAG, name: "&aSet Plot Name", lore: ["&7Asks for the name privately in chat."], commands: ["chat-input:chat-plot-name:plot alias set {input}"], close: true, permission: "plots.set.alias"}
      description: {slot: 22, material: WRITABLE_BOOK, name: "&aSet Description", lore: ["&7Asks for the description privately in chat."], commands: ["chat-input:chat-plot-description:plot desc {input}"], close: true, permission: "plots.set.desc"}
      home: {slot: 23, material: LODESTONE, name: "&aSet Start Position", lore: ["&7Sets your plot home to your position."], commands: ["plot sethome"], close: false, permission: "plots.set.home"}
  templates:
    slot: 16
    material: FILLED_MAP
    name: "&aTemplates"
    lore: ["&7Schematic and theme buttons.", "&7Commands depend on your server setup."]
    commands: ["open-menu:create:templates"]
    permission: ""
    buttons:
      basic: {slot: 20, material: PAPER, name: "&aBasic Template", lore: ["&7Example template button.", "&7Adjust the command to your setup."], commands: ["plot schematic paste basic"], close: true, permission: "plots.schematic.paste"}
      garden: {slot: 22, material: OAK_LEAVES, name: "&aGarden Theme", lore: ["&7Example theme button."], commands: ["plot schematic paste garden"], close: true, permission: "plots.schematic.paste"}
      city: {slot: 24, material: STONE_BRICKS, name: "&aCity Theme", lore: ["&7Example theme button."], commands: ["plot schematic paste city"], close: true, permission: "plots.schematic.paste"}
