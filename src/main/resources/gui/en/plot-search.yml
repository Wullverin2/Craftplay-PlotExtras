# Plot search with chat input and clickable results.
title: "&8Plot Search"
size: 54

fill:
  enabled: true
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  name: " "

items:
  search:
    slot: 4
    material: SPYGLASS
    name: "&aStart search"
    lore:
      - "&7Click, then type a"
      - "&7keyword, tag or category."
    actions:
      - "SEARCH_PLOTS_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-search
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  result-item:
    material: COMPASS
    name: "&a{result_owner}"
    lore:
      - "&7Plot: &f{result_plot_key}"
      - "&7Category: &f{result_category}"
      - "&7Tags: &f{result_tags}"
      - "&8{result_description}"
      - "&eClick to teleport."
    actions:
      - "TELEPORT_PLOT_KEY:{result_plot_key}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
