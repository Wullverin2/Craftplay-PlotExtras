# English flag submenu.
# This file controls the menu where players see and toggle Boolean flags of their current plot.
# All names, slots, materials, and descriptions can be changed here.
# Buttons, decorations, and flag entries can use slot: 13, slot: [13, 14, 15], or slots: [13, 14, 15].
# Static buttons and decorations optionally support head-database-id for HeadDatabase heads.
# Player heads on static buttons and decorations can use material: PLAYERHEAD %player_name% or skull-owner: "%player_name%".
# PlaceholderAPI placeholders work in titles, static buttons, decorations, names, lore, and commands.

# File version of this GUI file.
# The plugin uses this value to add new menu options automatically.
file-version: 7

# Inventory title.
title: "&8Plot Flags"
# Inventory size. Allowed values are 9, 18, 27, 36, 45, or 54 slots.
size: 54
# Delay in ticks before the menu refreshes after toggling a flag.
reopen-delay-ticks: 2
# Text inserted into lore for enabled and disabled flags.
status:
  # Display for an enabled flag.
  enabled: "&aEnabled"
  # Display for a disabled flag.
  disabled: "&cDisabled"
# Filler item for empty slots.
filler:
  # If true, empty slots are filled with the material below.
  enabled: true
  # Minecraft/Spigot material name.
  material: BLACK_STAINED_GLASS_PANE
  # Display name of the filler item. &r keeps it visually empty.
  name: "&r"
# Static buttons in this menu.
buttons:
  back:
    # Inventory slot. 0 is the top-left slot.
    slot: 49
    # Item shown for this button.
    material: BARRIER
    # Optional HeadDatabase ID for this button. Empty means the material is used.
    head-database-id: ""
    # Button display name.
    name: "&cBack"
    # Description below the button name.
    lore:
      - "&7Back to the main menu."
    # Internal action: opens the main menu again.
    commands:
      - "open-menu:main"
    # If true, the menu closes after clicking.
    close: false
    # Optional permission required to see the button.
    permission: ""
  previous-page:
    # Inventory slot. This button is visible on every page.
    slot: 50
    # Item shown for this button.
    material: ARROW
    # Optional HeadDatabase ID for this button.
    head-database-id: ""
    # Button display name.
    name: "&ePage 1"
    # Description below the button name.
    lore:
      - "&7Open the first flag page."
    # Internal action: opens page 1 of the flag menu.
    commands:
      - "open-menu:flags:1"
    # If true, the menu closes after clicking.
    close: false
    # Optional permission required to see the button.
    permission: ""
  next-page:
    # Inventory slot. This button is visible on every page.
    slot: 51
    # Item shown for this button.
    material: ARROW
    # Optional HeadDatabase ID for this button.
    head-database-id: ""
    # Button display name.
    name: "&ePage 2"
    # Description below the button name.
    lore:
      - "&7Open the second flag page."
    # Internal action: opens page 2 of the flag menu.
    commands:
      - "open-menu:flags:2"
    # If true, the menu closes after clicking.
    close: false
    # Optional permission required to see the button.
    permission: ""
  close:
    # Inventory slot.
    slot: 53
    # Material fallback when no HeadDatabase ID is set.
    material: BARRIER
    # Optional HeadDatabase ID for this button.
    head-database-id: ""
    # Button display name.
    name: "&cClose"
    # Description below the button name.
    lore:
      - "&7Closes this menu."
    # No commands needed because close below is true.
    commands: []
    # If true, the menu closes after clicking.
    close: true
    # Optional permission required to see the button.
    permission: ""
  category-general:
    # Category button for general flags.
    slot: 45
    material: BOOK
    name: "&aCategory: General"
    lore:
      - "&7Shows PvP, flight,"
      - "&7notifications, and visits."
    commands:
      - "open-menu:flags:1"
    close: false
    permission: ""
  category-technical:
    # Category button for technical flags.
    slot: 46
    material: REDSTONE
    name: "&aCategory: Technical"
    lore:
      - "&7Shows redstone, hoppers,"
      - "&7pistons, and growth."
    commands:
      - "open-menu:flags:2"
    close: false
    permission: ""
  search:
    # Search button for servers using PlotSquared flag lists.
    slot: 47
    material: COMPASS
    name: "&aSearch Flag"
    lore:
      - "&7Opens the PlotSquared flag list."
      - "&7GUI flags remain permission-based."
    commands:
      - "plot flag list"
    close: true
    permission: "plots.flag"
  favorites:
    # Favorite view. By default it opens the first flag page and can be freely changed.
    slot: 48
    material: NETHER_STAR
    name: "&eFavorite Flags"
    lore:
      - "&7Default favorite view."
      - "&7Adjust the page/buttons freely."
    commands:
      - "open-menu:flags:1"
    close: false
    permission: ""
# Decoration items are visual-only items without an action.
# They can use material, HeadDatabase ID, name, lore, slot, and permission.
decorations:
  control-spacer:
    # Inventory slot.
    slot: 52
    # Material fallback.
    material: GRAY_STAINED_GLASS_PANE
    # Optional HeadDatabase ID. Example: "12345"
    head-database-id: ""
    # Decoration display name.
    name: "&r"
    # Decoration lore.
    lore: []
    # Optional permission required to see this decoration.
    permission: ""
