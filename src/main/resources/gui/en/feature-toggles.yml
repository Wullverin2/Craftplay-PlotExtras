# Admin GUI for individual feature switches from features.yml.
title: "&8Feature Toggles"
size: 54

fill:
  enabled: true
  material: PURPLE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: COMPARATOR
    name: "&dFeature Toggles"
    lore:
      - "&7Click a feature"
      - "&7to toggle it."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: feature-toggles
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  enabled-item:
    material: LIME_DYE
    name: "&a{feature}"
    lore:
      - "&7State: {feature_state_color}{feature_state}"
      - "&eClick to toggle."
  disabled-item:
    material: GRAY_DYE
    name: "&c{feature}"
    lore:
      - "&7State: {feature_state_color}{feature_state}"
      - "&eClick to toggle."
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
