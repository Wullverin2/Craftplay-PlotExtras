# Visual config check output.
title: "&8Config Check"
permission: "craftplayplotextras.config.validate"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: KNOWLEDGE_BOOK
    name: "&bConfig issues"
    lore:
      - "&7Shows invalid materials,"
      - "&7slots and missing files."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: config-issues
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  issue-item:
    material: PAPER
    name: "&cIssue #{issue_number}"
    lore:
      - "&f{issue}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
