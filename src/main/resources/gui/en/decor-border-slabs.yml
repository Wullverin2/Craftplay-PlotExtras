# Decor GUI: Border category slabs.
title: "&8Border: Slabs"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  tab-wall:
    slot: 10
    material: STONE_BRICKS
    name: "&eWall"
    lore:
      - "&7Opens the wall categories."
    actions:
      - "OPEN:decor"
  tab-border:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&aBorder"
    lore:
      - "&7Active tab"
    glow: true
  categories:
    slot: 45
    material: ARROW
    name: "&eBorder Categories"
    actions:
      - "OPEN:decor-border"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: components
  components:
    - border
  categories:
    - slabs
  slots: "19-25,28-34,37-43"
  option-item:
    name: "&a{option_display}"
    lore:
      - "&7Category: &f{category_display}"
      - "&7Click to set the border to this slab."
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNext Page"
