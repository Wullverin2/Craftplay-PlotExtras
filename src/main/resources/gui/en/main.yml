# Main GUI for English.
# title, size, fill, items, slots, material, name, lore, HeadDatabase and actions can be customized freely.
title: "&8Plot Menu"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot Overview"
    lore:
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&7Money: &f{cmi_money}"
      - "&7Jobs: &f{jobs}"
      - "&7Quests: &f{quests_completed}&7/&f{quests_total}"
      - "&8Current plot: &f{plot_id}"
    actions:
      - "OPEN:plot-dashboard"
  dashboard:
    slot: 19
    material: MAP
    name: "&aDashboard"
    lore:
      - "&7Status, notes, warps"
      - "&7and quick actions."
    actions:
      - "OPEN:plot-dashboard"
  settings:
    slot: 20
    material: COMPARATOR
    name: "&aPlot Settings"
    lore:
      - "&7Home, weather, time"
      - "&7and plot biome."
    actions:
      - "OPEN:settings"
  flags:
    slot: 21
    material: REDSTONE_TORCH
    name: "&aPlot Flags"
    lore:
      - "&7Toggle PlotSquared flags"
      - "&7on or off."
    actions:
      - "OPEN:flags"
  decor:
    slot: 22
    material: GRASS_BLOCK
    name: "&aDecor"
    lore:
      - "&7Change wall and border"
      - "&7for your current plot."
    actions:
      - "OPEN:decor"
  members:
    slot: 23
    material: PLAYER_HEAD
    name: "&aMembers"
    lore:
      - "&7Members, trusts,"
      - "&7denies and roles."
    actions:
      - "OPEN:members"
  entity-limits:
    slot: 24
    material: ARMOR_STAND
    name: "&aEntity Limits"
    lore:
      - "&7Shows current entities"
      - "&7and maximum values."
    actions:
      - "OPEN:entity-limits"
  language:
    slot: 25
    material: WRITABLE_BOOK
    name: "&aLanguage"
    lore:
      - "&7Current: &f{language}"
      - "&7Languages load automatically."
    actions:
      - "OPEN_LANGUAGE"
  report:
    slot: 30
    material: BELL
    name: "&cReport Plot"
    lore:
      - "&7Sends a report for"
      - "&7the current plot to staff."
    actions:
      - "CREATE_REPORT:GUI report"
  contest:
    slot: 32
    material: GOLDEN_APPLE
    name: "&6Competition"
    lore:
      - "&7Registers this plot for"
      - "&7the default competition."
    actions:
      - "OPEN:competitions"
  tools:
    slot: 31
    material: COMPASS
    name: "&aTools"
    lore:
      - "&7Plot profile, search,"
      - "&7guestbook and cleanup."
    actions:
      - "OPEN:plot-tools"
  team-inspector:
    slot: 46
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bTeam Inspector"
    lore:
      - "&7Support data, logs"
      - "&7and staff tools."
    actions:
      - "OPEN:team-inspector"
  audit-log:
    slot: 47
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAudit Log"
    lore:
      - "&7Shows recent"
      - "&7plot actions."
    actions:
      - "OPEN:audit-log"
  team-tools:
    slot: 48
    permission: "craftplayplotextras.teamtools"
    material: COMPASS
    name: "&bTeam Tools"
    lore:
      - "&7Requests, reports,"
      - "&7builders and statistics."
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    lore:
      - "&7Close this window."
    actions:
      - "CLOSE"
