# English main GUI.
# title, size, fill, items, slots, material, name, lore, HeadDatabase and actions can be changed freely.
title: "&8Plot Menu"
size: 54

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  flags:
    slot: 20
    material: REDSTONE_TORCH
    name: "&aPlot Flags"
    lore:
      - "&7Toggle PlotSquared flags."
      - "&8Current plot: &f{plot_id}"
    actions:
      - "OPEN:flags"
  decor:
    slot: 22
    material: GRASS_BLOCK
    name: "&aDecor"
    lore:
      - "&7Change wall and border blocks."
      - "&8Only for your current plot."
    actions:
      - "OPEN:decor"
  members:
    slot: 24
    material: PLAYER_HEAD
    name: "&aMembers"
    lore:
      - "&7View owner, members,"
      - "&7trusted and denied players."
    actions:
      - "OPEN:members"
  settings:
    slot: 30
    material: COMPARATOR
    name: "&aPlot Settings"
    lore:
      - "&7Info and quick actions."
      - "&8Owner: &f{plot_owner}"
    actions:
      - "OPEN:settings"
  entity-limits:
    slot: 31
    material: ARMOR_STAND
    name: "&aEntity Limits"
    lore:
      - "&7Shows current and maximum"
      - "&7entities for this plot."
    actions:
      - "OPEN:entity-limits"
  language:
    slot: 32
    material: WRITABLE_BOOK
    name: "&aLanguage"
    lore:
      - "&7Current: &f{language}"
      - "&7Available files are loaded automatically."
    actions:
      - "OPEN_LANGUAGE"
  info:
    slot: 13
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot Info"
    lore:
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&7Money: &f{cmi_money}"
      - "&7Jobs: &f{jobs}"
      - "&7Quests: &f{quests_completed}&7/&f{quests_total}"
    actions:
      - "OPEN:settings"
  team-inspector:
    slot: 46
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bTeam Inspector"
    lore:
      - "&7Review plot, logs and"
      - "&7support data."
    actions:
      - "OPEN:team-inspector"
  audit-log:
    slot: 47
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAudit Log"
    lore:
      - "&7Shows recent plot actions."
    actions:
      - "OPEN:audit-log"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    lore:
      - "&7Close this menu."
    actions:
      - "CLOSE"
