# English main menu.
# This file controls the main menu for English players.
# Here you configure title, size, filler items, decorations, sounds, animations, and all Java buttons.
# Each button can run custom commands. Prefixes: console:, player:, op:, open-menu:.
# Buttons and decorations can use slot: 13, slot: [13, 14, 15], or slots: [13, 14, 15].
# Optionally, a HeadDatabase head can be used with head-database-id instead of the material.
# Player heads can use material: PLAYERHEAD %player_name% or skull-owner: "%player_name%".
# PlaceholderAPI placeholders work in titles, names, lore, and commands.

# File version of this GUI file.
# The plugin uses this value to add new menu options automatically.
file-version: 15

# Inventory title.
title: "&8Plot Menu"
# Inventory size. Allowed values are 9, 18, 27, 36, 45, or 54 slots.
size: 27
# Filler item for empty slots.
filler:
  # If true, empty slots are filled with the material below.
  enabled: true
  # Minecraft/Spigot material name.
  material: BLACK_STAINED_GLASS_PANE
  # Display name of the filler item. &r keeps it visually empty.
  name: "&r"
# Sound played when the main menu opens.
open-sound:
  # If true, the player hears this sound when the menu opens.
  enabled: true
  # Bukkit sound name.
  sound: BLOCK_NOTE_BLOCK_PLING
  # Sound volume.
  volume: 0.6
  # Sound pitch.
  pitch: 1.25
# Default click sound for buttons in this menu.
click-sound:
  # If true, players hear a button sound when they click.
  enabled: true
  # Bukkit sound name.
  sound: UI_BUTTON_CLICK
  # Sound volume.
  volume: 0.8
  # Sound pitch.
  pitch: 1.0
# Simple opening animation for the Java inventory.
animation:
  # If true, buttons are revealed one after another.
  enabled: true
  # Delay between two revealed buttons in ticks.
  delay-ticks: 1
  keep-filler-visible: true
# All buttons in this menu.
buttons:
  my-plots:
    enabled: true
    # Inventory slot. 0 is the top-left slot.
    slot: 1
    # Item shown for this button.
    material: GRASS_BLOCK
    # Button display name.
    name: "&aMy Plots"
    # Description below the button name.
    lore:
      - "&7Shows your own plots."
      - "&7With sorting, favorites,"
      - "&7tags, categories, and details."
    # Commands run as the player. Prefix with console: to run as console.
    commands:
      - "open-menu:myplots"
    # If true, the menu closes after clicking.
    close: false
    # Optional permission required to see the button.
    permission: ""
  search:
    enabled: true
    slot: 2
    material: COMPASS
    name: "&aSearch Plot"
    lore:
      - "&7Search by owner,"
      - "&7name, tags, and category."
    commands:
      - "open-menu:search"
    close: false
    permission: ""
  create:
    enabled: true
    slot: 3
    material: EMERALD_BLOCK
    name: "&aCreate Plot"
    lore:
      - "&7Opens plot types, biomes,"
      - "&7templates, and plot data."
    commands:
      - "open-menu:create:types"
    close: false
    permission: "plots.auto"
  favorites:
    enabled: true
    slot: 4
    material: NETHER_STAR
    name: "&aFavorites"
    lore:
      - "&7Opens your favorite plots"
      - "&7inside the My Plots menu."
    commands:
      - "open-menu:myplots:1:name:favorites"
    close: false
    permission: ""
  community:
    enabled: true
    slot: 5
    material: SUNFLOWER
    name: "&aCommunity"
    lore:
      - "&7Opens public and popular"
      - "&7community plot lists."
    commands:
      - "open-menu:community"
    close: false
    permission: ""
  members:
    enabled: true
    slot: 12
    material: PLAYER_HEAD
    name: "&aMembers"
    lore:
      - "&7Manage Added, Trusted,"
      - "&7Denied, and custom roles."
    commands:
      - "open-menu:members:overview"
    close: false
    permission: ""
  roles:
    enabled: true
    slot: 7
    material: WRITABLE_BOOK
    name: "&aRights & Roles"
    lore:
      - "&7Opens the current"
      - "&7member and rights overview."
    commands:
      - "open-menu:members:roles"
    close: false
    permission: ""
  flags:
    enabled: true
    slot: 14
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Opens the flag menu"
      - "&7with status and toggles."
    commands:
      - "open-menu:flags"
    close: false
    permission: ""
  settings:
    enabled: true
    slot: 15
    material: REPEATER
    name: "&aSettings"
    lore:
      - "&7Opens homes, weather,"
      - "&7biomes, and time."
    commands:
      - "open-menu:settings:homes"
    close: false
    permission: ""
  reports:
    enabled: true
    slot: 10
    material: BELL
    name: "&eReports"
    lore:
      - "&7Reports a plot directly"
      - "&7through PlotSquared."
    commands:
      - "open-menu:reports"
    close: false
    permission: ""
  history:
    enabled: true
    slot: 11
    material: CLOCK
    name: "&aHistory"
    lore:
      - "&7Opens recently visited"
      - "&7or saved plot lists."
    commands:
      - "open-menu:history"
    close: false
    permission: ""
  help:
    enabled: true
    slot: 16
    material: BOOK
    name: "&bHelp"
    lore:
      - "&7Opens help, commands,"
      - "&7and shortcuts."
    commands:
      - "open-menu:help"
    close: false
    permission: ""
  team:
    enabled: true
    slot: 13
    material: COMMAND_BLOCK
    name: "&cStaff"
    lore:
      - "&7Opens staff tools"
      - "&7for plot backups."
    commands:
      - "open-menu:team"
    close: false
    permission: "craftplayplotextras.team"
  danger:
    enabled: true
    slot: 6
    material: TNT
    name: "&cDelete & Reset"
    lore:
      - "&7Safe actions for"
      - "&7delete, reset, and backup."
    commands:
      - "open-menu:danger"
    close: false
    permission: ""
  future:
    enabled: true
    slot: 21
    material: BEACON
    name: "&dFuture"
    lore:
      - "&7Optional feature profiles"
      - "&7for staff and premium systems."
    commands:
      - "open-menu:future"
    close: false
    permission: "craftplayplotextras.future"
  extras:
    enabled: true
    slot: 20
    material: CHEST
    name: "&aExtras"
    lore:
      - "&7Opens additional"
      - "&7services for your plot."
    commands:
      - "open-menu:extras"
    close: false
    permission: ""
  close:
    enabled: true
    slot: 22
    material: BARRIER
    head-database-id: ""
    name: "&cClose"
    lore:
      - "&7Closes this menu."
    commands: []
    close: true
    permission: ""
# Decoration items are visual-only items without an action.
# They can also use material, HeadDatabase ID, name, lore, slot, and permission.
decorations:
  top-border:
    enabled: true
    # Inventory slots.
    slot: [0, 8]
    # Material fallback.
    material: GRAY_STAINED_GLASS_PANE
    # Optional HeadDatabase ID. Example: "12345"
    head-database-id: ""
    # Decoration display name.
    name: "&r"
    # Decoration lore.
    lore: []
    # Optional permission required to see this decoration.
    permission: ""
  side-border:
    enabled: true
    slot: [9, 17]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
  bottom-border:
    enabled: true
    slot: [18, 19, 20, 21, 23, 24, 25, 26]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
