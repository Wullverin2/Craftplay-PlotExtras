# Staff GUI for support, moderation and administration.
title: "&8Team Inspector"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 13
    material: SPYGLASS
    name: "&bPlot Overview"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Owner: &f{plot_owner}"
      - "&7Role here: &f{plot_role}"
      - "&7Members: &f{plot_members}"
      - "&7Trusted: &f{plot_trusted}"
      - "&7Denied: &f{plot_denied}"
      - "&7Plot limit: &f{plot_count}&7/&f{plot_max}"
      - "&7Status: &f{plot_status_display}"
      - "&7Visits: &f{plot_visits}"
      - "&7Favorites: &f{plot_likes}"
      - "&7Team note: &f{plot_team_note}"
  audit:
    slot: 20
    material: WRITABLE_BOOK
    name: "&aAudit Log"
    lore:
      - "&7Recent plot and staff actions."
    actions:
      - "OPEN:audit-log"
  backups:
    slot: 21
    material: CHEST
    name: "&aBackups"
    lore:
      - "&7View backups and prepare restores."
    actions:
      - "OPEN:backups"
  members:
    slot: 22
    material: PLAYER_HEAD
    name: "&aMembers and Roles"
    lore:
      - "&7Opens member management."
    actions:
      - "OPEN:members"
  flags:
    slot: 23
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Review and edit plot flags."
    actions:
      - "OPEN:flags"
  limits:
    slot: 24
    material: ARMOR_STAND
    name: "&aEntity Limits"
    lore:
      - "&7Shows entities and limits."
    actions:
      - "OPEN:entity-limits"
  redstone-enable:
    slot: 31
    material: REDSTONE_BLOCK
    name: "&cEnable Redstone"
    lore:
      - "&7Re-enables redstone on"
      - "&7the current plot."
    actions:
      - "PLAYER_COMMAND:pe redstone enable"
  redstone-alerts:
    slot: 32
    material: TARGET
    name: "&cRedstone Alerts"
    lore:
      - "&7Open redstone lag alerts"
      - "&7with teleport and release."
    actions:
      - "OPEN:redstone-alerts"
  plot-info:
    slot: 33
    material: PAPER
    name: "&aPlotSquared Info"
    lore:
      - "&7Runs /plot info."
    commands:
      - "player:plot info"
  status-checked:
    slot: 37
    permission: "craftplayplotextras.plotmeta.status"
    material: LIME_DYE
    name: "&aStatus: Team Checked"
    actions:
      - "SET_PLOT_STATUS:team-checked"
  status-watch:
    slot: 38
    permission: "craftplayplotextras.plotmeta.status"
    material: ORANGE_DYE
    name: "&6Status: Under Watch"
    actions:
      - "SET_PLOT_STATUS:under-watch"
  status-locked:
    slot: 39
    permission: "craftplayplotextras.plotmeta.status"
    material: RED_DYE
    name: "&cStatus: Locked"
    actions:
      - "SET_PLOT_STATUS:locked"
  team-note:
    slot: 40
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bEdit Team Note"
    lore:
      - "&7Current: &f{plot_team_note}"
    actions:
      - "TEAM_NOTE_PROMPT"
  status-normal:
    slot: 41
    permission: "craftplayplotextras.plotmeta.status"
    material: WHITE_DYE
    name: "&fStatus: Normal"
    actions:
      - "SET_PLOT_STATUS:normal"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
