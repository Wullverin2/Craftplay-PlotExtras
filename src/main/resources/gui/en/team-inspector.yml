# Team GUI for support, moderation and administration.
title: "&8Team Inspector"
permission: "craftplayplotextras.audit.view"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: SPYGLASS
    name: "&bPlot Overview"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Owner: &f{plot_owner}"
      - "&7Role here: &f{plot_role}"
      - "&7Members: &f{plot_members}"
      - "&7Trusted: &f{plot_trusted}"
      - "&7Denied: &f{plot_denied}"
      - "&7Plot limit: &f{plot_count}&7/&f{plot_max}"
      - "&7Status: &f{plot_status_display}"
      - "&7Visits: &f{plot_visits}"
      - "&7Favorites: &f{plot_likes}"
      - "&7Staff note: &f{plot_team_note}"
  audit:
    slot: 10
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&aAudit Log"
    lore:
      - "&7Recent plot and"
      - "&7staff actions."
    actions:
      - "OPEN:audit-log"
  backups:
    slot: 11
    permission: "craftplayplotextras.backup.admin"
    material: CHEST
    name: "&aBackups"
    lore:
      - "&7View backups and"
      - "&7prepare restores."
    actions:
      - "OPEN:backups"
  reports:
    slot: 12
    permission: "craftplayplotextras.report.view"
    material: BELL
    name: "&cPlot Reports"
    lore:
      - "&7Lists open reports"
      - "&7in chat."
    actions:
      - "OPEN:reports"
  performance:
    slot: 13
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&ePerformance"
    lore:
      - "&7Counts entities and"
      - "&7shows warnings."
    actions:
      - "OPEN:performance"
  members:
    slot: 14
    permission: "craftplayplotextras.audit.view"
    material: PLAYER_HEAD
    name: "&aMembers"
    lore:
      - "&7Inspect members"
      - "&7and roles."
    actions:
      - "OPEN:members"
  flags:
    slot: 15
    permission: "craftplayplotextras.audit.view"
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7View current"
      - "&7plot flags."
    actions:
      - "OPEN:flags"
  plot-info:
    slot: 16
    permission: "craftplayplotextras.audit.view"
    material: PAPER
    name: "&aPlot Info"
    lore:
      - "&7Shows the plot info"
      - "&7in chat."
    actions:
      - "SHOW_PLOT_INFO"
  limits:
    slot: 19
    permission: "craftplayplotextras.audit.view"
    material: ARMOR_STAND
    name: "&aEntity Limits"
    lore:
      - "&7Shows entities"
      - "&7and configured limits."
    actions:
      - "OPEN:entity-limits"
  redstone-alerts:
    slot: 20
    permission: "craftplayplotextras.redstone.notify"
    material: TARGET
    name: "&cRedstone Alerts"
    lore:
      - "&7Open lag alerts"
      - "&7with teleport and release."
    actions:
      - "OPEN:redstone-alerts"
  redstone-enable:
    slot: 21
    permission: "craftplayplotextras.redstone.admin"
    material: REDSTONE_BLOCK
    name: "&cEnable Redstone"
    lore:
      - "&7Enables redstone on"
      - "&7the current plot again."
    actions:
      - "REDSTONE_ENABLE"
  freeze:
    slot: 22
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bFreeze Plot"
    lore:
      - "&7Blocks building, interaction,"
      - "&7spawns and redstone."
    actions:
      - "TEAM_FREEZE:GUI freeze"
  unfreeze:
    slot: 23
    permission: "craftplayplotextras.moderation.manage"
    material: HONEYCOMB
    name: "&aUnfreeze Plot"
    lore:
      - "&7Removes the freeze"
      - "&7from this plot."
    actions:
      - "TEAM_UNFREEZE"
  cleanup-drops:
    slot: 24
    permission: "craftplayplotextras.moderation.manage"
    material: HOPPER
    name: "&eRemove Drops"
    lore:
      - "&7Removes items and XP"
      - "&7from the current plot."
    actions:
      - "TEAM_CLEANUP:drops"
  validate:
    slot: 25
    permission: "craftplayplotextras.config.validate"
    material: COMPASS
    name: "&bValidate Config"
    lore:
      - "&7Checks materials, slots"
      - "&7and missing files."
    actions:
      - "OPEN:config-issues"
  moderation-menu:
    slot: 27
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bModeration Menu"
    lore:
      - "&7Freeze, cleanup and"
      - "&7redstone release."
    actions:
      - "OPEN:team-moderation"
  permission-check:
    slot: 28
    permission: "craftplayplotextras.permissioncheck"
    material: PLAYER_HEAD
    name: "&dPermission Check"
    lore:
      - "&7Checks plot and"
      - "&7plugin permissions."
    actions:
      - "OPEN:permission-check"
  status-normal:
    slot: 29
    permission: "craftplayplotextras.plotmeta.status"
    material: WHITE_DYE
    name: "&fStatus: Normal"
    actions:
      - "SET_PLOT_STATUS:normal"
  status-checked:
    slot: 30
    permission: "craftplayplotextras.plotmeta.status"
    material: LIME_DYE
    name: "&aStatus: Team Checked"
    actions:
      - "SET_PLOT_STATUS:team-checked"
  status-watch:
    slot: 31
    permission: "craftplayplotextras.plotmeta.status"
    material: ORANGE_DYE
    name: "&6Status: Watch"
    actions:
      - "SET_PLOT_STATUS:under-watch"
  status-locked:
    slot: 32
    permission: "craftplayplotextras.plotmeta.status"
    material: RED_DYE
    name: "&cStatus: Locked"
    actions:
      - "SET_PLOT_STATUS:locked"
  team-note:
    slot: 33
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bChange Staff Note"
    lore:
      - "&7Current: &f{plot_team_note}"
    actions:
      - "TEAM_NOTE_PROMPT"
  contests:
    slot: 34
    permission: "craftplayplotextras.competition.judge"
    material: GOLD_BLOCK
    name: "&6Competitions"
    lore:
      - "&7Lists plots registered"
      - "&7for competitions."
    actions:
      - "OPEN:competitions"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
