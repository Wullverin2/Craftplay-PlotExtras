# English safety menu for dangerous plot actions.
# Delete, reset, and unmerge are intercepted by the plugin, create a schematic first,
# and then require confirmation. Buttons here confirm or cancel pending actions.

file-version: 4

title: "&8Delete/Reset Plot: {tab}"
size: 54
default-tab: actions
require-plot: true
permission: "craftplayplotextras.use"
bedrock:
  enabled: true
  title: "Delete/Reset Plot"
  content: "Protect dangerous actions with backups and confirmation."
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
animation:
  enabled: true
  delay-ticks: 1
  keep-filler-visible: true
buttons:
  back: {enabled: true, slot: 49, material: ARROW, name: "&eBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {enabled: true, slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
decorations:
  frame: {enabled: true, slot: [0, 8, 45, 46, 47, 48, 50, 51, 52], material: RED_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
tabs:
  actions:
    enabled: true
    slot: 10
    material: TNT
    name: "&cActions"
    lore: ["&7Delete, reset", "&7and unmerge."]
    commands: ["open-menu:danger:actions"]
    permission: ""
    buttons:
      backup: {enabled: false, slot: 19, material: WRITABLE_BOOK, name: "&aManual Backup", lore: ["&7Players cannot create", "&7manual backups here."], commands: [], close: false, permission: "craftplayplotextras.backup.create"}
      delete: {enabled: true, slot: 21, material: TNT, name: "&cDelete Plot", lore: ["&7Opens confirmation first.", "&7After confirmation a schematic", "&7backup is created automatically.", "&cThis removes the plot."], commands: ["plot-danger:delete:plot delete"], close: false, permission: "plots.delete"}
      reset: {enabled: true, slot: 23, material: LAVA_BUCKET, name: "&cReset Plot", lore: ["&7Opens confirmation first.", "&7After confirmation a schematic", "&7backup is created automatically.", "&cThis clears the plot."], commands: ["plot-danger:reset:plot clear"], close: false, permission: "plots.clear"}
      unmerge: {enabled: true, slot: 25, material: MAP, name: "&cUnmerge Plot", lore: ["&7Opens confirmation first.", "&7After confirmation the whole", "&7merge is backed up automatically.", "&cThen separates the merge."], commands: ["plot-danger:unmerge:plot unmerge"], close: false, permission: "plots.unmerge"}
      cooldown: {enabled: true, slot: 31, material: CLOCK, name: "&eCooldown Info", lore: ["&7Cooldowns are handled by PlotSquared", "&7or your permissions plugins.", "&7This button is configurable."], commands: [], close: false, permission: ""}
  confirm:
    enabled: true
    slot: 12
    material: LIME_DYE
    name: "&aConfirmation"
    lore: ["&7Confirm or cancel", "&7pending actions."]
    commands: ["open-menu:danger:confirm"]
    permission: ""
    buttons:
      confirm: {enabled: true, slot: 21, material: LIME_CONCRETE, name: "&aYes, Execute", lore: ["&7Confirms the pending", "&7backup/plot action."], commands: ["plot-backup:confirm"], close: true, permission: ""}
      cancel: {enabled: true, slot: 23, material: RED_CONCRETE, name: "&cCancel", lore: ["&7Cancels the pending", "&7action safely."], commands: ["plot-backup:cancel"], close: true, permission: ""}
      info: {enabled: true, slot: 31, material: BOOK, name: "&eFlow", lore: ["&71. Click an action.", "&72. Backup is prepared.", "&73. Confirm or cancel here."], commands: [], close: false, permission: ""}
  restore:
    enabled: true
    slot: 14
    material: CHEST
    name: "&eBackups / Undo"
    lore: ["&7Open backup list", "&7and start restore."]
    commands: ["open-menu:danger:restore"]
    permission: "craftplayplotextras.backup.list"
    buttons:
      list: {enabled: true, slot: 21, material: CHEST, name: "&eBackup List", lore: ["&7Shows all saved", "&7plot backups with information."], commands: ["open-menu:team-backups:1"], close: false, permission: "craftplayplotextras.backup.list"}
      manual: {enabled: false, slot: 22, material: WRITABLE_BOOK, name: "&aCreate Another Backup", lore: ["&7Players cannot create", "&7manual backups here."], commands: [], close: false, permission: "craftplayplotextras.backup.create"}
      restore-info: {enabled: true, slot: 23, material: ENDER_CHEST, name: "&bRestore", lore: ["&7Choose a backup from the list.", "&7It is restored onto the plot", "&7you are standing on."], commands: ["open-menu:team-backups:1"], close: false, permission: "craftplayplotextras.backup.restore"}
      team: {enabled: true, slot: 31, material: PLAYER_HEAD, name: "&cTeam Menu", lore: ["&7Opens the admin area."], commands: ["open-menu:team"], close: false, permission: "craftplayplotextras.team"}
