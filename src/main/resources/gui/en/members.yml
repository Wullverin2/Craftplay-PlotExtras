# English members and roles menu.
# This file controls Added, Trusted, Denied, custom role profiles, temporary rights, and removal.
# Players are requested through private chat input. The input is not visible to other players.
# Custom roles are configurable button profiles and can run any PlotSquared commands.

file-version: 3

title: "&8Members: {tab}"
bedrock:
  enabled: true
  title: "Members & Roles"
  content: "Manage members, roles, and rights on your current plot."
size: 54
default-tab: overview
require-plot: true
permission: "plots.use"
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
buttons:
  back: {slot: 49, material: ARROW, name: "&eBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
decorations:
  border: {slot: [0, 8, 45, 46, 47, 48, 50, 51, 52], material: GRAY_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
tabs:
  overview:
    slot: 10
    material: PLAYER_HEAD
    name: "&aOverview"
    lore: ["&7Opens PlotSquared lists", "&7for roles and members."]
    commands: ["open-menu:members:overview"]
    permission: ""
    buttons:
      members: {slot: 20, material: PLAYER_HEAD, name: "&aMember List", lore: ["&7Shows all members through PlotSquared."], commands: ["plot members"], close: true, permission: "plots.info"}
      trusted: {slot: 21, material: LIME_DYE, name: "&aShow Trusted", lore: ["&7Shows trusted players."], commands: ["plot trusted"], close: true, permission: "plots.info"}
      added: {slot: 22, material: PAPER, name: "&aShow Added", lore: ["&7Shows added players."], commands: ["plot added"], close: true, permission: "plots.info"}
      denied: {slot: 23, material: RED_DYE, name: "&cShow Denied", lore: ["&7Shows denied players."], commands: ["plot denied"], close: true, permission: "plots.info"}
      online: {slot: 24, material: COMPASS, name: "&aOnline Status", lore: ["&7Opens PlotSquared info.", "&7Owners and members are shown there."], commands: ["plot info"], close: true, permission: "plots.info"}
  add:
    slot: 12
    material: EMERALD
    name: "&aAdd Player"
    lore: ["&7Choose a role and then", "&7type the player name."]
    commands: ["open-menu:members:add"]
    permission: ""
    buttons:
      added: {slot: 20, material: PAPER, name: "&aAdd as Added", lore: ["&7May build when plot rules allow it."], commands: ["chat-input:chat-member-player:plot add {input}"], close: true, permission: "plots.add"}
      trusted: {slot: 21, material: LIME_DYE, name: "&aAdd as Trusted", lore: ["&7Trusted players get more access."], commands: ["chat-input:chat-member-player:plot trust {input}"], close: true, permission: "plots.trust"}
      denied: {slot: 22, material: RED_DYE, name: "&cDeny Player", lore: ["&7Exclude a player from the plot."], commands: ["chat-input:chat-member-player:plot deny {input}"], close: true, permission: "plots.deny"}
      helper: {slot: 23, material: IRON_PICKAXE, name: "&aHelper Role", lore: ["&7Example custom role.", "&7Default: plot add."], commands: ["chat-input:chat-member-player:plot add {input}"], close: true, permission: "plots.add"}
      temp: {slot: 24, material: CLOCK, name: "&eTemporary Rights", lore: ["&7Server-dependent example button.", "&7Command can be changed."], commands: ["chat-input:chat-member-player:plot add {input}"], close: true, permission: "plots.add"}
  remove:
    slot: 14
    material: REDSTONE_BLOCK
    name: "&cRemove"
    lore: ["&7Untrust, remove, and undeny", "&7through private input."]
    commands: ["open-menu:members:remove"]
    permission: ""
    buttons:
      remove: {slot: 20, material: BARRIER, name: "&cRemove from Plot", lore: ["&7Removes Added/Trusted."], commands: ["chat-input:chat-member-player:plot remove {input}"], close: true, permission: "plots.remove"}
      untrust: {slot: 21, material: GRAY_DYE, name: "&eRemove Trusted", lore: ["&7Removes trust rights."], commands: ["chat-input:chat-member-player:plot untrust {input}"], close: true, permission: "plots.trust"}
      undeny: {slot: 22, material: LIME_DYE, name: "&aRemove Deny", lore: ["&7Allows the player again."], commands: ["chat-input:chat-member-player:plot undeny {input}"], close: true, permission: "plots.deny"}
      clear-denied: {slot: 24, material: CAULDRON, name: "&cClear Denied List", lore: ["&7Dangerous command, adjust if needed."], commands: ["plot undeny *"], close: true, permission: "plots.deny"}
  roles:
    slot: 16
    material: WRITABLE_BOOK
    name: "&aRoles & Rights"
    lore: ["&7Promote, demote,", "&7copy, and export."]
    commands: ["open-menu:members:roles"]
    permission: ""
    buttons:
      open-roles: {slot: 18, material: CHEST, name: "&aManage Roles", lore: ["&7Opens stored plot roles", "&7for this plot."], commands: ["open-menu:roles-list:1"], close: false, permission: ""}
      promote: {slot: 19, material: LIME_DYE, name: "&aPromote to Trusted", lore: ["&7Asks for a player and trusts them."], commands: ["chat-input:chat-member-player:plot trust {input}"], close: true, permission: "plots.trust"}
      demote: {slot: 20, material: ORANGE_DYE, name: "&eDemote to Added", lore: ["&7Removes trust and keeps Added configurable."], commands: ["chat-input:chat-member-player:plot untrust {input}"], close: true, permission: "plots.trust"}
      copy-role: {slot: 22, material: BOOK, name: "&aCopy Role", lore: ["&7Example button for external role plugins.", "&7Command can be changed."], commands: ["plot members"], close: true, permission: "plots.info"}
      export-role: {slot: 23, material: CHEST, name: "&aExport Roles", lore: ["&7Shows member lists as export basis."], commands: ["plot members"], close: true, permission: "plots.info"}
      owner-info: {slot: 25, material: GOLD_BLOCK, name: "&6Owner", lore: ["&7Owner is the PlotSquared owner.", "&7This role is not removed."], commands: ["plot info"], close: true, permission: "plots.info"}

role-list:
  title: "&8Plot Roles &7- Page {page}"
  size: 54
  filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25]
  item:
    # If false, clickable role entries are hidden.
    enabled: true
    # Optional permission required to see and click role entries.
    permission: ""
    material: WRITABLE_BOOK
    name: "&a{role}"
    lore:
      - "&7Rights: &f{permissions}"
      - "&7Protected: &f{protected}"
      - ""
      - "&aLeft click: Assign player"
      - "&eRight click: Add right"
      - "&bShift-left: Remove right"
      - "&cShift-right: Delete role"
  buttons:
    create: {slot: 45, material: EMERALD, name: "&aCreate Role", lore: ["&7Asks for the role name in chat."], commands: ["chat-input:chat-role-name:role:create:{input}"], close: true, permission: ""}
    unassign: {slot: 46, material: BARRIER, name: "&cRemove Player from Role", lore: ["&7Asks for the player name."], commands: ["chat-input:chat-member-player:role:unassign:{input}"], close: true, permission: ""}
    previous: {slot: 48, material: ARROW, name: "&ePrevious Page", lore: ["&7Opens page {previous_page}."], commands: ["open-menu:roles-list:{previous_page}"], close: false, permission: ""}
    next: {slot: 50, material: ARROW, name: "&eNext Page", lore: ["&7Opens page {next_page}."], commands: ["open-menu:roles-list:{next_page}"], close: false, permission: ""}
    back: {slot: 49, material: OAK_DOOR, name: "&eBack", lore: ["&7Back to members menu."], commands: ["open-menu:members:roles"], close: false, permission: ""}
    close: {slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
  decorations:
    frame: {slot: [0, 8, 9, 17, 18, 26, 27, 35, 36, 44, 47, 51, 52], material: GRAY_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
