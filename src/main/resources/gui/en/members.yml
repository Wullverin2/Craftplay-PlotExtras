# English members GUI.
# It dynamically shows owner, members, trusted and denied players.
title: "&8Plot Members"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  invite:
    slot: 11
    material: PLAYER_HEAD
    name: "&aInvite player"
    lore:
      - "&7Click, then type the"
      - "&eplayer name &7into chat."
      - "&7Requires: members.invite"
    actions:
      - "INVITE_MEMBER_PROMPT"
  member-overview:
    slot: 13
    material: NAME_TAG
    name: "&aMember Overview"
    lore:
      - "&7Owner: &f{plot_owner}"
      - "&7Members: &f{plot_members}"
      - "&7Trusted: &f{plot_trusted}"
      - "&7Denied: &f{plot_denied}"
  roles:
    slot: 15
    material: BOOK
    name: "&aPlot Roles"
    lore:
      - "&7Shows roles and permissions"
      - "&7for this plot."
    actions:
      - "OPEN:roles"
  temporary-trusts:
    slot: 17
    material: CLOCK
    name: "&bTemporary Trusts"
    lore:
      - "&7View and manage temporary"
      - "&7trusts for this plot."
    actions:
      - "OPEN:temporary-trusts"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: members
  slots: "19-25,28-34,37-43"
  owner-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&6{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
    actions: []
    glow: true
  member-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&a{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
      - "&eClick to change roles."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  trusted-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&b{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
      - "&eClick to change roles."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  denied-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&c{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
      - "&eClick to change roles."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNext Page"
