# English members GUI.
# It dynamically shows owner, members, trusted and denied players.
title: "&8Plot Members"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  invite:
    slot: 3
    material: PLAYER_HEAD
    name: "&aInvite player"
    lore:
      - "&7Click, then type the"
      - "&eplayer name &7into chat."
      - "&7Requires: members.invite"
    actions:
      - "INVITE_MEMBER_PROMPT"
  plot-members-command:
    slot: 4
    material: NAME_TAG
    name: "&aPlotSquared Members"
    lore:
      - "&7Runs /plot members."
    commands:
      - "player:plot members"
  roles:
    slot: 5
    material: BOOK
    name: "&aPlot Roles"
    lore:
      - "&7Shows roles and permissions"
      - "&7for this plot."
    actions:
      - "OPEN:roles"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: members
  slots: "10-16,19-25,28-34"
  owner-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&6{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
    actions: []
    glow: true
  member-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&a{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
      - "&eClick to change roles."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  trusted-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&b{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
      - "&eClick to change roles."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  denied-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&c{member_name}"
    lore:
      - "&7Role: &f{member_type_display}"
      - "&7Plot role: &f{member_role}"
      - "&8{member_uuid}"
      - "&eClick to change roles."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNext Page"
