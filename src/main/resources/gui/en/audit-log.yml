# Audit log GUI.
title: "&8Audit Log"
size: 54

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: WRITABLE_BOOK
    name: "&bAudit Log"
    lore:
      - "&7Tracks important plot,"
      - "&7GUI and staff actions."
  current-plot:
    slot: 45
    material: SPYGLASS
    name: "&eCurrent Plot"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Use &f/pe audit plot&7"
      - "&7to filter this plot."
  back:
    slot: 46
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-inspector"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: audit-log
  slots: "10-16,19-25,28-34"
  limit: 250
  current-plot-only: false
  entry-item:
    material: PAPER
    name: "&e{audit_action}"
    lore:
      - "&7Time: &f{audit_created}"
      - "&7Actor: &f{audit_actor}"
      - "&7Plot: &f{audit_world} {audit_plot}"
      - "&7Details: &f{audit_details}"
      - "&8ID: {audit_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
    lore:
      - "&7Page &f{page}&7/&f{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNext Page"
    lore:
      - "&7Page &f{page}&7/&f{pages}"
