# English plot search menu.
# This file controls search and filter navigation. Every button is configurable:
# slot, material, name, lore, commands, permission, HeadDatabase ID, and Bedrock label.
# Replace the example commands when your server has a dedicated search backend.

file-version: 3

title: "&8Plot Search: {tab}"
size: 54
default-tab: search
require-plot: false
permission: "craftplayplotextras.use"
bedrock:
  enabled: true
  title: "Plot Search"
  content: "Choose a search mode, filter, or discovery list."
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
animation:
  enabled: true
  delay-ticks: 1
  keep-filler-visible: true
buttons:
  back: {enabled: true, slot: 49, material: ARROW, name: "&eBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {enabled: true, slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
decorations:
  frame: {enabled: true, slot: [0, 8, 45, 46, 47, 48, 50, 51, 52], material: GRAY_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
tabs:
  search:
    enabled: true
    slot: 10
    material: COMPASS
    name: "&aSearch"
    lore: ["&7Name, owner, tags,", "&7category, biome, and size."]
    commands: ["open-menu:search:search"]
    permission: ""
    buttons:
      by-owner: {enabled: true, slot: 19, material: PLAYER_HEAD, skull-owner: "%player_name%", name: "&aBy Owner", lore: ["&7Asks for a player name.", "&7Then starts a plot visit."], commands: ["chat-input:chat-plot-search:plot visit {input}"], close: true, permission: "plots.visit"}
      by-name: {enabled: true, slot: 20, material: NAME_TAG, name: "&aBy Plot Name", lore: ["&7Asks for a plot name.", "&7The command is fully configurable."], commands: ["chat-input:chat-plot-search:plot visit {input}"], close: true, permission: "plots.visit"}
      by-tags: {enabled: true, slot: 21, material: BOOK, name: "&aBy Tags", lore: ["&7Example hook for custom", "&7tag search systems."], commands: ["chat-input:chat-plot-search:plot list all"], close: true, permission: "plots.list"}
      by-category: {enabled: true, slot: 22, material: CHEST, name: "&aBy Category", lore: ["&7Uses custom categories", "&7from My Plots."], commands: ["chat-input:chat-plot-search:plot list all"], close: true, permission: "plots.list"}
      by-rating: {enabled: true, slot: 23, material: GOLD_INGOT, name: "&6By Rating", lore: ["&7Opens your plots", "&7sorted by rating."], commands: ["open-menu:myplots:1:rating:all"], close: false, permission: ""}
      by-biome: {enabled: true, slot: 24, material: OAK_SAPLING, name: "&aBy Biome", lore: ["&7Asks for a biome.", "&7Adjust the command to your setup."], commands: ["chat-input:chat-plot-search:plot list all"], close: true, permission: "plots.list"}
      by-size: {enabled: true, slot: 25, material: MAP, name: "&aBy Size", lore: ["&7Opens your plots", "&7sorted by merge size."], commands: ["open-menu:myplots:1:size:all"], close: false, permission: ""}
  filters:
    enabled: true
    slot: 12
    material: HOPPER
    name: "&bFilters"
    lore: ["&7Public plots, online owners,", "&7shops, RP, and redstone."]
    commands: ["open-menu:search:filters"]
    permission: ""
    buttons:
      public: {enabled: true, slot: 19, material: LIME_DYE, name: "&aPublic Plots Only", lore: ["&7Shows public owned plots.", "&7Adjust command for global lists."], commands: ["open-menu:myplots:1:name:public"], close: false, permission: ""}
      online: {enabled: true, slot: 20, material: PLAYER_HEAD, name: "&aOnline Owners Only", lore: ["&7Server-dependent filter.", "&7Default: open plot list."], commands: ["plot list all"], close: true, permission: "plots.list"}
      shops: {enabled: true, slot: 21, material: EMERALD, name: "&aShops Only", lore: ["&7Filter profile for shop plots.", "&7Default command is configurable."], commands: ["plot list all"], close: true, permission: "plots.list"}
      roleplay: {enabled: true, slot: 22, material: WRITABLE_BOOK, name: "&dRP Plots Only", lore: ["&7Filter profile for roleplay plots."], commands: ["plot list all"], close: true, permission: "plots.list"}
      redstone: {enabled: true, slot: 23, material: REDSTONE, name: "&cRedstone Plots Only", lore: ["&7Filter profile for redstone plots."], commands: ["plot list all"], close: true, permission: "plots.list"}
      favorites: {enabled: true, slot: 24, material: NETHER_STAR, name: "&eFavorites Only", lore: ["&7Opens your favorite plots."], commands: ["open-menu:myplots:1:name:favorites"], close: false, permission: ""}
      private: {enabled: true, slot: 25, material: IRON_DOOR, name: "&7Private Owned Plots", lore: ["&7Opens your private plots."], commands: ["open-menu:myplots:1:name:private"], close: false, permission: ""}
  discover:
    enabled: true
    slot: 14
    material: ENDER_EYE
    name: "&eDiscover"
    lore: ["&7History, trends,", "&7favorites, and top plots."]
    commands: ["open-menu:search:discover"]
    permission: ""
    buttons:
      history: {enabled: true, slot: 19, material: CLOCK, name: "&aSearch History", lore: ["&7Opens the history menu."], commands: ["open-menu:history"], close: false, permission: ""}
      search-favorites: {enabled: true, slot: 20, material: NETHER_STAR, name: "&eSearch Favorites", lore: ["&7Opens your favorite plots."], commands: ["open-menu:myplots:1:name:favorites"], close: false, permission: ""}
      trending: {enabled: true, slot: 21, material: FIREWORK_ROCKET, name: "&6Trending", lore: ["&7Default: PlotSquared top list.", "&7Can point to your own ranking."], commands: ["plot list top"], close: true, permission: "plots.list"}
      popular-terms: {enabled: true, slot: 22, material: PAPER, name: "&bPopular Terms", lore: ["&7Placeholder button for custom", "&7search stats or web pages."], commands: ["plot list top"], close: true, permission: "plots.list"}
      latest: {enabled: true, slot: 23, material: FILLED_MAP, name: "&aNewest Plots", lore: ["&7Opens newest plots."], commands: ["plot list latest"], close: true, permission: "plots.list"}
      top-rated: {enabled: true, slot: 24, material: GOLD_BLOCK, name: "&6Top Rated Plots", lore: ["&7Opens the top list."], commands: ["plot list top"], close: true, permission: "plots.list"}
      community: {enabled: true, slot: 25, material: HEART_OF_THE_SEA, name: "&bCommunity", lore: ["&7Switches to the community menu."], commands: ["open-menu:community"], close: false, permission: ""}
