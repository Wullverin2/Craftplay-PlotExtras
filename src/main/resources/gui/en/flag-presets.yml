# Flag presets are loaded from config.yml under plot-presets.flags.options.
title: "&8Flag Presets"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: MAP
    name: "&aFlag Presets"
    lore:
      - "&7Applies multiple flags"
      - "&7with one click."
      - "&8Only available flags are changed."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-dashboard"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: config-options
  source: plot-presets.flags.options
  slots: "20-24,29-33"
  option-item:
    material: MAP
    name: "&a{option_display}"
    lore:
      - "&7Click to apply this preset"
      - "&7to your current plot."
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNext Page"
