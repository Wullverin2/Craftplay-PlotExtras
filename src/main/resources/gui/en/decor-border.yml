# Decor GUI: Border categories.
title: "&8Decor: Border"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  tab-wall:
    slot: 10
    material: STONE_BRICKS
    name: "&eWall"
    lore:
      - "&7Opens the wall categories."
    actions:
      - "OPEN:decor"
  tab-border:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&aBorder"
    lore:
      - "&7Active tab"
    glow: true
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: component-categories
  component: border
  target-format: "decor-border-{category}"
  slots: "19-25"
  category-item:
    name: "&a{category_display}"
    lore:
      - "&7Available blocks: &f{option_count}"
      - "&7Click to open this category."
