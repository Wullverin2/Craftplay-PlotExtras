# Guestbook for the current plot.
title: "&8Guestbook"
size: 54

fill:
  enabled: true
  material: LIME_STAINED_GLASS_PANE
  name: " "

items:
  write:
    slot: 4
    material: WRITABLE_BOOK
    name: "&aWrite entry"
    lore:
      - "&7Only you can see"
      - "&7the chat input."
    actions:
      - "GUESTBOOK_SIGN_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: guestbook
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  entry-item:
    material: PAPER
    name: "&a{guestbook_player}"
    lore:
      - "&7Date: &f{guestbook_created}"
      - "&f{guestbook_message}"
      - "&8Owner/team: click to delete."
    actions:
      - "DELETE_GUESTBOOK_ENTRY:{guestbook_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
