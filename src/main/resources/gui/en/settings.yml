# English settings submenu.
# This file controls the menu where players change plot homes, weather, biomes, and time.
# All tabs and buttons can configure name, slot, material, lore, commands, and permission.
# Tabs, buttons, and decorations can use slot: 13, slot: [13, 14, 15], or slots: [13, 14, 15].
# Each button can run custom commands. Prefixes: console:, player:, op:, open-menu:.
# Optionally, a HeadDatabase head can be used with head-database-id instead of the material.
# Player heads can use material: PLAYERHEAD %player_name% or skull-owner: "%player_name%".
# Decoration items live under decorations and are visual-only items without an action.
# PlaceholderAPI placeholders work in titles, tab names, button names, lore, and commands.

# File version of this GUI file.
# The plugin uses this value to add new menu options automatically.
file-version: 7

# Inventory title. Placeholder: {tab}
title: "&8Plot Settings: {tab}"
# Inventory size. Allowed values are 9, 18, 27, 36, 45, or 54 slots.
size: 54
# Tab opened when no tab was specified.
default-tab: homes
# Filler item for empty slots.
filler:
  # If true, empty slots are filled with the material below.
  enabled: true
  # Minecraft/Spigot material name.
  material: BLACK_STAINED_GLASS_PANE
  # Display name of the filler item. &r keeps it visually empty.
  name: "&r"
# Decoration items shown in every tab.
decorations:
  bottom-spacer:
    # Inventory slot.
    slot: 52
    # Material fallback.
    material: GRAY_STAINED_GLASS_PANE
    # Optional HeadDatabase ID. Example: "12345"
    head-database-id: ""
    # Decoration display name.
    name: "&r"
    # Decoration lore.
    lore: []
    # Optional permission required to see this decoration.
    permission: ""
# Tabs in the settings menu.
# Each tab has its own button at the top and its own action buttons below.
tabs:
  homes:
    # Slot of the tab button.
    slot: 10
    # Item of the tab button.
    material: COMPASS
    # Display name of the tab button.
    name: "&aPlot Homes"
    # Description of the tab button.
    lore:
      - "&7Teleport to your plot home"
      - "&7or set it again."
    # Internal action to open this tab.
    commands:
      - "open-menu:settings:homes"
    # Optional permission required to see the tab.
    permission: ""
    # Buttons inside this tab.
    buttons:
      open-home:
        # Inventory slot.
        slot: 22
        # Button item.
        material: ENDER_PEARL
        # Button display name.
        name: "&aUse Plot Home"
        # Button description.
        lore:
          - "&7Teleports you to your"
          - "&7current plot home."
        # Commands run as the player. Prefix with console: to run as console.
        commands:
          - "plot home"
        # If true, the menu closes after clicking.
        close: true
        # Optional permission required to see the button.
        permission: "plots.home"
      set-home:
        slot: 23
        material: LODESTONE
        name: "&aSet Plot Home"
        lore:
          - "&7Sets your plot home"
          - "&7to your current position."
        commands:
          - "plot sethome"
        close: false
        permission: "plots.set.home"
      reset-home:
        slot: 24
        material: BARRIER
        name: "&cRemove Plot Home"
        lore:
          - "&7Removes the custom home"
          - "&7and uses the default again."
        commands:
          - "plot sethome none"
        close: false
        permission: "plots.set.home"
      back:
        slot: 49
        material: ARROW
        name: "&cBack"
        lore:
          - "&7Back to the main menu."
        commands:
          - "open-menu:main"
        close: false
        permission: ""
      close:
        slot: 53
        material: BARRIER
        name: "&cClose"
        lore:
          - "&7Closes this menu."
        commands: []
        close: true
        permission: ""
  info:
    slot: 28
    material: NAME_TAG
    name: "&aPlot Data"
    lore:
      - "&7Name, description,"
      - "&7tags, and visibility."
    commands:
      - "open-menu:settings:info"
    permission: ""
    buttons:
      name: {slot: 20, material: NAME_TAG, name: "&aChange Plot Name", lore: ["&7Asks for the new name in chat."], commands: ["chat-input:chat-plot-name:plot alias set {input}"], close: true, permission: "plots.set.alias"}
      description: {slot: 21, material: WRITABLE_BOOK, name: "&aChange Description", lore: ["&7Asks for the new description in chat."], commands: ["chat-input:chat-plot-description:plot desc {input}"], close: true, permission: "plots.set.desc"}
      public: {slot: 22, material: OAK_DOOR, name: "&aPublicly Visible", lore: ["&7Allows visitors to enter."], commands: ["plot flag set untrusted-visit true"], close: false, permission: "plots.set.flag.untrusted-visit"}
      private: {slot: 23, material: IRON_DOOR, name: "&7Private", lore: ["&7Removes public visitor access."], commands: ["plot flag set untrusted-visit false"], close: false, permission: "plots.set.flag.untrusted-visit"}
      info: {slot: 24, material: COMPASS, name: "&aShow Plot Info", lore: ["&7Shows owner, size, and status."], commands: ["plot info"], close: true, permission: "plots.info"}
      back: {slot: 49, material: ARROW, name: "&cBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
      close: {slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
  music:
    slot: 30
    material: JUKEBOX
    name: "&aMusic"
    lore:
      - "&7Music and atmosphere"
      - "&7for your plot."
    commands:
