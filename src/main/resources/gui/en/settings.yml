    permission: ""
    buttons:
      record-13: {slot: 20, material: MUSIC_DISC_13, name: "&aMusic: 13", lore: ["&7Sets plot music."], commands: ["plot flag set music 13"], close: false, permission: "plots.set.flag.music"}
      record-cat: {slot: 21, material: MUSIC_DISC_CAT, name: "&aMusic: Cat", lore: ["&7Sets plot music."], commands: ["plot flag set music cat"], close: false, permission: "plots.set.flag.music"}
      record-blocks: {slot: 22, material: MUSIC_DISC_BLOCKS, name: "&aMusic: Blocks", lore: ["&7Sets plot music."], commands: ["plot flag set music blocks"], close: false, permission: "plots.set.flag.music"}
      reset: {slot: 24, material: BARRIER, name: "&eReset Music", lore: ["&7Removes the music flag."], commands: ["plot flag remove music"], close: false, permission: "plots.flag.remove"}
      back: {slot: 49, material: ARROW, name: "&cBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
      close: {slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
  stats:
    slot: 32
    material: FILLED_MAP
    name: "&aStatistics"
    lore:
      - "&7Info, banner, image,"
      - "&7and featured profiles."
    commands:
      - "open-menu:settings:stats"
    permission: ""
    buttons:
      info: {slot: 20, material: COMPASS, name: "&aPlot Statistics", lore: ["&7Opens PlotSquared info."], commands: ["plot info"], close: true, permission: "plots.info"}
      visit-list: {slot: 21, material: CLOCK, name: "&aVisitors/History", lore: ["&7Opens visited plot lists."], commands: ["plot list visited"], close: true, permission: "plots.list"}
      banner: {slot: 22, material: WHITE_BANNER, name: "&aPlot Banner", lore: ["&7Example button for external systems."], commands: ["plot info"], close: true, permission: "plots.info"}
      featured: {slot: 24, material: NETHER_STAR, name: "&eFeatured Plot", lore: ["&7Example button for staff/community systems."], commands: ["plot rate"], close: true, permission: "plots.rate"}
      back: {slot: 49, material: ARROW, name: "&cBack", lore: ["&7Back to the main menu."], commands: ["open-menu:main"], close: false, permission: ""}
      close: {slot: 53, material: BARRIER, name: "&cClose", lore: ["&7Closes this menu."], commands: [], close: true, permission: ""}
  weather:
    slot: 12
    material: SUNFLOWER
    name: "&aWeather"
    lore:
