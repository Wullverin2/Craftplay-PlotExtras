# Settings: Home tab.
title: "&8Settings: Home"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  tab-home:
    slot: 10
    material: LIME_STAINED_GLASS_PANE
    name: "&aHome"
    glow: true
  tab-weather:
    slot: 11
    material: WATER_BUCKET
    name: "&eWeather"
    actions:
      - "OPEN:settings-weather"
  tab-time:
    slot: 12
    material: CLOCK
    name: "&eTime"
    actions:
      - "OPEN:settings-time"
  tab-biome:
    slot: 13
    material: GRASS_BLOCK
    name: "&ePlot Biome"
    actions:
      - "OPEN:settings-biome"
  info:
    slot: 22
    material: BOOK
    name: "&ePlot Information"
    lore:
      - "&7Plot: &f{plot_id}"
      - "&7World: &f{plot_world}"
      - "&7Owner: &f{plot_owner}"
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&8PlotSquared max: &f{plotsquared_plot_max}"
      - "&7Money: &f{cmi_money}"
      - "&7Jobs: &f{jobs}"
      - "&7Quests: &f{quests_completed}&7/&f{quests_total}"
  home:
    slot: 29
    material: ENDER_PEARL
    name: "&aPlot Home"
    actions:
      - "TELEPORT_PLOT_HOME"
  homes:
    slot: 30
    material: COMPASS
    name: "&aMore Homes"
    lore:
      - "&7Manage named homes"
      - "&7with role access."
    actions:
      - "OPEN:plot-homes"
  sethome:
    slot: 31
    material: COMPASS
    name: "&aSet Home"
    actions:
      - "SET_PLOT_HOME"
  plotinfo:
    slot: 33
    material: PAPER
    name: "&aPlot Info"
    lore:
      - "&7Shows the plot info"
      - "&7in chat."
    actions:
      - "SHOW_PLOT_INFO"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
