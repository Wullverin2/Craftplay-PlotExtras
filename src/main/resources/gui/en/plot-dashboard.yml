# Player dashboard for the current plot.
title: "&8Plot Dashboard"
size: 54

fill:
  enabled: true
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot Overview"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Owner: &f{plot_owner}"
      - "&7Your role: &f{plot_role}"
      - "&7Status: &f{plot_status_display}"
      - "&7Visits: &f{plot_visits}"
      - "&7Favorites: &f{plot_likes}"
      - "&7Warps: &f{plot_warps}"
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
  settings:
    slot: 10
    material: COMPARATOR
    name: "&aSettings"
    lore:
      - "&7Home, weather, time"
      - "&7and plot biome."
    actions:
      - "OPEN:settings"
  flags:
    slot: 11
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7View and change"
      - "&7plot flags."
    actions:
      - "OPEN:flags"
  decor:
    slot: 12
    material: GRASS_BLOCK
    name: "&aDecor"
    lore:
      - "&7Change wall and border."
    actions:
      - "OPEN:decor"
  members:
    slot: 13
    material: PLAYER_HEAD
    name: "&aMembers"
    lore:
      - "&7Members, trusts"
      - "&7and roles."
    actions:
      - "OPEN:members"
  warps:
    slot: 14
    material: ENDER_PEARL
    name: "&aPlot Warps"
    lore:
      - "&7Saved places: &f{plot_warps}"
    actions:
      - "OPEN:plot-warps"
  entity-limits:
    slot: 15
    material: ARMOR_STAND
    name: "&aEntity Limits"
    lore:
      - "&7Current entity counts"
      - "&7and maximum values."
    actions:
      - "OPEN:entity-limits"
  presets:
    slot: 16
    material: MAP
    name: "&aPresets"
    lore:
      - "&7Quick templates for"
      - "&7common plot settings."
    actions:
      - "OPEN:flag-presets"
  note:
    slot: 21
    material: WRITABLE_BOOK
    name: "&aPlot Note"
    lore:
      - "&7Current:"
      - "&f{plot_owner_note}"
    actions:
      - "PLOT_NOTE_PROMPT"
  like:
    slot: 22
    material: EMERALD
    name: "&aFavorite"
    lore:
      - "&7Current: &f{plot_likes}"
      - "&7Click to toggle."
    actions:
      - "TOGGLE_PLOT_LIKE"
  report:
    slot: 23
    material: BELL
    name: "&cReport Plot"
    lore:
      - "&7Reports this plot"
      - "&7to staff."
    actions:
      - "PLAYER_COMMAND:pe report Dashboard report"
  contest:
    slot: 24
    material: GOLDEN_APPLE
    name: "&6Competition"
    lore:
      - "&7Registers this plot for"
      - "&7the default competition."
    actions:
      - "OPEN:competitions"
  tools:
    slot: 29
    material: COMPASS
    name: "&aPlot Tools"
    lore:
      - "&7Profile, search,"
      - "&7guestbook and requests."
    actions:
      - "OPEN:plot-tools"
  team-note:
    slot: 31
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bStaff Note"
    lore:
      - "&7Current:"
      - "&f{plot_team_note}"
      - "&8Staff only."
    actions:
      - "TEAM_NOTE_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
