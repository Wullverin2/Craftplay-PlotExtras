# Deutsches Bedrock-Hauptmenü.
# Diese Datei steuert das Hauptmenü für Bedrock-Spieler über Floodgate-Forms.
# Sie ist bewusst von der Java-Inventar-GUI in main.yml getrennt.
# Jeder Button kann eigene Befehle ausführen. Prefixe: console:, player:, op:, open-menu:.
# PlaceholderAPI-Platzhalter funktionieren in Titel, Beschreibung, Labels und Commands.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Menüoptionen automatisch zu ergänzen.
file-version: 8

# Wenn false, wird dieses Bedrock-Menü nicht geladen.
enabled: true
# Titel der Bedrock-Form.
title: "Plot-Menü"
# Beschreibung über den Buttons der Bedrock-Form.
content: "Wähle aus, was du mit deinen Plots machen möchtest."
# Standardsound, der beim Auswählen eines Buttons abgespielt wird.
click-sound:
  # Wenn true, hören Spieler beim Klicken einen Button-Sound.
  enabled: true
  # Bukkit-Soundname.
  sound: UI_BUTTON_CLICK
  # Lautstärke des Sounds.
  volume: 0.8
  # Tonhöhe des Sounds.
  pitch: 1.0
# Button-IDs, die in der Bedrock-Form nicht angezeigt werden sollen.
hidden-buttons: []
# Alle Buttons der Bedrock-Form.
buttons:
  my-plots:
    enabled: true
    # Reihenfolge in der Form. Kleinere Zahlen stehen weiter oben.
    order: 10
    # Text auf dem Bedrock-Button.
    label: "Eigene Plots"
    # Befehle werden als Spieler ausgeführt. Mit console: davor als Konsole.
    commands:
      - "open-menu:myplots"
    # Wenn true, wird die Form nach dem Klick geschlossen.
    close: false
    # Optional: Permission, die ein Spieler braucht, damit der Button sichtbar ist.
    permission: ""
  search:
    enabled: true
    order: 20
    label: "Plot suchen"
    commands:
      - "open-menu:search"
    close: false
    permission: ""
  create:
    enabled: true
    order: 30
    label: "Plot erstellen"
    commands:
      - "open-menu:create:types"
    close: false
    permission: "plots.auto"
  favorites:
    enabled: true
    order: 40
    label: "Favoriten"
    commands:
      - "open-menu:myplots:1:name:favorites"
    close: false
    permission: ""
  community:
    enabled: true
    order: 50
    label: "Community"
    commands:
      - "open-menu:community"
    close: false
    permission: ""
  members:
    enabled: true
    order: 60
    label: "Mitglieder"
    commands:
      - "open-menu:members:overview"
    close: false
    permission: ""
  roles:
    enabled: true
    order: 70
    label: "Rechte & Rollen"
    commands:
      - "open-menu:members:roles"
    close: false
    permission: ""
  flags:
    enabled: true
    order: 80
    label: "Flags"
    commands:
      - "open-menu:flags"
    close: true
    permission: ""
  settings:
    enabled: true
    order: 90
    label: "Einstellungen"
    commands:
      - "open-menu:settings:homes"
    close: true
    permission: ""
  deco:
    enabled: true
    order: 95
    label: "Deko"
    commands:
      - "open-menu:deco:wall-basic"
    close: false
    permission: "craftplayplotextras.deco"
  reports:
    enabled: true
    order: 100
    label: "Reports"
    commands:
      - "open-menu:reports"
    close: false
    permission: ""
  history:
    enabled: true
    order: 110
    label: "Verlauf"
    commands:
      - "open-menu:history"
    close: false
    permission: ""
  help:
    enabled: true
    order: 120
    label: "Hilfe"
    commands:
      - "open-menu:help"
    close: false
    permission: ""
  team:
    enabled: true
    order: 130
    label: "Team"
    commands:
      - "open-menu:team"
    close: true
    permission: "craftplayplotextras.team"
  danger:
    enabled: true
    order: 125
    label: "Löschen & Reset"
    commands:
      - "open-menu:danger"
    close: false
    permission: ""
  extras:
    enabled: true
    order: 127
