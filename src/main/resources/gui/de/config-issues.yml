# Visuelle Ausgabe des Config-Checks.
title: "&8Config-Check"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: KNOWLEDGE_BOOK
    name: "&bConfig-Hinweise"
    lore:
      - "&7Zeigt ungültige Materialien,"
      - "&7Slots und fehlende Dateien."
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: config-issues
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  issue-item:
    material: PAPER
    name: "&cHinweis #{issue_number}"
    lore:
      - "&f{issue}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
