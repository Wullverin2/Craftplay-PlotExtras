# Deutsches Plot-Erstellen-Menü.
# Diese Datei steuert Plot-Erstellung, Plottypen, Biome, Namen, Beschreibungen, Vorlagen und Kostenbuttons.
# Alle Buttons sind frei anpassbar: Slot, Material, Name, Lore, Commands, Permission und optional bedrock-label.
# Mit chat-input:<sprachkey>:<befehl mit {input}> kann ein Spieler eine private Chat-Eingabe machen.

# Dateiversion dieser GUI-Datei.
# Das Plugin ergänzt neue Standardwerte automatisch, ohne vorhandene Werte zu überschreiben.
file-version: 1

# Titel des Java-Inventars. Platzhalter: {tab}
title: "&8Plot erstellen: {tab}"
# Titel und Beschreibung für Bedrock-Spieler.
bedrock:
  enabled: true
  title: "Plot erstellen"
  content: "Wähle einen Bereich aus und erstelle oder personalisiere dein Plot."
# Größe des Inventars.
size: 54
# Standard-Tab.
default-tab: types
# Für Plot erstellen muss der Spieler nicht zwingend auf einem Plot stehen.
require-plot: false
# Optionale globale Permission für dieses Menü.
permission: "craftplayplotextras.use"
filler:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: "&r"
buttons:
  back:
    slot: 49
    material: ARROW
    name: "&eZurück"
    lore: ["&7Zurück zum Hauptmenü."]
    commands: ["open-menu:main"]
    close: false
    permission: ""
  close:
    slot: 53
    material: BARRIER
    name: "&cSchließen"
    lore: ["&7Schließt dieses Menü."]
    commands: []
    close: true
    permission: ""
decorations:
  border:
    slot: [0, 8, 45, 46, 47, 48, 50, 51, 52]
    material: GRAY_STAINED_GLASS_PANE
    name: "&r"
    lore: []
    permission: ""
tabs:
  types:
    slot: 10
    material: GRASS_BLOCK
    name: "&aPlottypen"
    lore: ["&7Standard, Großplot,", "&7Farm, Pixelart und mehr."]
    commands: ["open-menu:create:types"]
    permission: ""
    buttons:
      standard:
        slot: 19
        material: GRASS_BLOCK
        name: "&aStandardplot"
        lore: ["&7Erstellt ein normales freies Plot.", "&8Befehl: /plot auto"]
        commands: ["plot auto"]
        close: true
        permission: "plots.auto"
      large:
        slot: 20
        material: EMERALD_BLOCK
        name: "&aGroßplot"
        lore: ["&7Standardbefehl ist konfigurierbar.", "&7Passe ihn an deine Plotwelt an."]
        commands: ["plot auto"]
        close: true
        permission: "plots.auto"
      merge:
        slot: 21
        material: MAP
        name: "&aMergeplot"
        lore: ["&7Erstellt zuerst ein Plot.", "&7Das Zusammenführen bleibt serverabhängig."]
        commands: ["plot auto"]
        close: true
        permission: "plots.auto"
      farm:
        slot: 22
        material: WHEAT
        name: "&aFarmplot"
        lore: ["&7Erstellt ein Plot für Farmen.", "&7Command frei anpassbar."]
        commands: ["plot auto"]
        close: true
        permission: "plots.auto"
      pixelart:
        slot: 23
        material: WHITE_CONCRETE
        name: "&aPixelartplot"
        lore: ["&7Erstellt ein Plot für Pixelart.", "&7Command frei anpassbar."]
        commands: ["plot auto"]
        close: true
        permission: "plots.auto"
      redstone:
        slot: 24
        material: REDSTONE
        name: "&aRedstoneplot"
        lore: ["&7Erstellt ein Plot für Redstone.", "&7Command frei anpassbar."]
        commands: ["plot auto"]
        close: true
        permission: "plots.auto"
      premium:
        slot: 25
        material: GOLD_BLOCK
        name: "&6Premiumplot"
        lore: ["&7Premium-Plottyp mit eigener Permission.", "&7Kosten können über Commands ergänzt werden."]
        commands: ["plot auto"]
        close: true
        permission: "craftplayplotextras.create.premium"
  biome:
    slot: 12
    material: OAK_SAPLING
    name: "&aBiom wählen"
    lore: ["&7Setze direkt nach dem Erstellen", "&7oder auf deinem Plot ein Biom."]
    commands: ["open-menu:create:biome"]
    permission: ""
    buttons:
      plains: {slot: 19, material: GRASS_BLOCK, name: "&aEbene", lore: ["&7Setzt Biom Ebene."], commands: ["plot biome plains"], close: false, permission: "plots.set.biome"}
      forest: {slot: 20, material: OAK_LOG, name: "&aWald", lore: ["&7Setzt Biom Wald."], commands: ["plot biome forest"], close: false, permission: "plots.set.biome"}
      desert: {slot: 21, material: SAND, name: "&eWüste", lore: ["&7Setzt Biom Wüste."], commands: ["plot biome desert"], close: false, permission: "plots.set.biome"}
      jungle: {slot: 22, material: JUNGLE_LOG, name: "&aDschungel", lore: ["&7Setzt Biom Dschungel."], commands: ["plot biome jungle"], close: false, permission: "plots.set.biome"}
      snow: {slot: 23, material: SNOW_BLOCK, name: "&bSchnee", lore: ["&7Setzt Biom Schnee."], commands: ["plot biome snowy_plains"], close: false, permission: "plots.set.biome"}
      swamp: {slot: 24, material: VINE, name: "&2Sumpf", lore: ["&7Setzt Biom Sumpf."], commands: ["plot biome swamp"], close: false, permission: "plots.set.biome"}
      nether: {slot: 25, material: NETHERRACK, name: "&cNether", lore: ["&7Setzt Biom Nether."], commands: ["plot biome nether_wastes"], close: false, permission: "plots.set.biome"}
  data:
    slot: 14
    material: NAME_TAG
    name: "&aName & Beschreibung"
    lore: ["&7Setze Alias, Beschreibung", "&7und Startposition."]
    commands: ["open-menu:create:data"]
    permission: ""
    buttons:
      name:
        slot: 21
        material: NAME_TAG
        name: "&aPlotname setzen"
        lore: ["&7Fragt den Namen privat im Chat ab."]
        commands: ["chat-input:chat-plot-name:plot alias set {input}"]
        close: true
        permission: "plots.set.alias"
      description:
        slot: 22
        material: WRITABLE_BOOK
        name: "&aBeschreibung setzen"
        lore: ["&7Fragt die Beschreibung privat im Chat ab."]
        commands: ["chat-input:chat-plot-description:plot desc {input}"]
        close: true
        permission: "plots.set.desc"
      home:
        slot: 23
        material: LODESTONE
        name: "&aStartposition setzen"
        lore: ["&7Setzt dein Plot-Home auf deine Position."]
        commands: ["plot sethome"]
        close: false
        permission: "plots.set.home"
  templates:
    slot: 16
    material: FILLED_MAP
    name: "&aVorlagen"
    lore: ["&7Schematic- und Themenbuttons.", "&7Commands sind serverabhängig."]
    commands: ["open-menu:create:templates"]
    permission: ""
    buttons:
      basic:
        slot: 20
        material: PAPER
        name: "&aBasisvorlage"
        lore: ["&7Beispielbutton für eine Vorlage.", "&7Passe den Befehl an dein Setup an."]
        commands: ["plot schematic paste basic"]
        close: true
        permission: "plots.schematic.paste"
      garden:
        slot: 22
        material: OAK_LEAVES
        name: "&aGarten-Theme"
        lore: ["&7Beispiel für ein Theme."]
        commands: ["plot schematic paste garden"]
        close: true
        permission: "plots.schematic.paste"
      city:
        slot: 24
        material: STONE_BRICKS
        name: "&aStadt-Theme"
        lore: ["&7Beispiel für ein Theme."]
        commands: ["plot schematic paste city"]
        close: true
        permission: "plots.schematic.paste"
