# Deutsches Community-Menü.
# Diese Datei steuert Bewertungen, Kommentare, Toplisten, Empfehlungen, Teilen,
# Einladungen und frei anpassbare Event-/Wettbewerbsbuttons.

file-version: 2

title: "&8Community: {tab}"
size: 54
default-tab: rating
require-plot: false
permission: "craftplayplotextras.use"
bedrock:
  enabled: true
  title: "Community"
  content: "Bewerten, entdecken, teilen und an Events teilnehmen."
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
buttons:
  back: {slot: 49, material: ARROW, name: "&eZurück", lore: ["&7Zurück zum Hauptmenü."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {slot: 53, material: BARRIER, name: "&cSchließen", lore: ["&7Schließt dieses Menü."], commands: [], close: true, permission: ""}
decorations:
  frame: {slot: [0, 8, 45, 46, 47, 48, 50, 51, 52], material: BLUE_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
tabs:
  rating:
    slot: 10
    material: GOLD_INGOT
    name: "&6Bewerten"
    lore: ["&7Bewertungen, Likes,", "&7Sterne und Kommentare."]
    commands: ["open-menu:community:rating"]
    permission: ""
    buttons:
      rate: {slot: 19, material: GOLD_INGOT, name: "&6Plot bewerten", lore: ["&7Öffnet die PlotSquared-Bewertung", "&7für den Plot, auf dem du stehst."], commands: ["plot rate"], close: true, permission: "plots.rate"}
      comments: {slot: 20, material: WRITABLE_BOOK, name: "&aKommentare", lore: ["&7Öffnet PlotSquared-Kommentare", "&7oder ein eigenes Kommentarsystem."], commands: ["plot comment"], close: true, permission: "plots.comment"}
      like: {slot: 21, material: LIME_DYE, name: "&aLike vergeben", lore: ["&7Standard: Bewertungsbefehl.", "&7Kann auf ein eigenes Like-System zeigen."], commands: ["plot rate"], close: true, permission: "plots.rate"}
      stars: {slot: 22, material: NETHER_STAR, name: "&eSternesystem", lore: ["&7Bewertungsprofil für Sterne.", "&7Befehl ist frei anpassbar."], commands: ["plot rate"], close: true, permission: "plots.rate"}
      report: {slot: 23, material: REDSTONE_TORCH, name: "&cPlot melden", lore: ["&7Wechselt ins Report-Menü."], commands: ["open-menu:reports"], close: false, permission: "plots.report"}
      share: {slot: 24, material: MAP, name: "&bPlot teilen", lore: ["&7Zeigt Plotinformationen", "&7zum Teilen im Chat."], commands: ["plot info"], close: true, permission: "plots.info"}
      invite: {slot: 25, material: PLAYER_HEAD, skull-owner: "%player_name%", name: "&aFreund einladen", lore: ["&7Fragt einen Namen ab", "&7und vertraut den Spieler."], commands: ["chat-input:chat-member-player:plot trust {input}"], close: true, permission: "plots.trust"}
  discover:
    slot: 12
    material: COMPASS
    name: "&bEntdecken"
    lore: ["&7Top-Plots, neue Plots,", "&7Besucherlisten und Empfehlungen."]
    commands: ["open-menu:community:discover"]
    permission: ""
    buttons:
      top: {slot: 19, material: DIAMOND, name: "&bTop-Plots", lore: ["&7Öffnet die Topliste."], commands: ["plot list top"], close: true, permission: "plots.list"}
      newest: {slot: 20, material: FILLED_MAP, name: "&aNeueste Plots", lore: ["&7Öffnet die neuesten Plots."], commands: ["plot list latest"], close: true, permission: "plots.list"}
      visited: {slot: 21, material: CLOCK, name: "&eMeistbesuchte Plots", lore: ["&7Standard: Besuchte Plotliste.", "&7Kann auf eigene Statistiken zeigen."], commands: ["plot list visited"], close: true, permission: "plots.list"}
      recommendations: {slot: 22, material: ENDER_EYE, name: "&dEmpfehlungen", lore: ["&7Empfehlungsprofil für eigene", "&7Ranking- oder Websysteme."], commands: ["plot list top"], close: true, permission: "plots.list"}
      search: {slot: 23, material: COMPASS, name: "&aPlot suchen", lore: ["&7Öffnet das Suchmenü."], commands: ["open-menu:search"], close: false, permission: ""}
      favorites: {slot: 24, material: NETHER_STAR, name: "&eFavoriten", lore: ["&7Öffnet deine Favoriten."], commands: ["open-menu:myplots:1:name:favorites"], close: false, permission: ""}
      history: {slot: 25, material: BOOK, name: "&aZuletzt besucht", lore: ["&7Öffnet das Verlaufsmenü."], commands: ["open-menu:history"], close: false, permission: ""}
  events:
    slot: 14
    material: FIREWORK_ROCKET
    name: "&dEvents"
    lore: ["&7Wettbewerbe, Featured Builder", "&7und Event-Profile."]
    commands: ["open-menu:community:events"]
    permission: ""
    buttons:
      featured-builder: {slot: 19, material: PLAYER_HEAD, name: "&6Featured Builder", lore: ["&7Profilbutton für Builder", "&7oder externe Hall-of-Fame."], commands: ["plot list top"], close: true, permission: "plots.list"}
      contests: {slot: 20, material: TARGET, name: "&dWettbewerbe", lore: ["&7Öffnet Wettbewerbsinfos.", "&7Befehl kann frei angepasst werden."], commands: ["plot list top"], close: true, permission: ""}
      events: {slot: 21, material: BELL, name: "&bEvents", lore: ["&7Öffnet Event-Infos", "&7oder einen Serverbefehl."], commands: ["plot list latest"], close: true, permission: ""}
      community-builds: {slot: 22, material: BRICKS, name: "&aCommunity-Bauten", lore: ["&7Profil für Projektlisten", "&7oder Showcase-Systeme."], commands: ["plot list top"], close: true, permission: "plots.list"}
      market: {slot: 23, material: EMERALD, name: "&aPlot-Markt", lore: ["&7Platzhalter für Markt-", "&7Handel- oder Auktionssysteme."], commands: ["plot list all"], close: true, permission: "plots.list"}
      gallery: {slot: 24, material: PAINTING, name: "&ePlot-Galerie", lore: ["&7Platzhalter für Galerien", "&7oder Webübersichten."], commands: ["plot list top"], close: true, permission: "plots.list"}
      help: {slot: 25, material: BOOK, name: "&aCommunity-Hilfe", lore: ["&7Öffnet die Hilfe."], commands: ["open-menu:help"], close: false, permission: ""}
