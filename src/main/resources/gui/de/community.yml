# Deutsches Community-Menü.
# Diese Datei steuert Bewertungen, Likes, Kommentare, Toplisten, Empfehlungen,
# Teilen, Einladungen und frei anpassbare Event-/Wettbewerbsbuttons.

file-version: 4

title: "&8Community: {tab}"
size: 54
default-tab: rating
require-plot: false
permission: "craftplayplotextras.use"
bedrock:
  enabled: true
  title: "Community"
  content: "Bewerten, entdecken, teilen und an Events teilnehmen."
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
animation:
  enabled: true
  delay-ticks: 1
  keep-filler-visible: true
buttons:
  back: {enabled: true, slot: 49, material: ARROW, name: "&eZurück", lore: ["&7Zurück zum Hauptmenü."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {enabled: true, slot: 53, material: BARRIER, name: "&cSchließen", lore: ["&7Schließt dieses Menü."], commands: [], close: true, permission: ""}
decorations:
  frame: {enabled: true, slot: [0, 8, 45, 46, 47, 48, 50, 51, 52], material: BLUE_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
tabs:
  rating:
    enabled: true
    slot: 10
    material: GOLD_INGOT
    name: "&6Bewerten"
    lore: ["&7Bewertungen, Likes,", "&7Sterne und Kommentare."]
    commands: ["open-menu:community:rating"]
    permission: ""
    buttons:
      rating-info:
        enabled: true
        slot: 19
        material: NETHER_STAR
        name: "&6Bewertungsübersicht"
        lore:
          - "&7Durchschnitt: &e{rating_average} &7/ 5"
          - "&7Bewertungen: &f{rating_count}"
          - "&7Likes: &a{likes}"
          - "&7Kommentare: &f{comments}"
          - "&7Von dir geliked: &f{liked}"
        commands: []
        close: false
        permission: ""
      like:
        enabled: true
        slot: 20
        material: LIME_DYE
        name: "&aLike umschalten"
        lore:
          - "&7Vergibt oder entfernt deinen"
          - "&7Like für dieses Plot."
        commands: ["community:like"]
        close: false
        permission: "plots.rate"
      rate-1:
        enabled: true
        slot: 28
        material: COPPER_INGOT
        name: "&e1 Stern"
        lore: ["&7Bewerte dieses Plot mit &e1&7/5."]
        commands: ["community:rate:1"]
        close: false
        permission: "plots.rate"
      rate-2:
        enabled: true
        slot: 29
        material: IRON_INGOT
        name: "&e2 Sterne"
        lore: ["&7Bewerte dieses Plot mit &e2&7/5."]
        commands: ["community:rate:2"]
        close: false
        permission: "plots.rate"
      rate-3:
        enabled: true
        slot: 30
        material: GOLD_INGOT
        name: "&e3 Sterne"
        lore: ["&7Bewerte dieses Plot mit &e3&7/5."]
        commands: ["community:rate:3"]
        close: false
        permission: "plots.rate"
      rate-4:
        enabled: true
        slot: 31
        material: EMERALD
        name: "&e4 Sterne"
        lore: ["&7Bewerte dieses Plot mit &e4&7/5."]
        commands: ["community:rate:4"]
        close: false
        permission: "plots.rate"
      rate-5:
        enabled: true
        slot: 32
        material: DIAMOND
        name: "&e5 Sterne"
        lore: ["&7Bewerte dieses Plot mit &e5&7/5."]
        commands: ["community:rate:5"]
        close: false
        permission: "plots.rate"
      add-comment:
        enabled: true
        slot: 22
        material: WRITABLE_BOOK
        name: "&aKommentar schreiben"
        lore:
          - "&7Nur die Nachricht wird im"
          - "&7Chat eingegeben."
        commands: ["chat-input:chat-plot-comment:community:comment:{input}"]
        close: true
        permission: "plots.comment"
      read-comments:
        enabled: true
        slot: 23
        material: BOOK
        name: "&aKommentare lesen"
        lore:
          - "&7Öffnet alle gespeicherten"
          - "&7Kommentare im GUI."
        commands: ["open-menu:comments-list:1"]
        close: false
        permission: "plots.comment"
      report: {enabled: true, slot: 24, material: REDSTONE_TORCH, name: "&cPlot melden", lore: ["&7Wechselt ins Report-Menü."], commands: ["open-menu:reports"], close: false, permission: "plots.report"}
      share: {enabled: true, slot: 25, material: MAP, name: "&bPlot teilen", lore: ["&7Zeigt Plotinformationen", "&7zum Teilen im Chat."], commands: ["plot info"], close: true, permission: "plots.info"}
      invite: {enabled: true, slot: 34, material: PLAYER_HEAD, skull-owner: "%player_name%", name: "&aFreund einladen", lore: ["&7Fragt einen Namen ab", "&7und vertraut den Spieler."], commands: ["chat-input:chat-member-player:plot trust {input}"], close: true, permission: "plots.trust"}
  discover:
    enabled: true
    slot: 12
    material: COMPASS
    name: "&bEntdecken"
    lore: ["&7Top-Plots, neue Plots,", "&7Besucherlisten und Empfehlungen."]
    commands: ["open-menu:community:discover"]
    permission: ""
    buttons:
      top: {enabled: true, slot: 19, material: DIAMOND, name: "&bTop-Plots", lore: ["&7Öffnet die Topliste."], commands: ["plot list top"], close: true, permission: "plots.list"}
      newest: {enabled: true, slot: 20, material: FILLED_MAP, name: "&aNeueste Plots", lore: ["&7Öffnet die neuesten Plots."], commands: ["plot list latest"], close: true, permission: "plots.list"}
      visited: {enabled: true, slot: 21, material: CLOCK, name: "&eMeistbesuchte Plots", lore: ["&7Standard: Besuchte Plotliste.", "&7Kann auf eigene Statistiken zeigen."], commands: ["plot list visited"], close: true, permission: "plots.list"}
      recommendations: {enabled: true, slot: 22, material: ENDER_EYE, name: "&dEmpfehlungen", lore: ["&7Empfehlungsprofil für eigene", "&7Ranking- oder Websysteme."], commands: ["plot list top"], close: true, permission: "plots.list"}
      search: {enabled: true, slot: 23, material: COMPASS, name: "&aPlot suchen", lore: ["&7Öffnet das Suchmenü."], commands: ["open-menu:search"], close: false, permission: ""}
      favorites: {enabled: true, slot: 24, material: NETHER_STAR, name: "&eFavoriten", lore: ["&7Öffnet deine Favoriten."], commands: ["open-menu:myplots:1:name:favorites"], close: false, permission: ""}
      history: {enabled: true, slot: 25, material: BOOK, name: "&aZuletzt besucht", lore: ["&7Öffnet das Verlaufsmenü."], commands: ["open-menu:history"], close: false, permission: ""}
  events:
    enabled: true
    slot: 14
    material: FIREWORK_ROCKET
    name: "&dEvents"
    lore: ["&7Wettbewerbe, Featured Builder", "&7und Event-Profile."]
    commands: ["open-menu:community:events"]
    permission: ""
    buttons:
      featured-builder: {enabled: true, slot: 19, material: PLAYER_HEAD, name: "&6Featured Builder", lore: ["&7Profilbutton für Builder", "&7oder externe Hall-of-Fame."], commands: ["plot list top"], close: true, permission: "plots.list"}
      contests: {enabled: true, slot: 20, material: TARGET, name: "&dWettbewerbe", lore: ["&7Öffnet Wettbewerbsinfos.", "&7Befehl kann frei angepasst werden."], commands: ["plot list top"], close: true, permission: ""}
      events: {enabled: true, slot: 21, material: BELL, name: "&bEvents", lore: ["&7Öffnet Event-Infos", "&7oder einen Serverbefehl."], commands: ["plot list latest"], close: true, permission: ""}
      community-builds: {enabled: true, slot: 22, material: BRICKS, name: "&aCommunity-Bauten", lore: ["&7Profil für Projektlisten", "&7oder Showcase-Systeme."], commands: ["plot list top"], close: true, permission: "plots.list"}
      market: {enabled: true, slot: 23, material: EMERALD, name: "&aPlot-Markt", lore: ["&7Platzhalter für Markt-", "&7Handel- oder Auktionssysteme."], commands: ["plot list all"], close: true, permission: "plots.list"}
      gallery: {enabled: true, slot: 24, material: PAINTING, name: "&ePlot-Galerie", lore: ["&7Platzhalter für Galerien", "&7oder Webübersichten."], commands: ["plot list top"], close: true, permission: "plots.list"}
      help: {enabled: true, slot: 25, material: BOOK, name: "&aCommunity-Hilfe", lore: ["&7Öffnet die Hilfe."], commands: ["open-menu:help"], close: false, permission: ""}
comments-list:
  title: "&8Plot-Kommentare &7- Seite {page}"
  size: 54
  filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  item:
    enabled: true
    material: WRITTEN_BOOK
    head-database-id: ""
    skull-owner: ""
    name: "&a{author}"
    lore:
      - "&7Geschrieben: &f{created}"
      - ""
      - "&f{message}"
    permission: ""
  buttons:
    previous: {enabled: true, slot: 45, material: ARROW, name: "&eVorherige Seite", lore: ["&7Öffnet Seite {previous_page}."], commands: ["open-menu:comments-list:{previous_page}"], close: false, permission: ""}
    next: {enabled: true, slot: 53, material: ARROW, name: "&eNächste Seite", lore: ["&7Öffnet Seite {next_page}."], commands: ["open-menu:comments-list:{next_page}"], close: false, permission: ""}
    back: {enabled: true, slot: 49, material: OAK_DOOR, name: "&eZurück", lore: ["&7Zurück zum Community-Menü."], commands: ["open-menu:community:rating"], close: false, permission: ""}
    close: {enabled: true, slot: 50, material: BARRIER, name: "&cSchließen", lore: ["&7Schließt dieses Menü."], commands: [], close: true, permission: ""}
  decorations:
    frame: {enabled: true, slot: [0, 8, 36, 44, 46, 47, 48, 51, 52], material: BLUE_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
