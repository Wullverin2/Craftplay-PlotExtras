# Mitglieder-GUI für Deutsch.
# Es zeigt Plot-Besitzer, Mitglieder, Trusts und gesperrte Spieler dynamisch an.
title: "&8Plot-Mitglieder"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  invite:
    slot: 3
    material: PLAYER_HEAD
    name: "&aSpieler einladen"
    lore:
      - "&7Klicke und schreibe danach"
      - "&eden Namen &7in den Chat."
      - "&7Benötigt: members.invite"
    actions:
      - "INVITE_MEMBER_PROMPT"
  plot-members-command:
    slot: 4
    material: NAME_TAG
    name: "&aPlotSquared Mitglieder"
    lore:
      - "&7Führt /plot members aus."
    commands:
      - "player:plot members"
  roles:
    slot: 5
    material: BOOK
    name: "&aPlot-Rollen"
    lore:
      - "&7Zeigt Rollen und Rechte"
      - "&7für diesen Plot."
    actions:
      - "OPEN:roles"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: members
  slots: "10-16,19-25,28-34"
  owner-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&6{member_name}"
    lore:
      - "&7Rolle: &f{member_type_display}"
      - "&7Plotrolle: &f{member_role}"
      - "&8{member_uuid}"
    actions: []
    glow: true
  member-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&a{member_name}"
    lore:
      - "&7Rolle: &f{member_type_display}"
      - "&7Plotrolle: &f{member_role}"
      - "&8{member_uuid}"
      - "&eKlicke zum Rollen ändern."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  trusted-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&b{member_name}"
    lore:
      - "&7Rolle: &f{member_type_display}"
      - "&7Plotrolle: &f{member_role}"
      - "&8{member_uuid}"
      - "&eKlicke zum Rollen ändern."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  denied-item:
    material: PLAYER_HEAD
    skull-owner: "{member_name}"
    name: "&c{member_name}"
    lore:
      - "&7Rolle: &f{member_type_display}"
      - "&7Plotrolle: &f{member_role}"
      - "&8{member_uuid}"
      - "&eKlicke zum Rollen ändern."
    actions:
      - "SELECT_MEMBER:{member_uuid}:member-roles"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eVorherige Seite"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNächste Seite"
