# Plot-Warp-GUI. Ein Klick teleportiert zum gespeicherten Warp.
title: "&8Plot-Warps"
size: 54

fill:
  enabled: true
  material: PURPLE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: ENDER_PEARL
    name: "&aPlot-Warps"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Warps: &f{plot_warps}"
      - "&8Klick: teleportieren"
  set:
    slot: 45
    material: COMPASS
    name: "&aWarp setzen"
    lore:
      - "&7Speichert deine aktuelle"
      - "&7Position als Plot-Warp."
      - "&8Name wird im Chat eingegeben."
    actions:
      - "WARP_SET_PROMPT"
  back:
    slot: 46
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:plot-dashboard"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-warps
  slots: "10-16,19-25,28-34"
  warp-item:
    material: ENDER_EYE
    name: "&a{warp_name}"
    lore:
      - "&7ID: &f{warp_id}"
      - "&7Welt: &f{warp_world}"
      - "&7Position: &f{warp_x}, {warp_y}, {warp_z}"
      - "&8Klick: teleportieren"
      - "&8Shift + Rechtsklick: löschen"
    actions:
      - "PLOT_WARP_CLICK:{warp_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eVorherige Seite"
    lore:
      - "&7Seite &f{page}&7/&f{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNächste Seite"
    lore:
      - "&7Seite &f{page}&7/&f{pages}"
