# Deutsches Flag-Untermenü.
# Diese Datei steuert das Menü, in dem Spieler Boolean-Flags ihres aktuellen Plots sehen und umschalten.
# Alle Namen, Slots, Materialien und Beschreibungen können hier angepasst werden.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Menüoptionen automatisch zu ergänzen.
file-version: 2

# Titel des Inventars.
title: "&8Plot-Flags"
# Größe des Inventars. Erlaubt sind 9, 18, 27, 36, 45 oder 54 Slots.
size: 54
# Nach wie vielen Ticks das Menü nach dem Umschalten aktualisiert wird.
reopen-delay-ticks: 2
# Text, der in der Lore für aktive und inaktive Flags eingesetzt wird.
status:
  # Anzeige für eine eingeschaltete Flag.
  enabled: "&aAktiv"
  # Anzeige für eine ausgeschaltete Flag.
  disabled: "&cInaktiv"
# Füllitem für leere Slots.
filler:
  # Wenn true, werden leere Slots mit dem unten angegebenen Material gefüllt.
  enabled: true
  # Materialname aus Minecraft/Spigot.
  material: BLACK_STAINED_GLASS_PANE
  # Anzeigename des Füllitems. &r macht den Namen leer/unauffällig.
  name: "&r"
# Feste Buttons im Menü.
buttons:
  back:
    # Slot im Inventar. 0 ist oben links.
    slot: 53
    # Item, das für diesen Button angezeigt wird.
    material: BARRIER
    # Anzeigename des Buttons.
    name: "&cZurück"
    # Beschreibung unter dem Buttonnamen.
    lore:
      - "&7Zurück zum Hauptmenü."
    # Interne Aktion: öffnet wieder das Hauptmenü.
    commands:
      - "open-menu:main"
    # Wenn true, wird das Menü nach dem Klick geschlossen.
    close: false
    # Optional: Permission, die ein Spieler braucht, damit der Button sichtbar ist.
    permission: ""
  previous-page:
    # Slot im Inventar. Dieser Button ist auf jeder Seite sichtbar.
    slot: 51
    # Item, das für diesen Button angezeigt wird.
    material: ARROW
    # Anzeigename des Buttons.
    name: "&eSeite 1"
    # Beschreibung unter dem Buttonnamen.
    lore:
      - "&7Öffnet die erste Flag-Seite."
    # Interne Aktion: öffnet Seite 1 des Flag-Menüs.
    commands:
      - "open-menu:flags:1"
    # Wenn true, wird das Menü nach dem Klick geschlossen.
    close: false
    # Optional: Permission, die ein Spieler braucht, damit der Button sichtbar ist.
    permission: ""
  next-page:
    # Slot im Inventar. Dieser Button ist auf jeder Seite sichtbar.
    slot: 52
    # Item, das für diesen Button angezeigt wird.
    material: ARROW
    # Anzeigename des Buttons.
    name: "&eSeite 2"
    # Beschreibung unter dem Buttonnamen.
    lore:
      - "&7Öffnet die zweite Flag-Seite."
    # Interne Aktion: öffnet Seite 2 des Flag-Menüs.
    commands:
      - "open-menu:flags:2"
    # Wenn true, wird das Menü nach dem Klick geschlossen.
    close: false
    # Optional: Permission, die ein Spieler braucht, damit der Button sichtbar ist.
    permission: ""
