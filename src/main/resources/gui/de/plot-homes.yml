# Mehrere Plot-Homes. Format im Chat: id; Name; Rolle
title: "&8Plot-Homes"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: COMPASS
    name: "&eGespeicherte Homes"
    lore:
      - "&7Homes: &f{plot_homes}"
      - "&7Linksklick: Teleport"
      - "&7Shift + Rechtsklick: löschen"
  add:
    slot: 40
    material: LIME_DYE
    name: "&aHome setzen"
    lore:
      - "&7Speichert deine aktuelle Position."
      - "&8Format: id; Name; Rolle"
    actions:
      - "SET_NAMED_HOME_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:settings"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: "plot-homes"
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  home-item:
    material: ENDER_PEARL
    name: "&a{home_display}"
    lore:
      - "&7ID: &f{home_id}"
      - "&7Rolle: &f{home_role}"
      - "&7Ort: &f{home_world} {home_x} {home_y} {home_z}"
      - "&7Gesetzt von: &f{home_created_by}"
      - "&8Linksklick teleportiert."
      - "&8Shift + Rechtsklick löscht."
    actions:
      - "PLOT_HOME_CLICK:{home_id}"
  previous-item:
    slot: 47
    material: ARROW
    name: "&eVorherige Seite"
    lore:
      - "&7Seite {page}/{pages}"
  next-item:
    slot: 51
    material: ARROW
    name: "&eNächste Seite"
    lore:
      - "&7Seite {page}/{pages}"
