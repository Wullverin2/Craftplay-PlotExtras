# Deko-GUI: Rand-Kategorien.
title: "&8Deko: Rand"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  tab-wall:
    slot: 10
    material: STONE_BRICKS
    name: "&eWand"
    lore:
      - "&7Öffnet die Wand-Kategorien."
    actions:
      - "OPEN:decor"
  tab-border:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&aRand"
    lore:
      - "&7Aktiver Tab"
    glow: true
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: component-categories
  component: border
  target-format: "decor-border-{category}"
  slots: "19-25"
  category-item:
    name: "&a{category_display}"
    lore:
      - "&7Verfügbare Blöcke: &f{option_count}"
      - "&7Klicke, um diese Kategorie zu öffnen."
