# Einstellungen: Tab Zeit.
# Optionen kommen aus config.yml unter plot-settings.time.options.
title: "&8Einstellungen: Zeit"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  tab-home:
    slot: 10
    material: WHITE_STAINED_GLASS_PANE
    name: "&eHome"
    actions:
      - "OPEN:settings"
  tab-weather:
    slot: 11
    material: WATER_BUCKET
    name: "&eWetter"
    actions:
      - "OPEN:settings-weather"
  tab-time:
    slot: 12
    material: LIME_STAINED_GLASS_PANE
    name: "&aZeit"
    glow: true
  tab-biome:
    slot: 13
    material: GRASS_BLOCK
    name: "&ePlotbiom"
    actions:
      - "OPEN:settings-biome"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: config-options
  source: plot-settings.time.options
  slots: "28-34"
  option-item:
    name: "&a{option_display}"
    lore:
      - "&7Setzt die Plot-Zeit auf &f{option_display}&7."
      - "&7Klicke zum Anwenden."
