        close: false
        permission: "plots.set.flag.weather"
      reset:
        slot: 25
        material: CAULDRON
        name: "&eWetter zurücksetzen"
        lore:
          - "&7Nutzt wieder das normale"
          - "&7Wetter der Plotwelt."
        commands:
          - "plot flag set weather reset"
        close: false
        permission: "plots.set.flag.weather"
      back:
        slot: 49
        material: ARROW
        name: "&cZurück"
        lore:
          - "&7Zurück zum Hauptmenü."
        commands:
          - "open-menu:main"
        close: false
        permission: ""
      close:
        slot: 53
        material: BARRIER
        name: "&cSchließen"
        lore:
          - "&7Schließt dieses Menü."
        commands: []
        close: true
        permission: ""
  biome:
    slot: 14
    material: GRASS_BLOCK
    name: "&aBiom"
    lore:
      - "&7Ändere das Biom"
      - "&7deines Plots."
    commands:
      - "open-menu:settings:biome"
    permission: ""
    buttons:
      plains:
        slot: 19
        material: GRASS_BLOCK
        name: "&aEbene"
        lore:
          - "&7Setzt das Plot-Biom"
          - "&7auf Ebene."
        commands:
          - "plot biome plains"
        close: false
        permission: "plots.set.biome"
      forest:
        slot: 20
        material: OAK_LOG
        name: "&aWald"
        lore:
          - "&7Setzt das Plot-Biom"
          - "&7auf Wald."
        commands:
          - "plot biome forest"
        close: false
        permission: "plots.set.biome"
      desert:
        slot: 21
        material: SAND
        name: "&eWüste"
        lore:
          - "&7Setzt das Plot-Biom"
          - "&7auf Wüste."
        commands:
          - "plot biome desert"
        close: false
        permission: "plots.set.biome"
      jungle:
        slot: 22
        material: JUNGLE_LOG
        name: "&aDschungel"
        lore:
          - "&7Setzt das Plot-Biom"
          - "&7auf Dschungel."
        commands:
          - "plot biome jungle"
        close: false
        permission: "plots.set.biome"
      swamp:
        slot: 23
        material: VINE
        name: "&2Sumpf"
        lore:
          - "&7Setzt das Plot-Biom"
          - "&7auf Sumpf."
        commands:
          - "plot biome swamp"
        close: false
        permission: "plots.set.biome"
      taiga:
        slot: 24
        material: SPRUCE_LOG
        name: "&aTaiga"
        lore:
          - "&7Setzt das Plot-Biom"
          - "&7auf Taiga."
        commands:
          - "plot biome taiga"
        close: false
        permission: "plots.set.biome"
      reset:
        slot: 25
        material: COMPASS
        name: "&eBiom zurücksetzen"
        lore:
          - "&7Setzt das Biom auf den"
          - "&7hier konfigurierten Standard."
          - "&8Default: plains"
        commands:
          - "plot biome plains"
        close: false
        permission: "plots.set.biome"
      back:
        slot: 49
        material: ARROW
        name: "&cZurück"
        lore:
          - "&7Zurück zum Hauptmenü."
        commands:
          - "open-menu:main"
        close: false
        permission: ""
      close:
        slot: 53
        material: BARRIER
        name: "&cSchließen"
        lore:
          - "&7Schließt dieses Menü."
        commands: []
        close: true
        permission: ""
  time:
    slot: 16
    material: CLOCK
    name: "&aZeit"
    lore:
