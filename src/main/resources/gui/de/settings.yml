# Deutsches Einstellungs-Untermenü.
# Diese Datei steuert das Menü, in dem Spieler Plot-Homes, Wetter, Biome und Zeit ändern.
# Alle Tabs und Buttons können bei Name, Slot, Material, Lore, Commands und Permission angepasst werden.
# Tabs, Buttons und Deko-Items können slot: 13, slot: [13, 14, 15] oder slots: [13, 14, 15] nutzen.
# Jeder Button kann eigene Befehle ausführen. Prefixe: console:, player:, op:, open-menu:.
# Optional kann statt des Materials ein HeadDatabase-Kopf mit head-database-id genutzt werden.
# Spieler-Köpfe sind per material: PLAYERHEAD %player_name% oder skull-owner: "%player_name%" möglich.
# Deko-Items stehen unter decorations und sind reine Anzeigeelemente ohne Aktion.
# PlaceholderAPI-Platzhalter funktionieren in Titel, Tab-Namen, Buttonnamen, Lore und Commands.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Menüoptionen automatisch zu ergänzen.
file-version: 5

# Titel des Inventars. Platzhalter: {tab}
title: "&8Plot-Einstellungen: {tab}"
# Größe des Inventars. Erlaubt sind 9, 18, 27, 36, 45 oder 54 Slots.
size: 54
# Tab, der geöffnet wird, wenn kein Tab angegeben wurde.
default-tab: homes
# Füllitem für leere Slots.
filler:
  # Wenn true, werden leere Slots mit dem unten angegebenen Material gefüllt.
  enabled: true
  # Materialname aus Minecraft/Spigot.
  material: BLACK_STAINED_GLASS_PANE
  # Anzeigename des Füllitems. &r macht den Namen leer/unauffällig.
  name: "&r"
# Deko-Items, die in jedem Tab angezeigt werden.
decorations:
  bottom-spacer:
    # Slot im Inventar.
    slot: 52
    # Material-Fallback.
    material: GRAY_STAINED_GLASS_PANE
    # Optional: HeadDatabase-ID. Beispiel: "12345"
    head-database-id: ""
    # Anzeigename des Deko-Items.
    name: "&r"
    # Lore des Deko-Items.
    lore: []
    # Optional: Permission, damit diese Deko sichtbar ist.
    permission: ""
# Tabs im Einstellungsmenü.
# Jeder Tab hat einen eigenen Button oben im Menü und darunter eigene Aktionsbuttons.
tabs:
  homes:
    # Slot des Tab-Buttons.
    slot: 10
    # Item des Tab-Buttons.
    material: COMPASS
    # Anzeigename des Tab-Buttons.
    name: "&aPlot-Homes"
    # Beschreibung des Tab-Buttons.
    lore:
      - "&7Teleportiere dich zum Plot-Home"
      - "&7oder setze es neu."
    # Interne Aktion zum Öffnen dieses Tabs.
    commands:
      - "open-menu:settings:homes"
    # Optional: Permission, damit der Tab sichtbar ist.
    permission: ""
    # Buttons innerhalb dieses Tabs.
    buttons:
      open-home:
        # Slot im Inventar.
        slot: 22
        # Item dieses Buttons.
        material: ENDER_PEARL
        # Anzeigename des Buttons.
        name: "&aPlot-Home nutzen"
        # Beschreibung des Buttons.
        lore:
          - "&7Teleportiert dich zu deinem"
          - "&7aktuellen Plot-Home."
        # Befehle werden als Spieler ausgeführt. Mit console: davor als Konsole.
        commands:
          - "plot home"
        # Wenn true, wird das Menü nach dem Klick geschlossen.
        close: true
        # Optional: Permission, damit der Button sichtbar ist.
        permission: "plots.home"
      set-home:
        slot: 23
        material: LODESTONE
        name: "&aPlot-Home setzen"
        lore:
          - "&7Setzt das Home deines Plots"
          - "&7auf deine aktuelle Position."
        commands:
          - "plot sethome"
        close: false
        permission: "plots.set.home"
      reset-home:
        slot: 24
        material: BARRIER
        name: "&cPlot-Home entfernen"
        lore:
          - "&7Entfernt das gesetzte Home"
          - "&7und nutzt wieder den Standard."
        commands:
          - "plot sethome none"
        close: false
        permission: "plots.set.home"
      back:
        slot: 49
        material: ARROW
        name: "&cZurück"
        lore:
          - "&7Zurück zum Hauptmenü."
        commands:
          - "open-menu:main"
        close: false
        permission: ""
      close:
        slot: 53
        material: BARRIER
        name: "&cSchließen"
        lore:
          - "&7Schließt dieses Menü."
        commands: []
        close: true
        permission: ""
  weather:
    slot: 12
    material: SUNFLOWER
    name: "&aWetter"
    lore:
      - "&7Ändere das Wetter"
      - "&7auf deinem Plot."
    commands:
      - "open-menu:settings:weather"
    permission: ""
    buttons:
      clear:
        slot: 21
        material: SUNFLOWER
        name: "&aKlar"
        lore:
          - "&7Setzt das Plot-Wetter"
          - "&7auf klaren Himmel."
        commands:
          - "plot flag set weather clear"
        close: false
        permission: "plots.set.flag.weather"
      rain:
        slot: 23
        material: WATER_BUCKET
        name: "&bRegen"
        lore:
          - "&7Setzt das Plot-Wetter"
          - "&7auf Regen."
