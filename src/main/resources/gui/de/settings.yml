      record-cat: {enabled: true, slot: 21, material: MUSIC_DISC_CAT, name: "&aMusik: Cat", lore: ["&7Setzt die Plot-Musik."], commands: ["plot flag set music cat"], close: false, permission: "plots.set.flag.music"}
      record-blocks: {enabled: true, slot: 22, material: MUSIC_DISC_BLOCKS, name: "&aMusik: Blocks", lore: ["&7Setzt die Plot-Musik."], commands: ["plot flag set music blocks"], close: false, permission: "plots.set.flag.music"}
      reset: {enabled: true, slot: 24, material: BARRIER, name: "&eMusik zurücksetzen", lore: ["&7Entfernt die Musik-Flag."], commands: ["plot flag remove music"], close: false, permission: "plots.flag.remove"}
      back: {enabled: true, slot: 49, material: ARROW, name: "&cZurück", lore: ["&7Zurück zum Hauptmenü."], commands: ["open-menu:main"], close: false, permission: ""}
      close: {enabled: true, slot: 53, material: BARRIER, name: "&cSchließen", lore: ["&7Schließt dieses Menü."], commands: [], close: true, permission: ""}
  stats:
    enabled: true
    slot: 32
    material: FILLED_MAP
    name: "&aStatistiken"
    lore:
      - "&7Infos, Banner, Bild"
      - "&7und Featured-Profile."
    commands:
