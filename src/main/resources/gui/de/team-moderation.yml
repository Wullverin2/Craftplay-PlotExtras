# Team-Moderationsmenü für den aktuellen Plot.
title: "&8Moderation"
permission: "craftplayplotextras.moderation.manage"
size: 54

fill:
  enabled: true
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: PACKED_ICE
    name: "&bModeration"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Besitzer: &f{plot_owner}"
  list:
    slot: 10
    material: PAPER
    name: "&aGesperrte Plots"
    actions:
      - "TEAM_MOD_LIST"
  freeze:
    slot: 12
    material: PACKED_ICE
    name: "&bPlot einfrieren"
    actions:
      - "TEAM_FREEZE:GUI-Freeze"
  unfreeze:
    slot: 14
    material: HONEYCOMB
    name: "&aPlot freigeben"
    actions:
      - "TEAM_UNFREEZE"
  redstone:
    slot: 16
    permission: "craftplayplotextras.redstone.admin"
    material: REDSTONE_BLOCK
    name: "&cRedstone aktivieren"
    actions:
      - "REDSTONE_ENABLE"
  cleanup-drops:
    slot: 20
    material: HOPPER
    name: "&eDrops entfernen"
    actions:
      - "TEAM_CLEANUP:drops"
  cleanup-projectiles:
    slot: 21
    material: ARROW
    name: "&eProjektile entfernen"
    actions:
      - "TEAM_CLEANUP:projectiles"
  cleanup-monsters:
    slot: 22
    material: ZOMBIE_HEAD
    name: "&eMonster entfernen"
    actions:
      - "TEAM_CLEANUP:monsters"
  cleanup-animals:
    slot: 23
    material: WHEAT
    name: "&eTiere entfernen"
    actions:
      - "TEAM_CLEANUP:animals"
  cleanup-vehicles:
    slot: 24
    material: MINECART
    name: "&eFahrzeuge entfernen"
    actions:
      - "TEAM_CLEANUP:vehicles"
  cleanup-all:
    slot: 31
    material: TNT
    name: "&cAlles entfernen"
    actions:
      - "TEAM_CLEANUP:all"
  performance:
    slot: 33
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&ePerformance"
    actions:
      - "OPEN:performance"
  inspector:
    slot: 35
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bInspektor"
    actions:
      - "OPEN:team-inspector"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
