# Deko-GUI: Wand-Kategorien.
title: "&8Deko: Wand"
size: 54

fill:
  enabled: true
  material: BROWN_STAINED_GLASS_PANE
  name: " "

items:
  tab-wall:
    slot: 10
    material: LIME_STAINED_GLASS_PANE
    name: "&aWand"
    lore:
      - "&7Aktiver Tab"
    glow: true
  tab-border:
    slot: 11
    material: GRASS_BLOCK
    name: "&eRand"
    lore:
      - "&7Öffnet die Rand-Kategorien."
    actions:
      - "OPEN:decor-border"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: component-categories
  component: wall
  target-format: "decor-wall-{category}"
  slots: "20-24"
  category-item:
    name: "&a{category_display}"
    lore:
      - "&7Verfügbare Blöcke: &f{option_count}"
      - "&7Klicke, um diese Kategorie zu öffnen."
