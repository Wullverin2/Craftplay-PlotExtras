# Team-Statistikübersicht.
title: "&8Statistik"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: LECTERN
    name: "&bPlotExtras Statistik"
    lore:
      - "&7Schneller Überblick"
      - "&7über gespeicherte Daten."
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: statistics
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25]
  stat-item:
    material: LECTERN
    name: "&b{stat_display}"
    lore:
      - "&7Wert: &f{stat_value}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
