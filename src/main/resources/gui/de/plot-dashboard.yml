# Spieler-Dashboard für das aktuelle Plot.
title: "&8Plot-Dashboard"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 13
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot-Dashboard"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Besitzer: &f{plot_owner}"
      - "&7Deine Rolle: &f{plot_role}"
      - "&7Status: &f{plot_status_display}"
      - "&7Besuche: &f{plot_visits}"
      - "&7Favoriten: &f{plot_likes}"
      - "&7Warps: &f{plot_warps}"
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
  note:
    slot: 20
    material: WRITABLE_BOOK
    name: "&aPlotnotiz"
    lore:
      - "&7Aktuell:"
      - "&f{plot_owner_note}"
      - "&8Besitzer können sie ändern."
    actions:
      - "PLOT_NOTE_PROMPT"
  like:
    slot: 21
    material: EMERALD
    name: "&aFavorisieren"
    lore:
      - "&7Markiert dieses Plot"
      - "&7als Favorit."
      - "&7Aktuell: &f{plot_likes}"
    actions:
      - "TOGGLE_PLOT_LIKE"
  settings:
    slot: 22
    material: COMPARATOR
    name: "&aEinstellungen"
    lore:
      - "&7Home, Wetter, Zeit"
      - "&7und Plotbiom."
    actions:
      - "OPEN:settings"
  flags:
    slot: 23
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Plotflags ansehen"
      - "&7und ändern."
    actions:
      - "OPEN:flags"
  entity-limits:
    slot: 24
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    lore:
      - "&7Aktuelle Entity-Zahlen"
      - "&7und Maximalwerte."
    actions:
      - "OPEN:entity-limits"
  members:
    slot: 30
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Mitglieder und Rollen."
    actions:
      - "OPEN:members"
  warps:
    slot: 29
    material: ENDER_PEARL
    name: "&aPlot-Warps"
    lore:
      - "&7Gespeicherte Orte auf"
      - "&7diesem Plot: &f{plot_warps}"
    actions:
      - "OPEN:plot-warps"
  decor:
    slot: 31
    material: GRASS_BLOCK
    name: "&aDeko"
    lore:
      - "&7Wand und Rand ändern."
    actions:
      - "OPEN:decor"
  team-note:
    slot: 32
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bTeamnotiz"
    lore:
      - "&7Aktuell:"
      - "&f{plot_team_note}"
      - "&8Nur Teammitglieder."
    actions:
      - "TEAM_NOTE_PROMPT"
  presets:
    slot: 33
    material: MAP
    name: "&aPresets"
    lore:
      - "&7Schnelle Vorlagen für"
      - "&7typische Plot-Einstellungen."
    actions:
      - "OPEN:flag-presets"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
