# Spieler-Dashboard für das aktuelle Plot.
title: "&8Plot-Dashboard"
size: 54

fill:
  enabled: true
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot-Übersicht"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Besitzer: &f{plot_owner}"
      - "&7Deine Rolle: &f{plot_role}"
      - "&7Status: &f{plot_status_display}"
      - "&7Besuche: &f{plot_visits}"
      - "&7Favoriten: &f{plot_likes}"
      - "&7Warps: &f{plot_warps}"
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
  settings:
    slot: 10
    material: COMPARATOR
    name: "&aEinstellungen"
    lore:
      - "&7Home, Wetter, Zeit"
      - "&7und Plotbiom."
    actions:
      - "OPEN:settings"
  flags:
    slot: 11
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Plotflags ansehen"
      - "&7und ändern."
    actions:
      - "OPEN:flags"
  decor:
    slot: 12
    material: GRASS_BLOCK
    name: "&aDeko"
    lore:
      - "&7Wand und Rand ändern."
    actions:
      - "OPEN:decor"
  members:
    slot: 13
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Mitglieder, Trusts"
      - "&7und Rollen."
    actions:
      - "OPEN:members"
  warps:
    slot: 14
    material: ENDER_PEARL
    name: "&aPlot-Warps"
    lore:
      - "&7Gespeicherte Orte: &f{plot_warps}"
    actions:
      - "OPEN:plot-warps"
  entity-limits:
    slot: 15
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    lore:
      - "&7Aktuelle Entity-Zahlen"
      - "&7und Maximalwerte."
    actions:
      - "OPEN:entity-limits"
  presets:
    slot: 16
    material: MAP
    name: "&aPresets"
    lore:
      - "&7Schnelle Vorlagen für"
      - "&7typische Plot-Einstellungen."
    actions:
      - "OPEN:flag-presets"
  note:
    slot: 21
    material: WRITABLE_BOOK
    name: "&aPlotnotiz"
    lore:
      - "&7Aktuell:"
      - "&f{plot_owner_note}"
    actions:
      - "PLOT_NOTE_PROMPT"
  like:
    slot: 22
    material: EMERALD
    name: "&aFavorisieren"
    lore:
      - "&7Aktuell: &f{plot_likes}"
      - "&7Klicke zum Umschalten."
    actions:
      - "TOGGLE_PLOT_LIKE"
  report:
    slot: 23
    material: BELL
    name: "&cPlot melden"
    lore:
      - "&7Meldet dieses Plot"
      - "&7an das Team."
    actions:
      - "PLAYER_COMMAND:pe report Dashboard-Meldung"
  contest:
    slot: 24
    material: GOLDEN_APPLE
    name: "&6Wettbewerb"
    lore:
      - "&7Meldet dieses Plot für"
      - "&7den Standard-Wettbewerb an."
    actions:
      - "OPEN:competitions"
  tools:
    slot: 29
    material: COMPASS
    name: "&aPlot-Werkzeuge"
    lore:
      - "&7Profil, Suche,"
      - "&7Gästebuch und Anfragen."
    actions:
      - "OPEN:plot-tools"
  team-note:
    slot: 31
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bTeamnotiz"
    lore:
      - "&7Aktuell:"
      - "&f{plot_team_note}"
      - "&8Nur Teammitglieder."
    actions:
      - "TEAM_NOTE_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
