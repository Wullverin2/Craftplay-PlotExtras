# Deutsches Zukunfts-/Premiumfeatures-Menü.
# Diese Datei bündelt optionale Featureprofile. Jeder Button kann einzeln per enabled: false
# abgeschaltet oder mit eigenen Commands, Permissions und Icons versehen werden.

file-version: 1
title: "&8Zukunftsfeatures: {tab}"
size: 54
default-tab: analytics
require-plot: false
permission: "craftplayplotextras.future"
bedrock: {enabled: true, title: "Zukunftsfeatures", content: "Optionale Systeme und Profile."}
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
buttons:
  back: {slot: 49, material: ARROW, name: "&eZurück", lore: ["&7Zurück zum Hauptmenü."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {slot: 53, material: BARRIER, name: "&cSchließen", lore: ["&7Schließt dieses Menü."], commands: [], close: true, permission: ""}
decorations:
  frame: {slot: [0, 8, 45, 46, 47, 48, 50, 51, 52], material: PURPLE_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}
tabs:
  analytics:
    slot: 10
    material: COMPASS
    name: "&bAnalyse"
    lore: ["&7Heatmaps, Besucher,", "&7Ranking und Redstone."]
    commands: ["open-menu:future:analytics"]
    buttons:
      heatmaps: {slot: 19, material: MAGMA_BLOCK, name: "&6Plot Heatmaps", lore: ["&7Profil für Heatmap-Auswertungen."], commands: ["plot list top"], close: true, permission: "craftplayplotextras.future.heatmaps"}
      visitor-statistics: {slot: 20, material: CLOCK, name: "&aBesucherstatistiken", lore: ["&7Profil für Besuchsstatistiken."], commands: ["open-menu:history:stats"], close: false, permission: "craftplayplotextras.future.visitors"}
      ranking: {slot: 21, material: GOLD_BLOCK, name: "&6Plot Ranking", lore: ["&7Profil für Ranglisten."], commands: ["plot list top"], close: true, permission: "plots.list"}
      ai-tagging: {slot: 22, material: COMMAND_BLOCK, name: "&dAI Tagging", lore: ["&7Standardmäßig nur Profilbutton."], commands: ["open-menu:myplots:1:category:all"], close: false, permission: "craftplayplotextras.future.ai"}
      redstone-analysis: {slot: 23, material: REDSTONE, name: "&cRedstone Analyse", lore: ["&7Profil für Redstone-Prüfungen."], commands: ["plot debugpaste"], close: true, permission: "plots.admin"}
  content:
    slot: 12
    material: PAINTING
    name: "&aInhalte"
    lore: ["&7Galerie, Templates,", "&7Auto-Backups und Undo."]
    commands: ["open-menu:future:content"]
    buttons:
      gallery: {slot: 19, material: PAINTING, name: "&ePlot Galerie", lore: ["&7Profil für Galerien."], commands: ["plot list top"], close: true, permission: "plots.list"}
      templates: {slot: 20, material: FILLED_MAP, name: "&aPlot Templates", lore: ["&7Öffnet Vorlagen im Erstellen-Menü."], commands: ["open-menu:create:templates"], close: false, permission: "plots.schematic.paste"}
      auto-backups: {slot: 21, material: WRITABLE_BOOK, name: "&aAuto Backups", lore: ["&7Backups laufen bereits bei Delete,", "&7Reset und Unmerge automatisch."], commands: ["open-menu:danger:restore"], close: false, permission: "craftplayplotextras.backup.list"}
      undo: {slot: 22, material: ENDER_CHEST, name: "&eUndo System", lore: ["&7Restore über Plotbackups."], commands: ["open-menu:team-backups:1"], close: false, permission: "craftplayplotextras.backup.restore"}
  economy:
    slot: 14
    material: EMERALD
    name: "&aWirtschaft"
    lore: ["&7Markt, Handel,", "&7Auktionen und NPCs."]
    commands: ["open-menu:future:economy"]
    buttons:
      market: {slot: 19, material: EMERALD, name: "&aPlot Markt", lore: ["&7Profil für Marktsysteme."], commands: ["plot list all"], close: true, permission: "craftplayplotextras.future.market"}
      trading: {slot: 20, material: CHEST, name: "&aPlot Handel", lore: ["&7Profil für Handelssysteme."], commands: ["plot list all"], close: true, permission: "craftplayplotextras.future.trading"}
      auctions: {slot: 21, material: GOLD_INGOT, name: "&6Plot Auktionen", lore: ["&7Profil für Auktionen."], commands: ["plot list all"], close: true, permission: "craftplayplotextras.future.auctions"}
      npcs: {slot: 22, material: PLAYER_HEAD, name: "&ePlot NPCs", lore: ["&7Profil für NPC-Systeme."], commands: ["plot info"], close: true, permission: "craftplayplotextras.future.npcs"}
  integrations:
    slot: 16
    material: BEACON
    name: "&dIntegrationen"
    lore: ["&7Discord und Webübersicht."]
    commands: ["open-menu:future:integrations"]
    buttons:
      discord: {slot: 20, material: BELL, name: "&9Discord Integration", lore: ["&7Profil für Discordmeldungen."], commands: ["plot info"], close: true, permission: "craftplayplotextras.future.discord"}
      web-overview: {slot: 22, material: MAP, name: "&bWebübersicht", lore: ["&7Profil für Webkarten oder Übersichten."], commands: ["plot list top"], close: true, permission: "craftplayplotextras.future.web"}
