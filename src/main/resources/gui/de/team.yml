# Deutsches Team-Menü.
# Diese Datei steuert Teamfunktionen wie Plotbackups und die Backupliste.
# Alle Buttons sind frei anpassbar: Slot, Material, HeadDatabase-ID, Name, Lore, Commands und Permission.
# PlaceholderAPI-Platzhalter funktionieren in Titeln, Namen, Lore und Commands.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Menüoptionen automatisch zu ergänzen.
file-version: 1

# Titel des Team-Hauptinventars.
title: "&8Team-Menü"
# Größe des Team-Hauptinventars. Erlaubt sind 9, 18, 27, 36, 45 oder 54 Slots.
size: 27
# Füllitem für leere Slots.
filler:
  # Wenn true, werden leere Slots mit dem unten angegebenen Material gefüllt.
  enabled: true
  # Materialname aus Minecraft/Spigot.
  material: BLACK_STAINED_GLASS_PANE
  # Anzeigename des Füllitems. &r macht den Namen leer/unauffällig.
  name: "&r"
# Buttons im Team-Hauptmenü.
buttons:
  create-backup:
    # Slot im Inventar. 0 ist oben links.
    slot: 11
    # Item, das für diesen Button angezeigt wird.
    material: WRITABLE_BOOK
    # Anzeigename des Buttons.
    name: "&aPlot sichern"
    # Beschreibung unter dem Buttonnamen.
    lore:
      - "&7Erstellt ein Schematic-Backup"
      - "&7des Plots oder Plotmerges,"
      - "&7auf dem du stehst."
    # Spezieller Plugin-Befehl zum Erstellen eines Backups.
    commands:
      - "plot-backup:create"
    # Wenn true, wird das Menü nach dem Klick geschlossen.
    close: true
    # Permission, die zum Sehen und Nutzen benötigt wird.
    permission: "craftplayplotextras.backup.create"
  list-backups:
    slot: 15
    material: CHEST
    name: "&ePlotbackups"
    lore:
      - "&7Zeigt alle gespeicherten"
      - "&7Plotbackups mit Informationen."
    commands:
      - "open-menu:team-backups:1"
    close: false
    permission: "craftplayplotextras.backup.list"
  back:
    slot: 18
    material: ARROW
    name: "&eZurück"
    lore:
      - "&7Zurück zum Hauptmenü."
    commands:
      - "open-menu:main"
    close: false
    permission: ""
  close:
    slot: 22
    material: BARRIER
    head-database-id: ""
    name: "&cSchließen"
    lore:
      - "&7Schließt dieses Menü."
    commands: []
    close: true
    permission: ""
# Deko-Items sind reine Anzeigeelemente ohne Aktion.
decorations:
  left:
    slot: 0
    material: RED_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
  right:
    slot: 8
    material: RED_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""

# Liste aller Plotbackups.
backup-list:
  # Titel der Backupliste. Platzhalter: {page}
  title: "&8Plotbackups &7- Seite {page}"
  # Größe des Listeninventars.
  size: 54
  # Füllitem für leere Slots der Backupliste.
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: "&r"
  # Slots, auf denen Backups angezeigt werden.
  slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34
  # Vorlage für jedes Backup-Item.
  item:
    material: FILLED_MAP
    head-database-id: ""
    # Platzhalter: {id}, {file}, {owner}, {created_by}, {created_at}, {action}, {world}, {plot}, {plots}, {merge}
    name: "&e{owner} &7- &f{plot}"
    lore:
      - "&7Aktion: &f{action}"
      - "&7Erstellt: &f{created_at}"
      - "&7Erstellt von: &f{created_by}"
      - "&7Welt: &f{world}"
      - "&7Plot/Merge: &f{merge}"
      - "&7Plots: &f{plots}"
      - "&7Datei: &f{file}"
      - ""
      - "&aKlicken zum Wiederherstellen"
      - "&7auf dem Plot, auf dem du stehst."
  # Buttons in der Backupliste.
  buttons:
    previous:
      slot: 45
      material: ARROW
      name: "&eVorherige Seite"
      lore:
        - "&7Öffnet Seite {previous_page}."
      commands:
        - "open-menu:team-backups:{previous_page}"
      close: false
      permission: "craftplayplotextras.backup.list"
    next:
      slot: 53
      material: ARROW
      name: "&eNächste Seite"
      lore:
        - "&7Öffnet Seite {next_page}."
      commands:
        - "open-menu:team-backups:{next_page}"
      close: false
      permission: "craftplayplotextras.backup.list"
    back:
      slot: 49
      material: OAK_DOOR
      name: "&eZurück"
      lore:
        - "&7Zurück zum Team-Menü."
      commands:
        - "open-menu:team"
      close: false
      permission: "craftplayplotextras.team"
    close:
      slot: 50
      material: BARRIER
      name: "&cSchließen"
      lore:
        - "&7Schließt dieses Menü."
      commands: []
      close: true
      permission: ""
  # Deko-Items in der Backupliste.
  decorations:
    top-left:
      slot: 0
      material: RED_STAINED_GLASS_PANE
      head-database-id: ""
      name: "&r"
      lore: []
      permission: ""
    top-right:
      slot: 8
      material: RED_STAINED_GLASS_PANE
      head-database-id: ""
      name: "&r"
      lore: []
      permission: ""
