# Deutsches Meine-Plots-Menü.
# Diese Datei steuert das Java-Inventar für eigene Plots.
# Hier konfigurierst du Titel, Größe, Füllitems, Plot-Slots, Deko, Buttons, Sortierung und die Detailansicht.
# Buttons und Deko können slot: 13, slot: [13, 14, 15] oder slots: [13, 14, 15] nutzen.
# Mit material: PLAYERHEAD %player_name% kann der Kopf des Spielers angezeigt werden.
# Alternativ kann head-database-id gesetzt werden, wenn HeadDatabase installiert ist.
# Eigene Befehle sind in commands möglich. Prefixe: console:, player:, op:, open-menu:.
# PlaceholderAPI-Platzhalter funktionieren in Titel, Namen, Lore und Befehlen.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Optionen automatisch zu ergänzen.
file-version: 3

# Titel des Inventars. Platzhalter: {page}, {max_page}, {sort_name}, {filter_name}, {amount}
title: "&8Meine Plots &7- Seite {page}/{max_page}"
# Größe des Inventars. Erlaubt sind 9, 18, 27, 36, 45 oder 54 Slots.
size: 54
# Slots, auf denen Plot-Einträge angezeigt werden.
plot-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]

# Füllitem für leere Slots.
filler:
  # Wenn true, werden leere Slots mit diesem Item gefüllt.
  enabled: true
  # Materialname aus Minecraft/Spigot.
  material: BLACK_STAINED_GLASS_PANE
  # Anzeigename des Füllitems.
  name: "&r"

# Kategorien, die Spieler in der Detailansicht für ihre Plots durchschalten können.
categories:
  # Kategorie, die genutzt wird, wenn ein Plot noch keine Kategorie hat.
  default: "Allgemein"
  # Verfügbare Kategorien. Die Reihenfolge ist die Klick-Reihenfolge.
  available: ["Allgemein", "Bauprojekt", "Shop", "Farm", "Redstone", "Pixelart", "Rollenspiel", "Event"]

# Tags, die Spieler in der Detailansicht an- und abwählen können.
tags:
  # Verfügbare Tags. Die Reihenfolge entspricht den tag-slots in der Detailansicht.
  available: ["Shop", "Farm", "Rollenspiel", "Redstone", "Pixelart", "Event"]

# Darstellung eines Plots in der Listenansicht.
plot-item:
  # Wenn false, werden die klickbaren Plot-Einträge ausgeblendet.
  enabled: true
  # Optional: Permission, damit Plot-Einträge sichtbar und anklickbar sind.
  permission: ""
  # Material des Plot-Eintrags.
  material: FILLED_MAP
  # Name des Plot-Eintrags. Platzhalter stehen weiter unten in der Lore.
  name: "&a{favorite} {name}"
  # Lore des Plot-Eintrags.
  lore:
    - "&7Plot: &f{plot}"
    - "&7Welt: &f{world}"
    - "&7Merge: &f{merge}"
    - "&7Größe: &f{size}"
    - "&7Sichtbarkeit: &f{visibility}"
    - "&7Kategorie: &f{category}"
    - "&7Tags: &f{tags}"
    - "&7Notiz: &f{note}"
    - "&7Besuche: &f{visits}"
    - "&7Letzter Besuch: &f{last_visit}"
    - ""
    - "&aLinksklick: Teleportieren"
    - "&eRechtsklick: Details öffnen"
    - "&6Shift-Linksklick: Favorit umschalten"
    - "&bShift-Rechtsklick: Sichtbarkeit wechseln"

# Buttons der Listenansicht.
buttons:
  previous-page:
    # Vorherige Seite öffnen.
    slot: 45
    material: ARROW
    name: "&eVorherige Seite"
    lore:
      - "&7Öffnet Seite &f{previous_page}&7."
    commands:
      - "open-menu:myplots:{previous_page}:{sort}:{filter}"
    close: false
    permission: ""
  sort-name:
    # Sortiert nach Plotname beziehungsweise Alias.
    slot: 46
    material: NAME_TAG
    name: "&aSortierung: Name"
    lore:
      - "&7Aktuell: &f{sort_name}"
    commands:
      - "open-menu:myplots:1:name:{filter}"
    close: false
    permission: ""
  sort-size:
    # Sortiert nach Merge-Größe.
    slot: 47
    material: CHEST
    name: "&aSortierung: Größe"
    lore:
      - "&7Aktuell: &f{sort_name}"
    commands:
      - "open-menu:myplots:1:size:{filter}"
    close: false
    permission: ""
  sort-activity:
    # Sortiert nach letzter Nutzung über dieses Menü.
    slot: 48
    material: CLOCK
    name: "&aSortierung: Aktivität"
    lore:
      - "&7Aktuell: &f{sort_name}"
    commands:
      - "open-menu:myplots:1:activity:{filter}"
    close: false
    permission: ""
  filter-all:
    # Zeigt alle eigenen Plots.
    slot: 49
    material: COMPASS
    name: "&bAlle Plots"
    lore:
      - "&7Filter: &f{filter_name}"
      - "&7Anzahl: &f{amount}"
    commands:
      - "open-menu:myplots:1:{sort}:all"
    close: false
    permission: ""
  filter-favorites:
    # Zeigt nur favorisierte Plots.
    slot: 50
    material: NETHER_STAR
    name: "&eFavoriten"
    lore:
      - "&7Zeigt nur Plots,"
      - "&7die du favorisiert hast."
    commands:
      - "open-menu:myplots:1:{sort}:favorites"
    close: false
    permission: ""
  filter-public:
    # Zeigt nur öffentliche Plots.
    slot: 51
    material: LIME_DYE
    name: "&aÖffentliche Plots"
    lore:
      - "&7Zeigt Plots, die öffentlich"
      - "&7oder per Flag betretbar sind."
    commands:
      - "open-menu:myplots:1:{sort}:public"
    close: false
    permission: ""
  filter-private:
    # Zeigt nur private Plots.
    slot: 52
    material: GRAY_DYE
    name: "&7Private Plots"
    lore:
      - "&7Zeigt Plots, die nicht"
      - "&7öffentlich erkannt werden."
    commands:
      - "open-menu:myplots:1:{sort}:private"
    close: false
    permission: ""
  next-page:
    # Nächste Seite öffnen.
    slot: 53
    material: ARROW
    name: "&eNächste Seite"
    lore:
      - "&7Öffnet Seite &f{next_page}&7."
    commands:
      - "open-menu:myplots:{next_page}:{sort}:{filter}"
    close: false
    permission: ""
  sort-category:
    # Sortiert nach der gespeicherten Plot-Kategorie.
    slot: 3
    material: BOOK
    name: "&dSortierung: Kategorie"
    lore:
      - "&7Aktuell: &f{sort_name}"
    commands:
      - "open-menu:myplots:1:category:{filter}"
    close: false
    permission: ""
  sort-rating:
    # Sortiert nach gespeicherter Bewertung. Der Wert kann später von Community-Funktionen genutzt werden.
    slot: 5
    material: GOLD_INGOT
    name: "&6Sortierung: Bewertung"
    lore:
      - "&7Aktuell: &f{sort_name}"
    commands:
      - "open-menu:myplots:1:rating:{filter}"
    close: false
    permission: ""
  back:
    # Zurück ins Hauptmenü.
    slot: 7
    material: OAK_DOOR
    name: "&eZurück"
    lore:
      - "&7Zurück zum Hauptmenü."
    commands:
      - "open-menu:main"
    close: false
    permission: ""
  close:
    # Schließt das Menü.
    slot: 8
    material: BARRIER
    name: "&cSchließen"
    lore:
      - "&7Schließt dieses Menü."
    commands: []
    close: true
    permission: ""

# Deko-Items sind reine Anzeigeelemente ohne Aktion.
decorations:
  top-border:
    # Oberer Rahmen.
    slot: [0, 1, 2, 4, 6]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
  side-border:
    # Seitlicher Rahmen.
    slot: [9, 17, 18, 26, 27, 35, 36, 44]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""

# Detailansicht eines einzelnen Plots.
detail:
  # Titel des Detailinventars. Plot-Platzhalter sind verfügbar.
  title: "&8Plot: {name}"
  # Größe des Detailinventars.
  size: 54
  # Füllitem für die Detailansicht.
  filler:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: "&r"
  # Vorschau-Item mit den wichtigsten Daten des Plots.
  preview:
    enabled: true
    permission: ""
    slot: 13
    material: FILLED_MAP
    name: "&aVorschau: {name}"
    lore:
      - "&7Plot: &f{plot}"
      - "&7Welt: &f{world}"
      - "&7Besitzer: &f{owner}"
      - "&7Merge: &f{merge}"
      - "&7Enthaltene Plots: &f{plots}"
      - "&7Sichtbarkeit: &f{visibility}"
      - "&7Modus: &f{visibility_mode}"
      - "&7Kategorie: &f{category}"
      - "&7Tags: &f{tags}"
      - "&7Notiz: &f{note}"
      - "&7Erstellt: &f{created}"
  # Slots der Tag-Buttons.
  tag-slots: [28, 29, 30, 31, 32, 33]
  # Darstellung aktiver Tags.
  tag-active:
    enabled: true
    permission: ""
    material: LIME_DYE
    name: "&aTag: {tag}"
    lore:
      - "&7Status: &a{tag_status}"
      - "&eKlicken zum Entfernen."
  # Darstellung inaktiver Tags.
  tag-inactive:
    enabled: true
    permission: ""
    material: GRAY_DYE
    name: "&7Tag: {tag}"
    lore:
      - "&7Status: &c{tag_status}"
      - "&eKlicken zum Hinzufügen."
  # Buttons der Detailansicht.
  buttons:
    teleport:
      # Teleportiert direkt zum Plot.
      slot: 20
      material: ENDER_PEARL
      name: "&aTeleportieren"
      lore:
        - "&7Teleportiert dich zu diesem Plot."
      commands: []
      close: true
      permission: ""
    favorite:
      # Schaltet Favorit an oder aus.
      slot: 21
      material: NETHER_STAR
      name: "&eFavorit umschalten"
      lore:
        - "&7Aktuell: &f{favorite_status}"
      commands: []
      close: false
      permission: ""
    visibility:
      # Wechselt zwischen automatisch, öffentlich und privat.
      slot: 22
      material: OAK_DOOR
      name: "&bSichtbarkeit wechseln"
      lore:
        - "&7Erkannt: &f{visibility}"
        - "&7Gespeicherter Modus: &f{visibility_mode}"
      commands: []
      close: false
      permission: ""
    category:
      # Wechselt die Plot-Kategorie in der Reihenfolge oben.
      slot: 23
      material: BOOK
      name: "&dKategorie wechseln"
      lore:
        - "&7Aktuell: &f{category}"
      commands: []
      close: false
      permission: ""
    note:
      # Speichert eine private Notiz zu diesem Plot.
      slot: 24
      material: PAPER
      name: "&aNotiz bearbeiten"
      lore:
        - "&7Aktuell: &f{note}"
        - "&7Die Eingabe ist für andere"
        - "&7Spieler nicht sichtbar."
      commands:
        - "chat-input:chat-plot-note:plot-data-note:{plot_key}:{input}"
      close: true
      permission: ""
    back:
      # Zurück zur Listenansicht.
      slot: 49
      material: ARROW
      name: "&eZurück"
      lore:
        - "&7Zurück zur Plotliste."
      commands:
        - "open-menu:myplots:{page}:{sort}:{filter}"
      close: false
      permission: ""
    close:
      # Schließt die Detailansicht.
      slot: 53
      material: BARRIER
      name: "&cSchließen"
      lore:
        - "&7Schließt dieses Menü."
      commands: []
      close: true
      permission: ""
  # Deko-Items der Detailansicht.
  decorations:
    top-border:
      slot: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      material: GRAY_STAINED_GLASS_PANE
      head-database-id: ""
      name: "&r"
      lore: []
      permission: ""
    bottom-border:
      slot: [45, 46, 47, 48, 50, 51, 52]
      material: GRAY_STAINED_GLASS_PANE
      head-database-id: ""
      name: "&r"
      lore: []
      permission: ""
