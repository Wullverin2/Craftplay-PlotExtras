# Teamansicht für Plot-Meldungen.
title: "&8Plot-Meldungen"
permission: "craftplayplotextras.report.view"
size: 54

fill:
  enabled: true
  material: RED_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: BELL
    name: "&cOffene Meldungen"
    lore:
      - "&7Klick auf eine Meldung"
      - "&7schließt sie als erledigt."
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-reports
  show-closed: false
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  report-item:
    material: BELL
    name: "&c{report_id}"
    lore:
      - "&7Melder: &f{report_player}"
      - "&7Plot: &f{report_plot_key}"
      - "&7Besitzer: &f{report_owner}"
      - "&8{report_reason}"
      - "&cKlicken zum Schließen."
    actions:
      - "CLOSE_REPORT:{report_id}"
  readonly-report-item:
    material: BELL
    name: "&c{report_id}"
    lore:
      - "&7Melder: &f{report_player}"
      - "&7Plot: &f{report_plot_key}"
      - "&7Besitzer: &f{report_owner}"
      - "&8{report_reason}"
      - "&7Nur ansehen. Zum Schließen fehlt die Berechtigung."
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
