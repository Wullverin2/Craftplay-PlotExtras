# Deutsches Deko-Menü.
# Diese Datei steuert das PlotSquared-Deko-Menü für Wand und Rand.
# Aufbau: Wand und Rand sind Haupttabs. Darunter liegen Kategorie-Untertabs.
# In den Kategorie-Untertabs werden nur die Blockbuttons angezeigt, für die der Spieler die Permission hat.
# Der Befehl plot-deco:<befehl> prüft zuerst, ob der Spieler auf seinem eigenen Plot steht
# oder über eine passende Plotrolle/Rechte verfügt, und führt danach den PlotSquared-Befehl aus.

file-version: 2

title: "&8Deko: {tab} - {subtab}"
size: 54
default-tab: wall
require-plot: true
permission: "craftplayplotextras.deco"
bedrock:
  enabled: true
  title: "Deko"
  content: "Ändere Wand und Rand deines aktuellen Plots."
filler: {enabled: true, material: BLACK_STAINED_GLASS_PANE, name: "&r"}
animation:
  enabled: true
  delay-ticks: 1
  keep-filler-visible: true

buttons:
  back: {enabled: true, slot: 49, material: ARROW, name: "&eZurück", lore: ["&7Zurück zum Hauptmenü."], commands: ["open-menu:main"], close: false, permission: ""}
  close: {enabled: true, slot: 53, material: BARRIER, name: "&cSchließen", lore: ["&7Schließt dieses Menü."], commands: [], close: true, permission: ""}

decorations:
  frame: {enabled: true, slot: [9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 48, 50, 51, 52], material: GRAY_STAINED_GLASS_PANE, name: "&r", lore: [], permission: ""}

