# Team-GUI für Support, Moderation und Administration.
title: "&8Team-Inspektor"
permission: "craftplayplotextras.audit.view"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: SPYGLASS
    name: "&bPlotübersicht"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Besitzer: &f{plot_owner}"
      - "&7Rolle hier: &f{plot_role}"
      - "&7Mitglieder: &f{plot_members}"
      - "&7Vertraute: &f{plot_trusted}"
      - "&7Gesperrte: &f{plot_denied}"
      - "&7Plotlimit: &f{plot_count}&7/&f{plot_max}"
      - "&7Status: &f{plot_status_display}"
      - "&7Besuche: &f{plot_visits}"
      - "&7Favoriten: &f{plot_likes}"
      - "&7Teamnotiz: &f{plot_team_note}"
  audit:
    slot: 10
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&aAuditlog"
    lore:
      - "&7Letzte Plot- und"
      - "&7Teamaktionen."
    actions:
      - "OPEN:audit-log"
  backups:
    slot: 11
    permission: "craftplayplotextras.backup.admin"
    material: CHEST
    name: "&aBackups"
    lore:
      - "&7Backups ansehen und"
      - "&7Wiederherstellungen vorbereiten."
    actions:
      - "OPEN:backups"
  reports:
    slot: 12
    permission: "craftplayplotextras.report.view"
    material: BELL
    name: "&cPlot-Meldungen"
    lore:
      - "&7Listet offene Meldungen"
      - "&7im Chat auf."
    actions:
      - "OPEN:reports"
  performance:
    slot: 13
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&ePerformance"
    lore:
      - "&7Zählt Entities und zeigt"
      - "&7Auffälligkeiten."
    actions:
      - "OPEN:performance"
  members:
    slot: 14
    permission: "craftplayplotextras.audit.view"
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Mitglieder und Rollen"
      - "&7prüfen."
    actions:
      - "OPEN:members"
  flags:
    slot: 15
    permission: "craftplayplotextras.audit.view"
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Aktuelle Plotflags"
      - "&7ansehen."
    actions:
      - "OPEN:flags"
  plot-info:
    slot: 16
    permission: "craftplayplotextras.audit.view"
    material: PAPER
    name: "&aPlot-Info"
    lore:
      - "&7Zeigt die eigene"
      - "&7Plot-Info im Chat."
    actions:
      - "SHOW_PLOT_INFO"
  limits:
    slot: 19
    permission: "craftplayplotextras.audit.view"
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    lore:
      - "&7Zeigt Entities"
      - "&7und gesetzte Limits."
    actions:
      - "OPEN:entity-limits"
  redstone-alerts:
    slot: 20
    permission: "craftplayplotextras.redstone.notify"
    material: TARGET
    name: "&cRedstone-Alarme"
    lore:
      - "&7Offene Lagalarme"
      - "&7mit Teleport und Freigabe."
    actions:
      - "OPEN:redstone-alerts"
  redstone-enable:
    slot: 21
    permission: "craftplayplotextras.redstone.admin"
    material: REDSTONE_BLOCK
    name: "&cRedstone aktivieren"
    lore:
      - "&7Aktiviert Redstone auf"
      - "&7dem aktuellen Plot wieder."
    actions:
      - "REDSTONE_ENABLE"
  freeze:
    slot: 22
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bPlot einfrieren"
    lore:
      - "&7Blockiert Bauen, Interaktion,"
      - "&7Spawns und Redstone."
    actions:
      - "TEAM_FREEZE:GUI-Freeze"
  unfreeze:
    slot: 23
    permission: "craftplayplotextras.moderation.manage"
    material: HONEYCOMB
    name: "&aPlot freigeben"
    lore:
      - "&7Hebt den Freeze"
      - "&7für den Plot auf."
    actions:
      - "TEAM_UNFREEZE"
  cleanup-drops:
    slot: 24
    permission: "craftplayplotextras.moderation.manage"
    material: HOPPER
    name: "&eDrops entfernen"
    lore:
      - "&7Entfernt Items und XP"
      - "&7vom aktuellen Plot."
    actions:
      - "TEAM_CLEANUP:drops"
  validate:
    slot: 25
    permission: "craftplayplotextras.config.validate"
    material: COMPASS
    name: "&bConfig prüfen"
    lore:
      - "&7Prüft Materialien, Slots"
      - "&7und fehlende Dateien."
    actions:
      - "OPEN:config-issues"
  moderation-menu:
    slot: 27
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bModeration-Menü"
    lore:
      - "&7Freeze, Cleanup und"
      - "&7Redstone-Freigabe."
    actions:
      - "OPEN:team-moderation"
  permission-check:
    slot: 28
    permission: "craftplayplotextras.permissioncheck"
    material: PLAYER_HEAD
    name: "&dRechtecheck"
    lore:
      - "&7Prüft Plot- und"
      - "&7Pluginrechte."
    actions:
      - "OPEN:permission-check"
  status-normal:
    slot: 29
    permission: "craftplayplotextras.plotmeta.status"
    material: WHITE_DYE
    name: "&fStatus: Normal"
    actions:
      - "SET_PLOT_STATUS:normal"
  status-checked:
    slot: 30
    permission: "craftplayplotextras.plotmeta.status"
    material: LIME_DYE
    name: "&aStatus: Team-geprüft"
    actions:
      - "SET_PLOT_STATUS:team-checked"
  status-watch:
    slot: 31
    permission: "craftplayplotextras.plotmeta.status"
    material: ORANGE_DYE
    name: "&6Status: Beobachtung"
    actions:
      - "SET_PLOT_STATUS:under-watch"
  status-locked:
    slot: 32
    permission: "craftplayplotextras.plotmeta.status"
    material: RED_DYE
    name: "&cStatus: Gesperrt"
    actions:
      - "SET_PLOT_STATUS:locked"
  team-note:
    slot: 33
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bTeamnotiz ändern"
    lore:
      - "&7Aktuell: &f{plot_team_note}"
    actions:
      - "TEAM_NOTE_PROMPT"
  contests:
    slot: 34
    permission: "craftplayplotextras.competition.judge"
    material: GOLD_BLOCK
    name: "&6Wettbewerbe"
    lore:
      - "&7Zeigt angemeldete Plots"
      - "&7für Wettbewerbe."
    actions:
      - "OPEN:competitions"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
