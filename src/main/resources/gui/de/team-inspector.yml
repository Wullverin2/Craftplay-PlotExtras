# Team-GUI für Support, Moderation und Administration.
title: "&8Team-Inspektor"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 13
    material: SPYGLASS
    name: "&bPlotübersicht"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Besitzer: &f{plot_owner}"
      - "&7Rolle hier: &f{plot_role}"
      - "&7Mitglieder: &f{plot_members}"
      - "&7Vertraute: &f{plot_trusted}"
      - "&7Gesperrte: &f{plot_denied}"
      - "&7Plotlimit: &f{plot_count}&7/&f{plot_max}"
      - "&7Status: &f{plot_status_display}"
      - "&7Besuche: &f{plot_visits}"
      - "&7Favoriten: &f{plot_likes}"
      - "&7Teamnotiz: &f{plot_team_note}"
  audit:
    slot: 20
    material: WRITABLE_BOOK
    name: "&aAuditlog"
    lore:
      - "&7Letzte Aktionen auf Plots"
      - "&7und durch Teammitglieder."
    actions:
      - "OPEN:audit-log"
  backups:
    slot: 21
    material: CHEST
    name: "&aBackups"
    lore:
      - "&7Backups ansehen und"
      - "&7Wiederherstellungen vorbereiten."
    actions:
      - "OPEN:backups"
  members:
    slot: 22
    material: PLAYER_HEAD
    name: "&aMitglieder und Rollen"
    lore:
      - "&7Öffnet die Mitgliederverwaltung."
    actions:
      - "OPEN:members"
  flags:
    slot: 23
    material: REDSTONE_TORCH
    name: "&aFlags prüfen"
    lore:
      - "&7Aktuelle Plotflags ansehen"
      - "&7und bei Rechten ändern."
    actions:
      - "OPEN:flags"
  limits:
    slot: 24
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    lore:
      - "&7Zeigt vorhandene Entities"
      - "&7und gesetzte Limits."
    actions:
      - "OPEN:entity-limits"
  reports:
    slot: 25
    permission: "craftplayplotextras.report.view"
    material: BELL
    name: "&cPlot-Meldungen"
    lore:
      - "&7Listet offene Meldungen"
      - "&7im Chat auf."
    actions:
      - "PLAYER_COMMAND:pe reports list"
  performance:
    slot: 28
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&ePerformance"
    lore:
      - "&7Zählt Entities und zeigt"
      - "&7Auffälligkeiten auf dem Plot."
    actions:
      - "PLAYER_COMMAND:pe performance"
  freeze:
    slot: 29
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bPlot einfrieren"
    lore:
      - "&7Blockiert Bauen, Interaktion,"
      - "&7Spawns und Redstone."
    actions:
      - "PLAYER_COMMAND:pe mod freeze GUI-Freeze"
  unfreeze:
    slot: 30
    permission: "craftplayplotextras.moderation.manage"
    material: HONEYCOMB
    name: "&aPlot freigeben"
    lore:
      - "&7Hebt den Plot-Freeze"
      - "&7für den aktuellen Plot auf."
    actions:
      - "PLAYER_COMMAND:pe mod unfreeze"
  redstone-enable:
    slot: 31
    material: REDSTONE_BLOCK
    name: "&cRedstone aktivieren"
    lore:
      - "&7Aktiviert Redstone auf"
      - "&7dem aktuellen Plot wieder."
      - "&8Benötigt Redstone-Adminrecht."
    actions:
      - "PLAYER_COMMAND:pe redstone enable"
  redstone-alerts:
    slot: 32
    material: TARGET
    name: "&cRedstone-Alarme"
    lore:
      - "&7Offene Redstone-Lagalarme"
      - "&7mit Teleport und Freigabe."
    actions:
      - "OPEN:redstone-alerts"
  cleanup-drops:
    slot: 34
    permission: "craftplayplotextras.moderation.manage"
    material: HOPPER
    name: "&eDrops entfernen"
    lore:
      - "&7Entfernt Items und XP"
      - "&7vom aktuellen Plot."
    actions:
      - "PLAYER_COMMAND:pe mod cleanup drops"
  plot-info:
    slot: 33
    material: PAPER
    name: "&aPlotSquared Info"
    lore:
      - "&7Führt /plot info aus."
    commands:
      - "player:plot info"
  status-checked:
    slot: 37
    permission: "craftplayplotextras.plotmeta.status"
    material: LIME_DYE
    name: "&aStatus: Team-geprüft"
    actions:
      - "SET_PLOT_STATUS:team-checked"
  status-watch:
    slot: 38
    permission: "craftplayplotextras.plotmeta.status"
    material: ORANGE_DYE
    name: "&6Status: Beobachtung"
    actions:
      - "SET_PLOT_STATUS:under-watch"
  status-locked:
    slot: 39
    permission: "craftplayplotextras.plotmeta.status"
    material: RED_DYE
    name: "&cStatus: Gesperrt"
    actions:
      - "SET_PLOT_STATUS:locked"
  team-note:
    slot: 40
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bTeamnotiz ändern"
    lore:
      - "&7Aktuell: &f{plot_team_note}"
    actions:
      - "TEAM_NOTE_PROMPT"
  status-normal:
    slot: 41
    permission: "craftplayplotextras.plotmeta.status"
    material: WHITE_DYE
    name: "&fStatus: Normal"
    actions:
      - "SET_PLOT_STATUS:normal"
  validate:
    slot: 42
    permission: "craftplayplotextras.config.validate"
    material: COMPASS
    name: "&bConfig prüfen"
    lore:
      - "&7Prüft Materialien, Slots"
      - "&7und fehlende Dateien."
    actions:
      - "PLAYER_COMMAND:pe validate"
  contests:
    slot: 43
    permission: "craftplayplotextras.competition.judge"
    material: GOLD_BLOCK
    name: "&6Wettbewerbe"
    lore:
      - "&7Zeigt angemeldete Plots"
      - "&7für Wettbewerbe."
    actions:
      - "PLAYER_COMMAND:pe contest list"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
