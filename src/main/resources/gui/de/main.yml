# Deutsches Hauptmenü.
# Diese Datei steuert das Hauptmenü für deutsche Spieler.
# Hier stellst du Titel, Größe, Füllitems, Deko-Items, Sounds, Animationen und alle Java-Buttons ein.
# Jeder Button kann eigene Befehle ausführen. Prefixe: console:, player:, op:, open-menu:.
# Für Buttons und Deko-Items kannst du slot: 13, slot: [13, 14, 15] oder slots: [13, 14, 15] nutzen.
# Optional kann statt des Materials ein HeadDatabase-Kopf mit head-database-id genutzt werden.
# Spieler-Köpfe sind per material: PLAYERHEAD %player_name% oder skull-owner: "%player_name%" möglich.
# PlaceholderAPI-Platzhalter funktionieren in Titel, Namen, Lore und Commands.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Menüoptionen automatisch zu ergänzen.
file-version: 17

# Titel des Inventars.
title: "&8Plot-Menü"
# Größe des Inventars. Erlaubt sind 9, 18, 27, 36, 45 oder 54 Slots.
size: 27
# Füllitem für leere Slots.
filler:
  # Wenn true, werden leere Slots mit dem unten angegebenen Material gefüllt.
  enabled: true
  # Materialname aus Minecraft/Spigot.
  material: BLACK_STAINED_GLASS_PANE
  # Anzeigename des Füllitems. &r macht den Namen leer/unauffällig.
  name: "&r"
# Sound beim Öffnen des Hauptmenüs.
open-sound:
  # Wenn true, hört der Spieler beim Öffnen diesen Sound.
  enabled: true
  # Bukkit-Soundname.
  sound: BLOCK_NOTE_BLOCK_PLING
  # Lautstärke des Sounds.
  volume: 0.6
  # Tonhöhe des Sounds.
  pitch: 1.25
# Standardsound für Button-Klicks in diesem Menü.
click-sound:
  # Wenn true, hören Spieler beim Klicken einen Button-Sound.
  enabled: true
  # Bukkit-Soundname.
  sound: UI_BUTTON_CLICK
  # Lautstärke des Sounds.
  volume: 0.8
  # Tonhöhe des Sounds.
  pitch: 1.0
# Einfache Öffnungsanimation für das Java-Inventar.
animation:
  # Wenn true, werden Buttons nacheinander eingeblendet.
  enabled: true
  # Verzögerung zwischen zwei eingeblendeten Buttons in Ticks.
  delay-ticks: 1
  keep-filler-visible: true
# Alle Buttons des Menüs.
buttons:
  my-plots:
    enabled: true
    # Slot im Inventar. 0 ist oben links.
    slot: 1
    # Item, das für diesen Button angezeigt wird.
    material: GRASS_BLOCK
    # Anzeigename des Buttons.
    name: "&aEigene Plots"
    # Beschreibung unter dem Buttonnamen.
    lore:
      - "&7Zeigt dir deine eigenen Plots."
      - "&7Mit Sortierung, Favoriten,"
      - "&7Tags, Kategorien und Details."
    # Befehle werden als Spieler ausgeführt. Mit console: davor als Konsole.
    commands:
      - "open-menu:myplots"
    # Wenn true, wird das Menü nach dem Klick geschlossen.
    close: false
    # Optional: Permission, die ein Spieler braucht, damit der Button sichtbar ist.
    permission: ""
  search:
    enabled: true
    slot: 2
    material: COMPASS
    name: "&aPlot suchen"
    lore:
      - "&7Öffnet Suche nach Besitzer,"
      - "&7Name, Tags und Kategorien."
    commands:
      - "open-menu:search"
    close: false
    permission: ""
  create:
    enabled: true
    slot: 3
    material: EMERALD_BLOCK
    name: "&aPlot erstellen"
    lore:
      - "&7Öffnet Plottypen, Biome,"
      - "&7Vorlagen und Plotdaten."
    commands:
      - "open-menu:create:types"
    close: false
    permission: "plots.auto"
  favorites:
    enabled: true
    slot: 4
    material: NETHER_STAR
    name: "&aFavoriten"
    lore:
      - "&7Öffnet deine favorisierten"
      - "&7Plots im Meine-Plots-Menü."
    commands:
      - "open-menu:myplots:1:name:favorites"
    close: false
    permission: ""
  community:
    enabled: true
    slot: 5
    material: SUNFLOWER
    name: "&aCommunity"
    lore:
      - "&7Öffnet öffentliche und"
      - "&7beliebte Community-Plots."
    commands:
      - "open-menu:community"
    close: false
    permission: ""
  members:
    enabled: true
    slot: 12
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Verwalte Added, Trusted,"
      - "&7Denied und eigene Rollen."
    commands:
      - "open-menu:members:overview"
    close: false
    permission: ""
  roles:
    enabled: true
    slot: 7
    material: WRITABLE_BOOK
    name: "&aRechte & Rollen"
    lore:
      - "&7Öffnet die aktuelle"
      - "&7Mitglieder- und Rechteverwaltung."
    commands:
      - "open-menu:members:roles"
    close: false
    permission: ""
  flags:
    enabled: true
    slot: 14
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Öffnet das Flag-Menü"
      - "&7mit Status und Umschaltern."
    commands:
      - "open-menu:flags"
    close: false
    permission: ""
  settings:
    enabled: true
    slot: 15
    material: REPEATER
    name: "&aEinstellungen"
    lore:
      - "&7Öffnet Homes, Wetter,"
      - "&7Biome und Zeit."
    commands:
      - "open-menu:settings:homes"
    close: false
    permission: ""
  reports:
    enabled: true
    slot: 10
    material: BELL
    name: "&eReports"
    lore:
      - "&7Melde ein Plot direkt"
      - "&7über PlotSquared."
    commands:
      - "open-menu:reports"
    close: false
    permission: ""
  history:
    enabled: true
    slot: 11
    material: CLOCK
    name: "&aVerlauf"
    lore:
      - "&7Öffnet zuletzt besuchte"
      - "&7oder gespeicherte Plotlisten."
    commands:
      - "open-menu:history"
    close: false
    permission: ""
  help:
    enabled: true
    slot: 16
    material: BOOK
    name: "&bHilfe"
    lore:
      - "&7Öffnet Hilfe, Befehle"
      - "&7und Schnellzugriffe."
    commands:
      - "open-menu:help"
    close: false
    permission: ""
  team:
    enabled: true
    slot: 13
    material: COMMAND_BLOCK
    name: "&cTeam"
    lore:
      - "&7Öffnet Teamfunktionen"
      - "&7für Plotbackups."
    commands:
      - "open-menu:team"
    close: false
    permission: "craftplayplotextras.team"
  danger:
    enabled: true
    slot: 6
    material: TNT
    name: "&cLöschen & Reset"
    lore:
      - "&7Sichere Aktionen für"
      - "&7Löschen, Reset und Backup."
    commands:
      - "open-menu:danger"
    close: false
    permission: ""
  future:
    enabled: true
    slot: 21
    material: BEACON
    name: "&dZukunft"
    lore:
      - "&7Optionale Featureprofile"
      - "&7für Team und Premiumsysteme."
    commands:
      - "open-menu:future"
    close: false
    permission: "craftplayplotextras.future"
  extras:
    enabled: true
    slot: 20
    material: CHEST
    name: "&aExtras"
    lore:
      - "&7Öffnet zusätzliche"
      - "&7Services für dein Plot."
    commands:
      - "open-menu:extras"
    close: false
    permission: ""
  deco:
    enabled: true
    slot: 23
    material: BRICKS
    head-database-id: ""
    name: "&aDeko"
    lore:
      - "&7Ändere Wand und Rand"
      - "&7deines aktuellen Plots."
      - "&7Wirkt nur auf deinem Plot"
      - "&7oder mit passender Plotrolle."
    commands:
      - "open-menu:deco:wall-basic"
    close: false
    permission: "craftplayplotextras.deco"
  plot-purchase:
    enabled: true
    slot: 24
    material: GOLD_INGOT
    head-database-id: ""
    name: "&6Plotlimit kaufen"
    lore:
      - "&7Kaufe zusätzliche Plots"
      - "&7über dein Plotlimit."
      - "&7Rang-Gratisplots bleiben"
      - "&7dabei erhalten."
    commands:
      - "open-menu:plot-purchase"
    close: false
    permission: "craftplayplotextras.plotbuy"
  close:
    enabled: true
    slot: 22
    material: BARRIER
    head-database-id: ""
    name: "&cSchließen"
    lore:
      - "&7Schließt dieses Menü."
    commands: []
    close: true
    permission: ""
# Deko-Items sind reine Anzeigeelemente ohne Aktion.
# Sie können ebenfalls Material, HeadDatabase-ID, Name, Lore, Slot und Permission nutzen.
decorations:
  top-border:
    enabled: true
    # Slots im Inventar.
    slot: [0, 8]
    # Material-Fallback.
    material: GRAY_STAINED_GLASS_PANE
    # Optional: HeadDatabase-ID. Beispiel: "12345"
    head-database-id: ""
    # Anzeigename des Deko-Items.
    name: "&r"
    # Lore des Deko-Items.
    lore: []
    # Optional: Permission, damit diese Deko sichtbar ist.
    permission: ""
  side-border:
    enabled: true
    slot: [9, 17]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
  bottom-border:
    enabled: true
    slot: [18, 19, 20, 21, 23, 24, 25, 26]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
