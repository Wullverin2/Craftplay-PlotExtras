# Haupt-GUI für Deutsch.
# title, size, fill, items, Slots, Material, Name, Lore, HeadDatabase und actions können frei angepasst werden.
title: "&8Plot-Menü"
size: 54

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  flags:
    slot: 20
    material: REDSTONE_TORCH
    name: "&aPlotflags"
    lore:
      - "&7Schalte PlotSquared-Flags ein oder aus."
      - "&8Aktuelles Plot: &f{plot_id}"
    actions:
      - "OPEN:flags"
  decor:
    slot: 22
    material: GRASS_BLOCK
    name: "&aDeko"
    lore:
      - "&7Ändere Wand- und Randblöcke."
      - "&8Nur für deinen aktuellen Plot."
    actions:
      - "OPEN:decor"
  members:
    slot: 24
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Übersicht über Besitzer,"
      - "&7Mitglieder, Trusts und Sperren."
    actions:
      - "OPEN:members"
  settings:
    slot: 30
    material: COMPARATOR
    name: "&aPloteinstellungen"
    lore:
      - "&7Infos und Schnellaktionen."
      - "&8Owner: &f{plot_owner}"
    actions:
      - "OPEN:settings"
  entity-limits:
    slot: 31
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    lore:
      - "&7Zeigt, wie viele Entities"
      - "&7du auf dem Plot setzen kannst."
    actions:
      - "OPEN:entity-limits"
  language:
    slot: 32
    material: WRITABLE_BOOK
    name: "&aSprache"
    lore:
      - "&7Aktuell: &f{language}"
      - "&7Verfügbare Dateien werden automatisch geladen."
    actions:
      - "OPEN_LANGUAGE"
  info:
    slot: 13
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot-Info"
    lore:
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&7Geld: &f{cmi_money}"
      - "&7Jobs: &f{jobs}"
      - "&7Quests: &f{quests_completed}&7/&f{quests_total}"
    actions:
      - "OPEN:settings"
  team-inspector:
    slot: 46
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bTeam-Inspektor"
    lore:
      - "&7Plot prüfen, Logs ansehen"
      - "&7und Supportdaten öffnen."
    actions:
      - "OPEN:team-inspector"
  audit-log:
    slot: 47
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAuditlog"
    lore:
      - "&7Zeigt die letzten Plotaktionen."
    actions:
      - "OPEN:audit-log"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    lore:
      - "&7Fenster schließen."
    actions:
      - "CLOSE"
