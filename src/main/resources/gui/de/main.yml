# Deutsches Hauptmenü.
# Diese Datei steuert das Hauptmenü für deutsche Spieler.
# Hier stellst du Titel, Größe, Füllitems, Deko-Items, Sounds, Animationen,
# Bedrock-Formen und alle Buttons ein.
# Jeder Button kann eigene Befehle ausführen. Prefixe: console:, player:, op:, open-menu:.
# Für Buttons und Deko-Items kannst du slot: 13, slot: [13, 14, 15] oder slots: [13, 14, 15] nutzen.
# Optional kann statt des Materials ein HeadDatabase-Kopf mit head-database-id genutzt werden.
# Spieler-Köpfe sind per material: PLAYERHEAD %player_name% oder skull-owner: "%player_name%" möglich.
# PlaceholderAPI-Platzhalter funktionieren in Titel, Namen, Lore, Bedrock-Labels und Commands.

# Dateiversion dieser GUI-Datei.
# Das Plugin nutzt diesen Wert, um neue Menüoptionen automatisch zu ergänzen.
file-version: 9

# Titel des Inventars.
title: "&8Plot-Menü"
# Größe des Inventars. Erlaubt sind 9, 18, 27, 36, 45 oder 54 Slots.
size: 27
# Füllitem für leere Slots.
filler:
  # Wenn true, werden leere Slots mit dem unten angegebenen Material gefüllt.
  enabled: true
  # Materialname aus Minecraft/Spigot.
  material: BLACK_STAINED_GLASS_PANE
  # Anzeigename des Füllitems. &r macht den Namen leer/unauffällig.
  name: "&r"
# Sound beim Öffnen des Hauptmenüs.
open-sound:
  # Wenn true, hört der Spieler beim Öffnen diesen Sound.
  enabled: true
  # Bukkit-Soundname.
  sound: BLOCK_NOTE_BLOCK_PLING
  # Lautstärke des Sounds.
  volume: 0.6
  # Tonhöhe des Sounds.
  pitch: 1.25
# Standardsound für Button-Klicks in diesem Menü.
click-sound:
  # Wenn true, hören Spieler beim Klicken einen Button-Sound.
  enabled: true
  # Bukkit-Soundname.
  sound: UI_BUTTON_CLICK
  # Lautstärke des Sounds.
  volume: 0.8
  # Tonhöhe des Sounds.
  pitch: 1.0
# Einfache Öffnungsanimation für das Java-Inventar.
animation:
  # Wenn true, werden Buttons nacheinander eingeblendet.
  enabled: true
  # Verzögerung zwischen zwei eingeblendeten Buttons in Ticks.
  delay-ticks: 1
# Bedrock-Form für Floodgate-Spieler.
bedrock-form:
  # Wenn true, öffnet dieses Hauptmenü für Bedrock-Spieler als Floodgate-Form.
  enabled: true
  # Titel der Bedrock-Form.
  title: "Plot-Menü"
  # Beschreibung über den Buttons der Bedrock-Form.
  content: "Wähle aus, was du mit deinen Plots machen möchtest."
# Alle Buttons des Menüs.
buttons:
  my-plots:
    # Slot im Inventar. 0 ist oben links.
    slot: 1
    # Item, das für diesen Button angezeigt wird.
    material: GRASS_BLOCK
    # Anzeigename des Buttons.
    name: "&aEigene Plots"
    # Beschriftung in der Bedrock-Form. Leer bedeutet: Es wird der normale Name genutzt.
    bedrock-label: "Eigene Plots"
    # Beschreibung unter dem Buttonnamen.
    lore:
      - "&7Zeigt dir deine eigenen Plots."
      - "&8Befehl: /plot list mine"
    # Befehle werden als Spieler ausgeführt. Mit console: davor als Konsole.
    commands:
      - "plot list mine"
    # Wenn true, wird das Menü nach dem Klick geschlossen.
    close: true
    # Optional: Permission, die ein Spieler braucht, damit der Button sichtbar ist.
    permission: ""
  search:
    slot: 2
    material: COMPASS
    name: "&aPlot suchen"
    bedrock-label: "Plot suchen"
    lore:
      - "&7Öffnet die PlotSquared-Suche"
      - "&7oder Besucherauswahl."
    commands:
      - "plot visit"
    close: true
    permission: ""
  create:
    slot: 3
    material: EMERALD_BLOCK
    name: "&aPlot erstellen"
    bedrock-label: "Plot erstellen"
    lore:
      - "&7Erstellt automatisch ein freies Plot."
      - "&8Befehl: /plot auto"
    commands:
      - "plot auto"
    close: true
    permission: "plots.auto"
  favorites:
    slot: 4
    material: NETHER_STAR
    name: "&aFavoriten"
    bedrock-label: "Favoriten"
    lore:
      - "&7Öffnet deine favorisierten Plots."
      - "&7Der Befehl kann angepasst werden."
    commands:
      - "plot list favorites"
    close: true
    permission: ""
  community:
    slot: 5
    material: SUNFLOWER
    name: "&aCommunity"
    bedrock-label: "Community"
    lore:
      - "&7Öffnet öffentliche und"
      - "&7beliebte Community-Plots."
    commands:
      - "plot list all"
    close: true
    permission: ""
  members:
    slot: 12
    material: PLAYER_HEAD
    name: "&aMitglieder"
    bedrock-label: "Mitglieder"
    lore:
      - "&7Öffnet die PlotSquared"
      - "&7Mitgliederübersicht."
    commands:
      - "plot members"
    close: true
    permission: ""
  roles:
    slot: 7
    material: WRITABLE_BOOK
    name: "&aRechte & Rollen"
    bedrock-label: "Rechte & Rollen"
    lore:
      - "&7Öffnet die aktuelle"
      - "&7Mitglieder- und Rechteverwaltung."
    commands:
      - "plot members"
    close: true
    permission: ""
  flags:
    slot: 14
    material: REDSTONE_TORCH
    name: "&aFlags"
    bedrock-label: "Flags"
    lore:
      - "&7Öffnet das Flag-Menü"
      - "&7mit Status und Umschaltern."
    commands:
      - "open-menu:flags"
    close: false
    permission: ""
  settings:
    slot: 15
    material: REPEATER
    name: "&aEinstellungen"
    bedrock-label: "Einstellungen"
    lore:
      - "&7Öffnet Homes, Wetter,"
      - "&7Biome und Zeit."
    commands:
      - "open-menu:settings:homes"
    close: false
    permission: ""
  reports:
    slot: 10
    material: BELL
    name: "&eReports"
    bedrock-label: "Reports"
    lore:
      - "&7Melde ein Plot direkt"
      - "&7über PlotSquared."
    commands:
      - "plot report"
    close: true
    permission: ""
  history:
    slot: 11
    material: CLOCK
    name: "&aVerlauf"
    bedrock-label: "Verlauf"
    lore:
      - "&7Öffnet zuletzt besuchte"
      - "&7oder gespeicherte Plotlisten."
    commands:
      - "plot list visited"
    close: true
    permission: ""
  help:
    slot: 16
    material: BOOK
    name: "&bHilfe"
    bedrock-label: "Hilfe"
    lore:
      - "&7Öffnet die PlotSquared-Hilfe."
      - "&8Befehl: /plot help"
    commands:
      - "plot help"
    close: true
    permission: ""
  team:
    slot: 13
    material: COMMAND_BLOCK
    name: "&cTeam"
    bedrock-label: "Team"
    lore:
      - "&7Öffnet Teamfunktionen"
      - "&7für Plotbackups."
    commands:
      - "open-menu:team"
    close: false
    permission: "craftplayplotextras.team"
  close:
    slot: 22
    material: BARRIER
    head-database-id: ""
    name: "&cSchließen"
    bedrock-label: "Schließen"
    lore:
      - "&7Schließt dieses Menü."
    commands: []
    close: true
    permission: ""
# Deko-Items sind reine Anzeigeelemente ohne Aktion.
# Sie können ebenfalls Material, HeadDatabase-ID, Name, Lore, Slot und Permission nutzen.
decorations:
  top-border:
    # Slots im Inventar.
    slot: [0, 8]
    # Material-Fallback.
    material: GRAY_STAINED_GLASS_PANE
    # Optional: HeadDatabase-ID. Beispiel: "12345"
    head-database-id: ""
    # Anzeigename des Deko-Items.
    name: "&r"
    # Lore des Deko-Items.
    lore: []
    # Optional: Permission, damit diese Deko sichtbar ist.
    permission: ""
  side-border:
    slot: [9, 17]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
  bottom-border:
    slot: [18, 19, 20, 21, 23, 24, 25, 26]
    material: GRAY_STAINED_GLASS_PANE
    head-database-id: ""
    name: "&r"
    lore: []
    permission: ""
