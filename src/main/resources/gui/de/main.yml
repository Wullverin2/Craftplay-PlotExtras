# Haupt-GUI für Deutsch.
# title, size, fill, items, Slots, Material, Name, Lore, HeadDatabase und actions können frei angepasst werden.
title: "&8Plot-Menü"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: PLAYER_HEAD
    head-database: "9382"
    name: "&ePlot-Übersicht"
    lore:
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&7Geld: &f{cmi_money}"
      - "&7Jobs: &f{jobs}"
      - "&7Quests: &f{quests_completed}&7/&f{quests_total}"
      - "&8Aktuelles Plot: &f{plot_id}"
    actions:
      - "OPEN:plot-dashboard"
  dashboard:
    slot: 19
    material: MAP
    name: "&aDashboard"
    lore:
      - "&7Status, Notizen, Warps"
      - "&7und Schnellaktionen."
    actions:
      - "OPEN:plot-dashboard"
  settings:
    slot: 20
    material: COMPARATOR
    name: "&aPloteinstellungen"
    lore:
      - "&7Home, Wetter, Zeit"
      - "&7und Plotbiom."
    actions:
      - "OPEN:settings"
  flags:
    slot: 21
    material: REDSTONE_TORCH
    name: "&aPlotflags"
    lore:
      - "&7Schalte PlotSquared-Flags"
      - "&7ein oder aus."
    actions:
      - "OPEN:flags"
  decor:
    slot: 22
    material: GRASS_BLOCK
    name: "&aDeko"
    lore:
      - "&7Ändere Wand und Rand"
      - "&7für dein aktuelles Plot."
    actions:
      - "OPEN:decor"
  members:
    slot: 23
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Mitglieder, Trusts,"
      - "&7Sperren und Rollen."
    actions:
      - "OPEN:members"
  entity-limits:
    slot: 24
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    lore:
      - "&7Zeigt aktuelle Entities"
      - "&7und maximale Werte."
    actions:
      - "OPEN:entity-limits"
  language:
    slot: 25
    material: WRITABLE_BOOK
    name: "&aSprache"
    lore:
      - "&7Aktuell: &f{language}"
      - "&7Sprachen werden automatisch geladen."
    actions:
      - "OPEN_LANGUAGE"
  report:
    slot: 30
    material: BELL
    name: "&cPlot melden"
    lore:
      - "&7Sendet eine Meldung zum"
      - "&7aktuellen Plot an das Team."
    actions:
      - "CREATE_REPORT:GUI-Meldung"
  contest:
    slot: 32
    material: GOLDEN_APPLE
    name: "&6Wettbewerb"
    lore:
      - "&7Meldet dieses Plot für"
      - "&7den Standard-Wettbewerb an."
    actions:
      - "OPEN:competitions"
  tools:
    slot: 31
    material: COMPASS
    name: "&aWerkzeuge"
    lore:
      - "&7Plotprofil, Suche,"
      - "&7Gästebuch und Cleanup."
    actions:
      - "OPEN:plot-tools"
  team-inspector:
    slot: 46
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bTeam-Inspektor"
    lore:
      - "&7Supportdaten, Logs"
      - "&7und Teamwerkzeuge."
    actions:
      - "OPEN:team-inspector"
  audit-log:
    slot: 47
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAuditlog"
    lore:
      - "&7Zeigt die letzten"
      - "&7Plotaktionen."
    actions:
      - "OPEN:audit-log"
  team-tools:
    slot: 48
    permission: "craftplayplotextras.teamtools"
    material: COMPASS
    name: "&bTeam-Werkzeuge"
    lore:
      - "&7Anfragen, Reports,"
      - "&7Builder und Statistiken."
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    lore:
      - "&7Fenster schließen."
    actions:
      - "CLOSE"
