# Wettbewerbs-Menü mit klickbarer Plotliste.
title: "&8Wettbewerbe"
size: 54

fill:
  enabled: true
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: GOLDEN_APPLE
    name: "&6Wettbewerbe"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Einträge unten anklicken zum Teleport."
  join-default:
    slot: 10
    material: EMERALD
    name: "&aAktuelles Plot anmelden"
    lore:
      - "&7Meldet dieses Plot für"
      - "&7den Standard-Wettbewerb an."
    actions:
      - "PLAYER_COMMAND:pe contest join default GUI-Anmeldung"
  list-chat:
    slot: 12
    material: PAPER
    name: "&aListe im Chat"
    actions:
      - "PLAYER_COMMAND:pe contest list"
  judge-help:
    slot: 14
    permission: "craftplayplotextras.competition.judge"
    material: GOLD_BLOCK
    name: "&6Team-Bewertung"
    lore:
      - "&7Bewerten per Chat:"
      - "&f/pe contest score <id> <0-100> <Notiz>"
  team-tools:
    slot: 16
    permission: "craftplayplotextras.teamtools"
    material: COMPASS
    name: "&bTeam-Werkzeuge"
    actions:
      - "OPEN:team-tools"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: competitions
  slots: "19-25,28-34,37-43"
  entry-item:
    material: GOLDEN_APPLE
    name: "&6{competition_owner}"
    lore:
      - "&7Wettbewerb: &f{competition_name}"
      - "&7Plot: &f{competition_plot_key}"
      - "&7Punkte: &f{competition_score}"
      - "&8{competition_note}"
      - "&eKlicken zum Teleportieren."
    actions:
      - "TELEPORT_PLOT_KEY:{competition_plot_key}"
  scored-item:
    material: GOLD_BLOCK
    name: "&6{competition_owner} &8- &e{competition_score}"
    lore:
      - "&7Wettbewerb: &f{competition_name}"
      - "&7Plot: &f{competition_plot_key}"
      - "&7Bewertet von: &f{competition_scored_by}"
      - "&8{competition_score_note}"
      - "&eKlicken zum Teleportieren."
    actions:
      - "TELEPORT_PLOT_KEY:{competition_plot_key}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
