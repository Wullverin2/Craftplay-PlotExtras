# Backup-Liste fuer berechtigte Teammitglieder.
title: "&8Plot-Backups"
size: 54

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: CHEST
    name: "&aPlot-Backups"
    lore:
      - "&7Klicke ein Backup an,"
      - "&7um die Wiederherstellung vorzubereiten."
      - "&7Restore-Ziel ist immer dein aktueller Plot."
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-backups
  slots: "10-16,19-25,28-34,37-43"
  backup-item:
    material: FILLED_MAP
    name: "&e{backup_owner} &8- &f{backup_merge}"
    lore:
      - "&7ID: &f{backup_id}"
      - "&7Datum: &f{backup_created}"
      - "&7Grund: &f{backup_reason}"
      - "&7Quelle: &f{backup_world} {backup_plot}"
      - "&7Plots: &f{backup_plot_count}"
      - "&eKlicke zum Auswählen."
  previous-item:
    slot: 48
    material: ARROW
    name: "&eVorherige Seite"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNächste Seite"
