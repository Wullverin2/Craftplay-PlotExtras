# Open redstone alerts. Clicking an alert teleports to the detected block.
title: "&8Redstone Alerts"
permission: "craftplayplotextras.redstone.notify"
size: 54

fill:
  enabled: true
  material: RED_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: REDSTONE_BLOCK
    name: "&cRedstone Alerts"
    lore:
      - "&7Click an alert to teleport"
      - "&7to the detected block."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-inspector"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: redstone-alerts
  slots: "10-16,19-25,28-34"
  alert-item:
    material: REDSTONE_TORCH
    name: "&c{redstone_alert_world} {redstone_alert_plot}"
    lore:
      - "&7Owner: &f{redstone_alert_owner}"
      - "&7Merge: &f{redstone_alert_merge}"
      - "&7Block: &f{redstone_alert_x}, {redstone_alert_y}, {redstone_alert_z}"
      - "&7Events: &f{redstone_alert_events}"
      - "&7Source: &f{redstone_alert_source}"
      - "&7Time: &f{redstone_alert_created}"
      - "&8Left click: teleport"
      - "&8Then: /pe redstone enable {redstone_alert_id}"
    actions:
      - "PLAYER_COMMAND:pe redstone tp {redstone_alert_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePrevious Page"
    lore:
      - "&7Page &f{page}&7/&f{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNext Page"
    lore:
      - "&7Page &f{page}&7/&f{pages}"
