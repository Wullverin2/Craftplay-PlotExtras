# Confirmation GUI for backup restores.
title: "&8Restore Backup"
permission: "craftplayplotextras.backup.restore"
size: 27

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 11
    material: FILLED_MAP
    name: "&e{selected_backup_owner} &8- &f{selected_backup_merge}"
    lore:
      - "&7Backup: &f{selected_backup_id}"
      - "&7Date: &f{selected_backup_created}"
      - "&7Reason: &f{selected_backup_reason}"
      - "&7Important: &f{selected_backup_important}"
      - "&7Comment: &f{selected_backup_comment}"
      - "&7Source: &f{selected_backup_world} {selected_backup_plot}"
      - "&cTarget is the plot you are standing on."
  cancel:
    slot: 13
    material: BARRIER
    name: "&eCancel"
    actions:
      - "OPEN:backups"
  comment:
    slot: 3
    material: WRITABLE_BOOK
    name: "&aSet Comment"
    actions:
      - "BACKUP_COMMENT_PROMPT"
  important:
    slot: 5
    material: NETHER_STAR
    name: "&eToggle Important"
    actions:
      - "TOGGLE_SELECTED_BACKUP_IMPORTANT"
  confirm:
    slot: 15
    material: LIME_CONCRETE
    name: "&aRestore"
    lore:
      - "&7Pastes the backup into"
      - "&7the current plot or merged plot."
    actions:
      - "RESTORE_SELECTED_BACKUP"
