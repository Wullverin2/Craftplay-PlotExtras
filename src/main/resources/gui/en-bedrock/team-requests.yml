# Team view for open plot requests.
title: "&8Plot Requests"
permission: "craftplayplotextras.requests.manage"
size: 54

fill:
  enabled: true
  material: CYAN_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: PAPER
    name: "&bOpen requests"
    lore:
      - "&7Click a request"
      - "&7to mark it done."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-requests
  scope: open
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  request-item:
    material: PAPER
    name: "&e{request_id}"
    lore:
      - "&7Player: &f{request_player}"
      - "&7Type: &f{request_type}"
      - "&7Plot: &f{request_plot_key}"
      - "&8{request_note}"
      - "&cClick to close."
    actions:
      - "CLOSE_REQUEST:{request_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
