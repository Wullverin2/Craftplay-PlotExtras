# Bedrock dashboard for the current plot.
title: "&8Plot Dashboard"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: COMPASS
    name: "&ePlot Info"
    lore:
      - "&7Owner: &f{plot_owner}"
      - "&7Role: &f{plot_role}"
      - "&7Status: &f{plot_status_display}"
      - "&7Warps: &f{plot_warps}"
  settings:
    slots: [10, 11]
    material: COMPARATOR
    name: "&aSettings"
    actions:
      - "OPEN:settings"
  flags:
    slots: [13, 14]
    material: REDSTONE_TORCH
    name: "&aFlags"
    actions:
      - "OPEN:flags"
  decor:
    slots: [16, 17]
    material: GRASS_BLOCK
    name: "&aDecor"
    actions:
      - "OPEN:decor"
  members:
    slots: [28, 29]
    material: PLAYER_HEAD
    name: "&aMembers"
    actions:
      - "OPEN:members"
  warps:
    slots: [31, 32]
    material: ENDER_PEARL
    name: "&aWarps"
    actions:
      - "OPEN:plot-warps"
  tools:
    slots: [34, 35]
    material: COMPASS
    name: "&aTools"
    actions:
      - "OPEN:plot-tools"
  like:
    slot: 39
    material: EMERALD
    name: "&aFavorite"
    actions:
      - "TOGGLE_PLOT_LIKE"
  report:
    slot: 41
    material: BELL
    name: "&cReport"
    actions:
      - "PLAYER_COMMAND:pe report Bedrock-GUI"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:main"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
