# Bedrock dashboard for the current plot.
title: "&8Plot Dashboard"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: COMPASS
    name: "&ePlot Info"
    lore:
      - "&7Owner: &f{plot_owner}"
      - "&7Role: &f{plot_role}"
      - "&7Status: &f{plot_status_display}"
      - "&7Warps: &f{plot_warps}"
  settings:
    slot: 10
    material: COMPARATOR
    name: "&aSettings"
    actions:
      - "OPEN:settings"
  flags:
    slot: 11
    material: REDSTONE_TORCH
    name: "&aFlags"
    actions:
      - "OPEN:flags"
  decor:
    slot: 12
    material: GRASS_BLOCK
    name: "&aDecor"
    actions:
      - "OPEN:decor"
  members:
    slot: 13
    material: PLAYER_HEAD
    name: "&aMembers"
    actions:
      - "OPEN:members"
  warps:
    slot: 14
    material: ENDER_PEARL
    name: "&aWarps"
    actions:
      - "OPEN:plot-warps"
  entity-limits:
    slot: 15
    material: ARMOR_STAND
    name: "&aEntity Limits"
    actions:
      - "OPEN:entity-limits"
  presets:
    slot: 16
    material: MAP
    name: "&aPresets"
    actions:
      - "OPEN:flag-presets"
  note:
    slot: 20
    material: WRITABLE_BOOK
    name: "&aPlot Note"
    actions:
      - "PLOT_NOTE_PROMPT"
  like:
    slot: 21
    material: EMERALD
    name: "&aFavorite"
    actions:
      - "TOGGLE_PLOT_LIKE"
  report:
    slot: 22
    material: BELL
    name: "&cReport"
    actions:
      - "CREATE_REPORT:Bedrock dashboard"
  competitions:
    slot: 23
    material: GOLDEN_APPLE
    name: "&6Competitions"
    actions:
      - "OPEN:competitions"
  tools:
    slot: 24
    material: COMPASS
    name: "&aTools"
    actions:
      - "OPEN:plot-tools"
  team-note:
    slot: 31
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bTeam Note"
    actions:
      - "TEAM_NOTE_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:main"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
