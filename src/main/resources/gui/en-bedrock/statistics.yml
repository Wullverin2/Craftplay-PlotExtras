# Team statistics overview.
title: "&8Statistics"
permission: "craftplayplotextras.statistics"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: LECTERN
    name: "&bPlotExtras statistics"
    lore:
      - "&7Quick overview"
      - "&7of stored data."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: statistics
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25]
  stat-item:
    material: LECTERN
    name: "&b{stat_display}"
    lore:
      - "&7Value: &f{stat_value}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
