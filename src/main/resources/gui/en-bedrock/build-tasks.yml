# Builder tasks for the server team.
title: "&8Builder Tasks"
permission: "craftplayplotextras.builder.tasks"
size: 54

fill:
  enabled: true
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: BRICKS
    name: "&6Open build tasks"
    lore:
      - "&7Create new tasks with"
      - "&f/pe buildtask create&7."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: build-tasks
  show-closed: false
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  task-item:
    material: BRICKS
    name: "&e{task_title}"
    lore:
      - "&7ID: &f{task_id}"
      - "&7Plot: &f{task_plot_key}"
      - "&7By: &f{task_created_by}"
      - "&8{task_note}"
      - "&aClick to complete."
    actions:
      - "COMPLETE_BUILD_TASK:{task_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
