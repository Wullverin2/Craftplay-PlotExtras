# Bedrock player tools.
title: "&8Plot Tools"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: COMPASS
    name: "&eTools"
    lore:
      - "&7Category: &f{plot_category}"
      - "&7Requests: &f{plot_open_requests}"
  assistant:
    slot: 10
    material: KNOWLEDGE_BOOK
    name: "&aAssistant"
    actions:
      - "SHOW_ASSISTANT"
  profile:
    slot: 11
    material: NAME_TAG
    name: "&aProfile"
    actions:
      - "OPEN:plot-profile"
  guestbook:
    slot: 12
    material: WRITABLE_BOOK
    name: "&aGuestbook"
    actions:
      - "OPEN:guestbook"
  search:
    slot: 13
    material: SPYGLASS
    name: "&aSearch"
    actions:
      - "OPEN:plot-search"
  favorite:
    slot: 14
    material: EMERALD
    name: "&aFavorite"
    actions:
      - "TOGGLE_PLOT_LIKE"
  requests:
    slot: 15
    material: PAPER
    name: "&aRequests"
    actions:
      - "OPEN:requests"
  trust-request:
    slot: 16
    material: PLAYER_HEAD
    name: "&aRequest Trust"
    actions:
      - "REQUEST_PROMPT:trust"
  selfcheck:
    slot: 21
    material: CLOCK
    name: "&aCheck"
    actions:
      - "SHOW_SELFCHECK"
  cleanup:
    slot: 22
    material: HOPPER
    name: "&aCleanup"
    actions:
      - "OPEN:cleanup"
  competitions:
    slot: 23
    material: GOLDEN_APPLE
    name: "&6Competitions"
    actions:
      - "OPEN:competitions"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-dashboard"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
