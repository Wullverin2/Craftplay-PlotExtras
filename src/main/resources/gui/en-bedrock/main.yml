# Bedrock main menu with direct access to all player and team functions.
title: "&8Plot Menu"
size: 54

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: COMPASS
    name: "&ePlot Overview"
    lore:
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&7Plot: &f{plot_id}"
  dashboard:
    slot: 10
    material: MAP
    name: "&aDashboard"
    actions:
      - "OPEN:plot-dashboard"
  settings:
    slot: 11
    material: COMPARATOR
    name: "&aSettings"
    actions:
      - "OPEN:settings"
  flags:
    slot: 12
    material: REDSTONE_TORCH
    name: "&aFlags"
    actions:
      - "OPEN:flags"
  decor:
    slot: 13
    material: GRASS_BLOCK
    name: "&aDecor"
    actions:
      - "OPEN:decor"
  members:
    slot: 14
    material: PLAYER_HEAD
    name: "&aMembers"
    actions:
      - "OPEN:members"
  entity-limits:
    slot: 15
    material: ARMOR_STAND
    name: "&aEntity Limits"
    actions:
      - "OPEN:entity-limits"
  language:
    slot: 16
    material: WRITABLE_BOOK
    name: "&aLanguage"
    actions:
      - "OPEN_LANGUAGE"
  tools:
    slot: 19
    material: COMPASS
    name: "&aTools"
    actions:
      - "OPEN:plot-tools"
  warps:
    slot: 20
    material: ENDER_PEARL
    name: "&aWarps"
    actions:
      - "OPEN:plot-warps"
  report:
    slot: 21
    material: BELL
    name: "&cReport Plot"
    actions:
      - "PLAYER_COMMAND:pe report Bedrock menu"
  competitions:
    slot: 22
    material: GOLDEN_APPLE
    name: "&6Competitions"
    actions:
      - "OPEN:competitions"
  profile:
    slot: 23
    material: NAME_TAG
    name: "&aProfile"
    actions:
      - "OPEN:plot-profile"
  cleanup:
    slot: 24
    material: HOPPER
    name: "&aCleanup"
    actions:
      - "OPEN:cleanup"
  team-inspector:
    slot: 37
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bInspector"
    actions:
      - "OPEN:team-inspector"
  audit-log:
    slot: 38
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAudit Log"
    actions:
      - "OPEN:audit-log"
  team-tools:
    slot: 39
    permission: "craftplayplotextras.teamtools"
    material: COMPASS
    name: "&bTeam"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
