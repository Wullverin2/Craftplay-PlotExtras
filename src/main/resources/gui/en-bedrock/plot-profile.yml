# Plot profile menu.
title: "&8Plot Profile"
size: 54

fill:
  enabled: true
  material: LIME_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: NAME_TAG
    name: "&aPlot Profile"
    lore:
      - "&7Description: &f{plot_description}"
      - "&7Category: &f{plot_category}"
      - "&7Tags: &f{plot_tags}"
      - "&7Visit mode: &f{plot_access_mode}"
  show:
    slot: 10
    material: PAPER
    name: "&aShow Profile"
    actions:
      - "SHOW_PROFILE"
  note:
    slot: 12
    material: WRITABLE_BOOK
    name: "&aChange Plot Note"
    actions:
      - "PLOT_NOTE_PROMPT"
  normal:
    slot: 20
    material: WHITE_DYE
    name: "&fVisit Mode: Normal"
    actions:
      - "SET_PROFILE_ACCESS:normal"
  public:
    slot: 21
    material: LIME_DYE
    name: "&aVisit Mode: Public"
    actions:
      - "SET_PROFILE_ACCESS:public"
  members:
    slot: 22
    material: CYAN_DYE
    name: "&bVisit Mode: Members"
    actions:
      - "SET_PROFILE_ACCESS:members"
  private:
    slot: 23
    material: ORANGE_DYE
    name: "&6Visit Mode: Private"
    actions:
      - "SET_PROFILE_ACCESS:private"
  locked:
    slot: 24
    material: RED_DYE
    name: "&cVisit Mode: Locked"
    actions:
      - "SET_PROFILE_ACCESS:locked"
  search:
    slot: 32
    material: SPYGLASS
    name: "&aPlot Search"
    actions:
      - "OPEN:plot-search"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
