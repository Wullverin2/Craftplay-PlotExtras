# Team view for plot reports.
title: "&8Plot Reports"
permission: "craftplayplotextras.report.view"
size: 54

fill:
  enabled: true
  material: RED_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: BELL
    name: "&cOpen reports"
    lore:
      - "&7Click a report"
      - "&7to mark it done."
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: plot-reports
  show-closed: false
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  report-item:
    material: BELL
    name: "&c{report_id}"
    lore:
      - "&7Reporter: &f{report_player}"
      - "&7Plot: &f{report_plot_key}"
      - "&7Owner: &f{report_owner}"
      - "&8{report_reason}"
      - "&cClick to close."
    actions:
      - "CLOSE_REPORT:{report_id}"
  readonly-report-item:
    material: BELL
    name: "&c{report_id}"
    lore:
      - "&7Reporter: &f{report_player}"
      - "&7Plot: &f{report_plot_key}"
      - "&7Owner: &f{report_owner}"
      - "&8{report_reason}"
      - "&7View only. You need close permission."
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"

