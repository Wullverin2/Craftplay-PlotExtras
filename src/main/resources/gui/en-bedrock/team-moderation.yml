# Team moderation menu for the current plot.
title: "&8Moderation"
permission: "craftplayplotextras.moderation.manage"
size: 54

fill:
  enabled: true
  material: LIGHT_BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: PACKED_ICE
    name: "&bModeration"
    lore:
      - "&7Plot: &f{plot_world} {plot_id}"
      - "&7Owner: &f{plot_owner}"
  list:
    slot: 10
    material: PAPER
    name: "&aFrozen Plots"
    actions:
      - "PLAYER_COMMAND:pe mod list"
  freeze:
    slot: 12
    material: PACKED_ICE
    name: "&bFreeze Plot"
    actions:
      - "PLAYER_COMMAND:pe mod freeze GUI freeze"
  unfreeze:
    slot: 14
    material: HONEYCOMB
    name: "&aUnfreeze Plot"
    actions:
      - "PLAYER_COMMAND:pe mod unfreeze"
  redstone:
    slot: 16
    permission: "craftplayplotextras.redstone.admin"
    material: REDSTONE_BLOCK
    name: "&cEnable Redstone"
    actions:
      - "PLAYER_COMMAND:pe redstone enable"
  cleanup-drops:
    slot: 20
    material: HOPPER
    name: "&eRemove Drops"
    actions:
      - "PLAYER_COMMAND:pe mod cleanup drops"
  cleanup-projectiles:
    slot: 21
    material: ARROW
    name: "&eRemove Projectiles"
    actions:
      - "PLAYER_COMMAND:pe mod cleanup projectiles"
  cleanup-monsters:
    slot: 22
    material: ZOMBIE_HEAD
    name: "&eRemove Monsters"
    actions:
      - "PLAYER_COMMAND:pe mod cleanup monsters"
  cleanup-animals:
    slot: 23
    material: WHEAT
    name: "&eRemove Animals"
    actions:
      - "PLAYER_COMMAND:pe mod cleanup animals"
  cleanup-vehicles:
    slot: 24
    material: MINECART
    name: "&eRemove Vehicles"
    actions:
      - "PLAYER_COMMAND:pe mod cleanup vehicles"
  cleanup-all:
    slot: 31
    material: TNT
    name: "&cRemove All"
    actions:
      - "PLAYER_COMMAND:pe mod cleanup all"
  performance:
    slot: 33
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&ePerformance"
    actions:
      - "OPEN:performance"
  inspector:
    slot: 35
    permission: "craftplayplotextras.audit.view"
    material: SPYGLASS
    name: "&bInspector"
    actions:
      - "OPEN:team-inspector"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"
