# Permission check menu for team members.
title: "&8Permission Check"
permission: "craftplayplotextras.permissioncheck"
size: 54

fill:
  enabled: true
  material: PURPLE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: SPYGLASS
    name: "&dPermission Check"
    lore:
      - "&7Click online players below."
      - "&7Plot limit and plot permissions are checked."
  self:
    slot: 10
    material: PLAYER_HEAD
    skull-owner: "{player}"
    name: "&aCheck Me"
    actions:
      - "PLAYER_COMMAND:pe permcheck {player}"
  owner:
    slot: 12
    material: PLAYER_HEAD
    skull-owner: "{plot_owner}"
    name: "&aCheck Plot Owner"
    lore:
      - "&7Owner: &f{plot_owner}"
    actions:
      - "PLAYER_COMMAND:pe permcheck {plot_owner}"
  back:
    slot: 45
    material: ARROW
    name: "&eBack"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cClose"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: permission-check
  slots: "19-25,28-34,37-43"
  player-item:
    material: PLAYER_HEAD
    skull-owner: "{permission_player}"
    name: "&d{permission_player}"
    lore:
      - "&7Plots: &f{permission_plot_count}&7/&f{permission_plot_max}"
      - "&7Admin: &f{permission_is_admin}"
      - "&8{permission_uuid}"
      - "&eClick to check."
    actions:
      - "PLAYER_COMMAND:pe permcheck {permission_player}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&ePage {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&ePage {page}/{pages}"
