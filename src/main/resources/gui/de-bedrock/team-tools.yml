# Team-Werkzeuge für Support, Moderation, Leitung und Builder.
title: "&8Team-Werkzeuge"
permission: "craftplayplotextras.teamtools"
size: 54

fill:
  enabled: true
  material: CYAN_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: SPYGLASS
    name: "&bTeam-Übersicht"
    lore:
      - "&7Alle Teamfunktionen"
      - "&7als eigene Menüs."
  requests:
    slot: 10
    permission: "craftplayplotextras.requests.manage"
    material: PAPER
    name: "&bPlot-Anfragen"
    actions:
      - "OPEN:team-requests"
  reports:
    slot: 12
    permission: "craftplayplotextras.report.view"
    material: BELL
    name: "&cMeldungen"
    actions:
      - "OPEN:reports"
  moderation:
    slot: 14
    permission: "craftplayplotextras.moderation.manage"
    material: PACKED_ICE
    name: "&bModeration"
    actions:
      - "OPEN:team-moderation"
  performance:
    slot: 16
    permission: "craftplayplotextras.performance.view"
    material: CLOCK
    name: "&ePerformance"
    actions:
      - "OPEN:performance"
  backups:
    slot: 19
    permission: "craftplayplotextras.backup.admin"
    material: CHEST
    name: "&bBackups"
    actions:
      - "OPEN:backups"
  create-backup:
    slot: 20
    permission: "craftplayplotextras.backup.create"
    material: CHEST_MINECART
    name: "&bPlot sichern"
    actions:
      - "PLAYER_COMMAND:pe backup create GUI-Team"
  audit:
    slot: 21
    permission: "craftplayplotextras.audit.view"
    material: WRITABLE_BOOK
    name: "&bAuditlog"
    actions:
      - "OPEN:audit-log"
  redstone:
    slot: 22
    permission: "craftplayplotextras.redstone.notify"
    material: REDSTONE_BLOCK
    name: "&cRedstone-Alarme"
    actions:
      - "OPEN:redstone-alerts"
  builder:
    slot: 23
    permission: "craftplayplotextras.builder.tasks"
    material: BRICKS
    name: "&bBuilder-Aufgaben"
    actions:
      - "OPEN:build-tasks"
  permission-check:
    slot: 24
    permission: "craftplayplotextras.permissioncheck"
    material: PLAYER_HEAD
    name: "&dRechtecheck"
    actions:
      - "OPEN:permission-check"
  stats:
    slot: 28
    permission: "craftplayplotextras.statistics"
    material: LECTERN
    name: "&bStatistik"
    actions:
      - "OPEN:statistics"
  validate:
    slot: 30
    permission: "craftplayplotextras.config.validate"
    material: KNOWLEDGE_BOOK
    name: "&bConfig-Check"
    actions:
      - "OPEN:config-issues"
  features:
    slot: 32
    permission: "craftplayplotextras.features.manage"
    material: COMPARATOR
    name: "&dFeatures"
    actions:
      - "OPEN:feature-toggles"
  inspector:
    slot: 34
    permission: "craftplayplotextras.audit.view"
    material: COMPASS
    name: "&bInspektor"
    actions:
      - "OPEN:team-inspector"
  competitions:
    slot: 40
    permission: "craftplayplotextras.competition.judge"
    material: GOLD_BLOCK
    name: "&6Wettbewerbe"
    actions:
      - "OPEN:competitions"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:main"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
