# Admin-GUI fuer einzelne Feature-Schalter aus features.yml.
title: "&8Feature-Schalter"
permission: "craftplayplotextras.features.manage"
size: 54

fill:
  enabled: true
  material: PURPLE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: COMPARATOR
    name: "&dFeature-Schalter"
    lore:
      - "&7Klicke ein Feature,"
      - "&7um es umzuschalten."
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: feature-toggles
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  enabled-item:
    material: LIME_DYE
    name: "&a{feature}"
    lore:
      - "&7Status: {feature_state_color}{feature_state}"
      - "&eKlicken zum Umschalten."
  disabled-item:
    material: GRAY_DYE
    name: "&c{feature}"
    lore:
      - "&7Status: {feature_state_color}{feature_state}"
      - "&eKlicken zum Umschalten."
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
