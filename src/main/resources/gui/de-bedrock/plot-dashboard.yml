# Bedrock-Dashboard für das aktuelle Plot.
title: "&8Plot-Dashboard"
size: 54

fill:
  enabled: true
  material: BLUE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: COMPASS
    name: "&ePlot-Info"
    lore:
      - "&7Besitzer: &f{plot_owner}"
      - "&7Rolle: &f{plot_role}"
      - "&7Status: &f{plot_status_display}"
      - "&7Warps: &f{plot_warps}"
  settings:
    slot: 10
    material: COMPARATOR
    name: "&aEinstellungen"
    actions:
      - "OPEN:settings"
  flags:
    slot: 11
    material: REDSTONE_TORCH
    name: "&aFlags"
    actions:
      - "OPEN:flags"
  decor:
    slot: 12
    material: GRASS_BLOCK
    name: "&aDeko"
    actions:
      - "OPEN:decor"
  members:
    slot: 13
    material: PLAYER_HEAD
    name: "&aMitglieder"
    actions:
      - "OPEN:members"
  warps:
    slot: 14
    material: ENDER_PEARL
    name: "&aWarps"
    actions:
      - "OPEN:plot-warps"
  entity-limits:
    slot: 15
    material: ARMOR_STAND
    name: "&aEntity-Limits"
    actions:
      - "OPEN:entity-limits"
  presets:
    slot: 16
    material: MAP
    name: "&aPresets"
    actions:
      - "OPEN:flag-presets"
  note:
    slot: 20
    material: WRITABLE_BOOK
    name: "&aPlotnotiz"
    actions:
      - "PLOT_NOTE_PROMPT"
  like:
    slot: 21
    material: EMERALD
    name: "&aFavorit"
    actions:
      - "TOGGLE_PLOT_LIKE"
  report:
    slot: 22
    material: BELL
    name: "&cMelden"
    actions:
      - "PLAYER_COMMAND:pe report Bedrock-Dashboard"
  competitions:
    slot: 23
    material: GOLDEN_APPLE
    name: "&6Wettbewerbe"
    actions:
      - "OPEN:competitions"
  tools:
    slot: 24
    material: COMPASS
    name: "&aWerkzeuge"
    actions:
      - "OPEN:plot-tools"
  team-note:
    slot: 31
    permission: "craftplayplotextras.plotmeta.team"
    material: KNOWLEDGE_BOOK
    name: "&bTeamnotiz"
    actions:
      - "TEAM_NOTE_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:main"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
