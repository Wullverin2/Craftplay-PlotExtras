# Rechtecheck-Menü für Teammitglieder.
title: "&8Rechtecheck"
permission: "craftplayplotextras.permissioncheck"
size: 54

fill:
  enabled: true
  material: PURPLE_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: SPYGLASS
    name: "&dRechtecheck"
    lore:
      - "&7Online-Spieler unten anklicken."
      - "&7Plotlimit und Plotrechte werden geprüft."
  self:
    slot: 10
    material: PLAYER_HEAD
    skull-owner: "{player}"
    name: "&aMich prüfen"
    actions:
      - "PERMISSION_CHECK:{player}"
  owner:
    slot: 12
    material: PLAYER_HEAD
    skull-owner: "{plot_owner}"
    name: "&aPlotbesitzer prüfen"
    lore:
      - "&7Besitzer: &f{plot_owner}"
    actions:
      - "PERMISSION_CHECK:{plot_owner}"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: permission-check
  slots: "19-25,28-34,37-43"
  player-item:
    material: PLAYER_HEAD
    skull-owner: "{permission_player}"
    name: "&d{permission_player}"
    lore:
      - "&7Plots: &f{permission_plot_count}&7/&f{permission_plot_max}"
      - "&7Admin: &f{permission_is_admin}"
      - "&8{permission_uuid}"
      - "&eKlicken zum Prüfen."
    actions:
      - "PERMISSION_CHECK:{permission_player}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
