# Bedrock-Hauptmenue. Reduzierte Lore und grosse, gut trennbare Buttons fuer Floodgate-Spieler.
title: "&8Plot-Menue"
size: 54

fill:
  enabled: true
  material: BLACK_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: COMPASS
    name: "&ePlot-Uebersicht"
    lore:
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&7Plot: &f{plot_id}"
    actions:
      - "OPEN:plot-dashboard"
  dashboard:
    slots: [10, 11]
    material: MAP
    name: "&aDashboard"
    lore:
      - "&7Status und Schnellaktionen."
    actions:
      - "OPEN:plot-dashboard"
  settings:
    slots: [13, 14]
    material: COMPARATOR
    name: "&aEinstellungen"
    lore:
      - "&7Home, Wetter, Zeit, Biom."
    actions:
      - "OPEN:settings"
  flags:
    slots: [16, 17]
    material: REDSTONE_TORCH
    name: "&aFlags"
    lore:
      - "&7Plotflags umschalten."
    actions:
      - "OPEN:flags"
  decor:
    slots: [28, 29]
    material: GRASS_BLOCK
    name: "&aDeko"
    lore:
      - "&7Wand und Rand."
    actions:
      - "OPEN:decor"
  members:
    slots: [31, 32]
    material: PLAYER_HEAD
    name: "&aMitglieder"
    lore:
      - "&7Rollen und Trusts."
    actions:
      - "OPEN:members"
  tools:
    slots: [34, 35]
    material: COMPASS
    name: "&aWerkzeuge"
    lore:
      - "&7Profil, Suche, Cleanup."
    actions:
      - "OPEN:plot-tools"
  language:
    slot: 45
    material: WRITABLE_BOOK
    name: "&aSprache"
    actions:
      - "OPEN_LANGUAGE"
  team-tools:
    slot: 47
    permission: "craftplayplotextras.teamtools"
    material: SPYGLASS
    name: "&bTeam"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchliessen"
    actions:
      - "CLOSE"
