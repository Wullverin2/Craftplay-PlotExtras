# Einstellungen: Tab Wetter.
# Optionen kommen aus plot-settings.yml unter weather.options.
title: "&8Einstellungen: Wetter"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  tab-home:
    slot: 10
    material: WHITE_STAINED_GLASS_PANE
    name: "&eHome"
    actions:
      - "OPEN:settings"
  tab-weather:
    slot: 11
    material: LIME_STAINED_GLASS_PANE
    name: "&aWetter"
    glow: true
  tab-time:
    slot: 12
    material: CLOCK
    name: "&eZeit"
    actions:
      - "OPEN:settings-time"
  tab-biome:
    slot: 13
    material: GRASS_BLOCK
    name: "&ePlotbiom"
    actions:
      - "OPEN:settings-biome"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: config-options
  source: plot-settings.weather.options
  slots: "28-34"
  option-item:
    name: "&a{option_display}"
    lore:
      - "&7Setzt das Plot-Wetter auf &f{option_display}&7."
      - "&7Klicke zum Anwenden."
