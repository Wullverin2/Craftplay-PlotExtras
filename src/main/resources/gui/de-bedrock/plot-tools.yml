# Bedrock-Spielerwerkzeuge.
title: "&8Plot-Werkzeuge"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: COMPASS
    name: "&eWerkzeuge"
    lore:
      - "&7Kategorie: &f{plot_category}"
      - "&7Anfragen: &f{plot_open_requests}"
  assistant:
    slot: 10
    material: KNOWLEDGE_BOOK
    name: "&aAssistent"
    actions:
      - "SHOW_ASSISTANT"
  profile:
    slot: 11
    material: NAME_TAG
    name: "&aProfil"
    actions:
      - "OPEN:plot-profile"
  guestbook:
    slot: 12
    material: WRITABLE_BOOK
    name: "&aGästebuch"
    actions:
      - "OPEN:guestbook"
  search:
    slot: 13
    material: SPYGLASS
    name: "&aSuche"
    actions:
      - "OPEN:plot-search"
  favorite:
    slot: 14
    material: EMERALD
    name: "&aFavorit"
    actions:
      - "TOGGLE_PLOT_LIKE"
  requests:
    slot: 15
    material: PAPER
    name: "&aAnfragen"
    actions:
      - "OPEN:requests"
  trust-request:
    slot: 16
    material: PLAYER_HEAD
    name: "&aTrust anfragen"
    actions:
      - "REQUEST_PROMPT:trust"
  selfcheck:
    slot: 21
    material: CLOCK
    name: "&aCheck"
    actions:
      - "SHOW_SELFCHECK"
  cleanup:
    slot: 22
    material: HOPPER
    name: "&aCleanup"
    actions:
      - "OPEN:cleanup"
  competitions:
    slot: 23
    material: GOLDEN_APPLE
    name: "&6Wettbewerbe"
    actions:
      - "OPEN:competitions"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:plot-dashboard"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
