# Bedrock: Top-Plots.
title: "&8Top-Plots"
size: 54
bedrock:
  content: "Wähle eine Rangliste oder einen Plot."

fill:
  enabled: true
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  visits:
    slot: 10
    material: SPYGLASS
    name: "&aBesuche gesamt"
    actions:
      - "SET_TOP_MODE:visits"
  today:
    slot: 11
    material: CLOCK
    name: "&aBesuche heute"
    actions:
      - "SET_TOP_MODE:today"
  week:
    slot: 12
    material: FILLED_MAP
    name: "&aBesuche diese Woche"
    actions:
      - "SET_TOP_MODE:week"
  likes:
    slot: 13
    material: EMERALD
    name: "&aFavoriten"
    actions:
      - "SET_TOP_MODE:likes"
  random:
    slot: 16
    material: ENDER_EYE
    name: "&dZufälliger Plot"
    actions:
      - "RANDOM_PUBLIC_PLOT"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: "top-plots"
  default-mode: "visits"
  slots: [19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  plot-item:
    material: PLAYER_HEAD
    name: "&6#{top_rank} &e{top_plot}"
    lore:
      - "&7Wertung: &f{top_score}"
      - "&7Besuche: &f{top_visits}"
      - "&7Favoriten: &f{top_likes}"
    actions:
      - "TELEPORT_PLOT_KEY:{top_plot_key}"
  previous-item:
    slot: 47
    material: ARROW
    name: "&eVorherige Seite"
  next-item:
    slot: 51
    material: ARROW
    name: "&eNächste Seite"
