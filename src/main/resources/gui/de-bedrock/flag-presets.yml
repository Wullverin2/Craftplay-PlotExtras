# Flag-Presets kommen aus config.yml unter plot-presets.flags.options.
title: "&8Flag-Presets"
size: 54

fill:
  enabled: true
  material: GREEN_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: MAP
    name: "&aFlag-Presets"
    lore:
      - "&7Wendet mehrere Flags"
      - "&7mit einem Klick an."
      - "&8Nur verfügbare Flags werden gesetzt."
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:plot-dashboard"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: config-options
  source: plot-presets.flags.options
  slots: "20-24,29-33"
  option-item:
    material: MAP
    name: "&a{option_display}"
    lore:
      - "&7Klicke, um dieses Preset"
      - "&7auf dein aktuelles Plot anzuwenden."
  previous-item:
    slot: 48
    material: ARROW
    name: "&eVorherige Seite"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNächste Seite"
