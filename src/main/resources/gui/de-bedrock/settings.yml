# Einstellungen: Tab Home.
# Die Tabs sind normale Buttons mit OPEN:<gui> und können frei verschoben oder erweitert werden.
title: "&8Einstellungen: Home"
size: 54

fill:
  enabled: true
  material: LIGHT_GRAY_STAINED_GLASS_PANE
  name: " "

items:
  tab-home:
    slot: 10
    material: LIME_STAINED_GLASS_PANE
    name: "&aHome"
    lore:
      - "&7Aktiver Tab"
    glow: true
  tab-weather:
    slot: 11
    material: WATER_BUCKET
    name: "&eWetter"
    actions:
      - "OPEN:settings-weather"
  tab-time:
    slot: 12
    material: CLOCK
    name: "&eZeit"
    actions:
      - "OPEN:settings-time"
  tab-biome:
    slot: 13
    material: GRASS_BLOCK
    name: "&ePlotbiom"
    actions:
      - "OPEN:settings-biome"
  info:
    slot: 22
    material: BOOK
    name: "&ePlot-Informationen"
    lore:
      - "&7Plot: &f{plot_id}"
      - "&7Welt: &f{plot_world}"
      - "&7Besitzer: &f{plot_owner}"
      - "&7Plots: &f{plot_count}&7/&f{plot_max}"
      - "&8PlotSquared-Max: &f{plotsquared_plot_max}"
      - "&7Geld: &f{cmi_money}"
      - "&7Jobs: &f{jobs}"
      - "&7Quests: &f{quests_completed}&7/&f{quests_total}"
  home:
    slot: 29
    material: ENDER_PEARL
    name: "&aPlot Home"
    lore:
      - "&7Teleportiert dich zu deinem Plot-Home."
    actions:
      - "TELEPORT_PLOT_HOME"
  homes:
    slot: 30
    material: COMPASS
    name: "&aWeitere Homes"
    actions:
      - "OPEN:plot-homes"
  sethome:
    slot: 31
    material: COMPASS
    name: "&aHome setzen"
    lore:
      - "&7Setzt dein Plot-Home an deine Position."
    actions:
      - "SET_PLOT_HOME"
  plotinfo:
    slot: 33
    material: PAPER
    name: "&aPlot Info"
    lore:
      - "&7Zeigt die eigene"
      - "&7Plot-Info im Chat."
    actions:
      - "SHOW_PLOT_INFO"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
