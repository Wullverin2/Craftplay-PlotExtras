# Plotprofil-Menü.
title: "&8Plotprofil"
size: 54

fill:
  enabled: true
  material: LIME_STAINED_GLASS_PANE
  name: " "

items:
  overview:
    slot: 4
    material: NAME_TAG
    name: "&aPlotprofil"
    lore:
      - "&7Beschreibung: &f{plot_description}"
      - "&7Kategorie: &f{plot_category}"
      - "&7Tags: &f{plot_tags}"
      - "&7Besuchsmodus: &f{plot_access_mode}"
  show:
    slot: 10
    material: PAPER
    name: "&aProfil anzeigen"
    actions:
      - "PLAYER_COMMAND:pe profile show"
  note:
    slot: 12
    material: WRITABLE_BOOK
    name: "&aPlotnotiz ändern"
    actions:
      - "PLOT_NOTE_PROMPT"
  normal:
    slot: 20
    material: WHITE_DYE
    name: "&fBesuchsmodus: Normal"
    actions:
      - "PLAYER_COMMAND:pe profile access normal"
  public:
    slot: 21
    material: LIME_DYE
    name: "&aBesuchsmodus: Öffentlich"
    actions:
      - "PLAYER_COMMAND:pe profile access public"
  members:
    slot: 22
    material: CYAN_DYE
    name: "&bBesuchsmodus: Mitglieder"
    actions:
      - "PLAYER_COMMAND:pe profile access members"
  private:
    slot: 23
    material: ORANGE_DYE
    name: "&6Besuchsmodus: Privat"
    actions:
      - "PLAYER_COMMAND:pe profile access private"
  locked:
    slot: 24
    material: RED_DYE
    name: "&cBesuchsmodus: Gesperrt"
    actions:
      - "PLAYER_COMMAND:pe profile access locked"
  search:
    slot: 32
    material: SPYGLASS
    name: "&aPlotsuche"
    actions:
      - "OPEN:plot-search"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"
