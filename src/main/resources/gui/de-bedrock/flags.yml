# Flags-GUI für Deutsch.
# dynamic.type flags erzeugt automatisch Buttons aus den Boolean-Flags in config.yml.
title: "&8Plotflags"
size: 54

fill:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

items:
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "BACK"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: flags
  slots: "10-16,19-25,28-34"
  enabled-item:
    material: LIME_DYE
    name: "&a{flag_display}"
    lore:
      - "&7{flag_description}"
      - ""
      - "&7Status: {flag_state_color}{flag_state}"
      - "&7Klicke zum Umschalten."
    glow: true
  disabled-item:
    material: GRAY_DYE
    name: "&c{flag_display}"
    lore:
      - "&7{flag_description}"
      - ""
      - "&7Status: {flag_state_color}{flag_state}"
      - "&7Klicke zum Umschalten."
  previous-item:
    slot: 48
    material: ARROW
    name: "&eVorherige Seite"
    lore:
      - "&7Seite &f{page}&7/&f{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNächste Seite"
    lore:
      - "&7Seite &f{page}&7/&f{pages}"
