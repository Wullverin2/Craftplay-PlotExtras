# Bedrock: Plot-Mailbox.
title: "&8Plot-Mailbox"
size: 54
bedrock:
  content: "Nachrichten: {plot_mailbox_entries}"

fill:
  enabled: true
  material: YELLOW_STAINED_GLASS_PANE
  name: " "

items:
  write:
    slot: 4
    material: PAPER
    name: "&aNachricht schreiben"
    actions:
      - "MAILBOX_SIGN_PROMPT"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:plot-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: "mailbox"
  slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]
  entry-item:
    material: PAPER
    name: "&a{mail_player}"
    lore:
      - "&7Datum: &f{mail_created}"
      - "&f{mail_message}"
    actions:
      - "DELETE_MAILBOX_ENTRY:{mail_id}"
  readonly-entry-item:
    material: PAPER
    name: "&a{mail_player}"
    lore:
      - "&7Datum: &f{mail_created}"
      - "&f{mail_message}"
  previous-item:
    slot: 47
    material: ARROW
    name: "&eVorherige Seite"
  next-item:
    slot: 51
    material: ARROW
    name: "&eNächste Seite"
