# Rollen-Bearbeitung für Deutsch.
title: "&8Rolle: {selected_role_name}"
size: 54

fill:
  enabled: true
  material: PURPLE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 13
    material: BOOK
    name: "&a{selected_role_name}"
    lore:
      - "&7ID: &f{selected_role_id}"
      - "&7Rechte: &f{selected_role_permissions}"
  rename:
    slot: 21
    material: NAME_TAG
    name: "&eUmbenennen"
    lore:
      - "&7Klicke und schreibe den"
      - "&7neuen Namen in den Chat."
    actions:
      - "ROLE_RENAME_PROMPT"
  delete:
    slot: 23
    material: TNT
    name: "&cLöschen"
    lore:
      - "&7Nicht möglich für Plotinhaber"
      - "&7und Trusted."
    actions:
      - "ROLE_DELETE_SELECTED"
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:roles"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: role-permissions
  slots: "28-34,37-43"
  enabled-item:
    material: LIME_DYE
    name: "&a{permission_display}"
    lore:
      - "&7Recht: &f{permission_key}"
      - "&7Status: &a{permission_state}"
      - "&eKlicke zum Deaktivieren."
  disabled-item:
    material: GRAY_DYE
    name: "&7{permission_display}"
    lore:
      - "&7Recht: &f{permission_key}"
      - "&7Status: &c{permission_state}"
      - "&eKlicke zum Aktivieren."
  protected-item:
    material: NETHER_STAR
    name: "&6{permission_display}"
    lore:
      - "&7Recht: &f{permission_key}"
      - "&7Status: &aimmer aktiv"
      - "&cPlotinhaber hat immer alle Rechte."
    glow: true
  previous-item:
    slot: 48
    material: ARROW
    name: "&eVorherige Seite"
  next-item:
    slot: 50
    material: ARROW
    name: "&eNächste Seite"
