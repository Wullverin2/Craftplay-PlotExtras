# Builder-Aufgaben für das Serverteam.
title: "&8Builder-Aufgaben"
permission: "craftplayplotextras.builder.tasks"
size: 54

fill:
  enabled: true
  material: ORANGE_STAINED_GLASS_PANE
  name: " "

items:
  info:
    slot: 4
    material: BRICKS
    name: "&6Offene Bauaufgaben"
    lore:
      - "&7Neue Aufgaben werden per"
      - "&f/pe buildtask create &7erstellt."
  back:
    slot: 45
    material: ARROW
    name: "&eZurück"
    actions:
      - "OPEN:team-tools"
  close:
    slot: 49
    material: BARRIER
    name: "&cSchließen"
    actions:
      - "CLOSE"

dynamic:
  enabled: true
  type: build-tasks
  show-closed: false
  slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34]
  task-item:
    material: BRICKS
    name: "&e{task_title}"
    lore:
      - "&7ID: &f{task_id}"
      - "&7Plot: &f{task_plot_key}"
      - "&7Von: &f{task_created_by}"
      - "&8{task_note}"
      - "&aKlicken zum Abschließen."
    actions:
      - "COMPLETE_BUILD_TASK:{task_id}"
  previous-item:
    slot: 48
    material: ARROW
    name: "&eSeite {page}/{pages}"
  next-item:
    slot: 50
    material: ARROW
    name: "&eSeite {page}/{pages}"
