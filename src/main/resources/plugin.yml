name: CraftplayPlotExtras
version: ${project.version}
main: de.craftplay.plotextras.CraftplayPlotExtrasPlugin
api-version: '1.21'
depend:
  - PlotSquared
softdepend:
  - CMI
  - Multiverse-Core
  - PlaceholderAPI
  - HeadDatabase
  - Jobs
  - Quests
  - floodgate
author: Codex
description: Extra PlotSquared helpers for Craftplay, including fly protection, named entity persistence and configurable plot GUIs.
commands:
  plotextras:
    description: Opens the Craftplay plot GUI.
    usage: /plotextras
    aliases:
      - plotgui
      - pe
permissions:
  craftplayplotextras.use:
    description: Allows opening the player plot GUI.
    default: true
  craftplayplotextras.flags:
    description: Allows changing plot flags through the GUI.
    default: true
  craftplayplotextras.flags.furniture-interact:
    description: Allows changing the furniture-interact plot flag through the GUI.
    default: true
  craftplayplotextras.flags.prevent-crop-trample:
    description: Allows changing the prevent-crop-trample plot flag through the GUI.
    default: true
  craftplayplotextras.flags.*:
    description: Documents dynamic per-flag GUI permissions such as craftplayplotextras.flags.mob-spawning.
    default: false
  craftplayplotextras.presets:
    description: Allows applying configured plot presets through the GUI.
    default: true
  craftplayplotextras.furniture.bypass:
    description: Bypasses integrated datapack furniture protection checks.
    default: op
  craftplayplotextras.entitylimit.bypass:
    description: Bypasses plot entity limits.
    default: op
  craftplayplotextras.entitylimit.*:
    description: Documents dynamic per-entity limit permissions from limits.yml, for example craftplayplotextras.entitylimit.villager.64.
    default: false
  craftplayplotextras.backup.admin:
    description: Allows listing plot backups.
    default: op
  craftplayplotextras.backup.restore:
    description: Allows restoring plot backups to the current plot.
    default: op
  craftplayplotextras.backup.create:
    description: Allows creating manual schematic backups of the current plot.
    default: op
  craftplayplotextras.cooldown.bypass:
    description: Bypasses command cooldowns for heavy PlotExtras actions.
    default: op
  craftplayplotextras.redstone.notify:
    description: Receives clickable redstone lag protection alerts.
    default: op
  craftplayplotextras.redstone.admin:
    description: Allows teleporting to redstone alerts and re-enabling plot redstone.
    default: op
  craftplayplotextras.audit.view:
    description: Allows viewing plot audit logs and the team inspector.
    default: op
  craftplayplotextras.plotmeta.team:
    description: Allows reading and editing staff notes for plots.
    default: op
  craftplayplotextras.plotmeta.status:
    description: Allows changing the visible status of a plot.
    default: op
  craftplayplotextras.report.create:
    description: Allows players to report the current plot.
    default: true
  craftplayplotextras.report.view:
    description: Allows team members to view plot reports.
    default: op
  craftplayplotextras.report.close:
    description: Allows team members to close plot reports.
    default: op
  craftplayplotextras.moderation.manage:
    description: Allows freezing, unfreezing and cleaning plots.
    default: op
  craftplayplotextras.moderation.bypass:
    description: Bypasses plot freeze restrictions.
    default: op
  craftplayplotextras.performance.view:
    description: Allows viewing plot performance snapshots.
    default: op
  craftplayplotextras.config.validate:
    description: Allows running the configuration validator.
    default: op
  craftplayplotextras.competition.join:
    description: Allows joining plot competitions.
    default: true
  craftplayplotextras.competition.judge:
    description: Allows scoring plot competition entries.
    default: op
  craftplayplotextras.teamtools:
    description: Allows opening the central team tools GUI.
    default: op
  craftplayplotextras.requests.manage:
    description: Allows managing player plot requests.
    default: op
  craftplayplotextras.guestbook.manage:
    description: Allows deleting guestbook entries on plots.
    default: op
  craftplayplotextras.visit.bypass:
    description: Bypasses plot profile visit-mode restrictions.
    default: op
  craftplayplotextras.features.manage:
    description: Allows toggling CraftplayPlotExtras feature switches through the GUI.
    default: op
  craftplayplotextras.statistics:
    description: Allows viewing PlotExtras statistics.
    default: op
  craftplayplotextras.permissioncheck:
    description: Allows checking CraftplayPlotExtras and plot limit permissions for online players.
    default: op
  craftplayplotextras.builder.mode:
    description: Allows toggling the builder mode marker.
    default: op
  craftplayplotextras.builder.tasks:
    description: Allows creating and completing builder plot tasks.
    default: op
  craftplayplotextras.decor:
    description: Allows changing plot wall and border blocks through the GUI.
    default: true
  craftplayplotextras.settings:
    description: Allows changing plot weather, time and biome through the GUI.
    default: true
  craftplayplotextras.decor.wall.1:
    description: Allows selecting value group 1 wall blocks.
    default: true
  craftplayplotextras.decor.wall.2:
    description: Allows selecting value group 2 wall blocks.
    default: op
  craftplayplotextras.decor.wall.3:
    description: Allows selecting value group 3 wall blocks.
    default: op
  craftplayplotextras.decor.wall.4:
    description: Allows selecting value group 4 wall blocks.
    default: op
  craftplayplotextras.decor.wall.5:
    description: Allows selecting value group 5 wall blocks.
    default: op
  craftplayplotextras.decor.wall.*:
    description: Documents all wall value group permissions configured in wall.yml.
    default: false
  craftplayplotextras.decor.border.*:
    description: Documents optional per-border permissions configured in border.yml.
    default: false
  craftplayplotextras.admin:
    description: Allows reloads and bypasses plot owner checks.
    default: op
