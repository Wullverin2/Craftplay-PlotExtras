# Bukkit-/Spigot-Pluginbeschreibung.
# Diese Datei wird vom Server gelesen und legt Name, Hauptklasse, Befehle,
# Abhängigkeiten und Permissions des Plugins fest.

# Dateiversion dieser Pluginbeschreibung.
# Diese Datei wird nicht in den Pluginordner kopiert, sondern direkt aus dem JAR gelesen.
file-version: 10

# Interner Pluginname. Dieser Name erscheint in der Pluginliste des Servers.
name: CraftplayPlotExtras
# Version wird beim Maven-Build aus pom.xml eingesetzt.
version: ${project.version}
# Java-Hauptklasse, die Bukkit beim Laden des Plugins startet.
main: de.craftplay.plotextras.CraftplayPlotExtrasPlugin
# Bukkit-API-Version, gegen die das Plugin geladen wird.
api-version: "1.16"
# Angezeigter Autor.
author: Craftplay
# Kurzbeschreibung für Pluginlisten und Servertools.
description: Konfigurierbares Menü für PlotSquared.
# PlotSquared wird zwingend benötigt. Fehlt PlotSquared, lädt dieses Plugin nicht.
depend:
  - PlotSquared
# Optionale Erweiterungen. PlaceholderAPI ersetzt Platzhalter in GUI-Texten und Commands.
# CMI, Jobs, Quests und mcMMO liefern ihre Werte üblicherweise über PlaceholderAPI-Erweiterungen.
# HeadDatabase liefert Köpfe für GUI-Buttons per head-database-id.
# Floodgate erkennt Bedrock-Spieler und öffnet für sie Forms statt Inventar-Menüs.
# WorldEdit oder FAWE wird für Plotbackups als .schem genutzt.
softdepend:
  - HeadDatabase
  - PlaceholderAPI
  - Vault
  - CMI
  - Jobs
  - Quests
  - mcMMO
  - floodgate
  - Floodgate
  - WorldEdit
  - FastAsyncWorldEdit
# Befehle, die dieses Plugin registriert.
commands:
  plotextras:
    # Beschreibung des Befehls.
    description: Öffnet das PlotSquared-Hilfsmenü.
    # Nutzungshinweis, falls der Befehl falsch verwendet wird.
    usage: /plotextras
    # Zusätzliche Kurzbefehle.
    aliases:
      - cpe
# Permissions, die dieses Plugin nutzt.
permissions:
  craftplayplotextras.use:
    # Erlaubt Spielern, das Menü zu öffnen.
    description: Erlaubt das Öffnen des Plot-Menüs.
    # true bedeutet: normale Spieler haben die Permission standardmäßig.
    default: true
  craftplayplotextras.myplots:
    # Erlaubt Spielern, das Meine-Plots-Menü zu öffnen.
    description: Erlaubt das Öffnen des Meine-Plots-Menüs.
    default: true
  craftplayplotextras.create.premium:
    # Erlaubt das Nutzen des Premiumplot-Buttons im Plot-Erstellen-Menü.
    description: Erlaubt Premiumplot-Erstellung über das Menü.
    default: op
  craftplayplotextras.admin:
    # Erlaubt administrative Befehle wie /plotextras reload.
    description: Erlaubt administrative Basisfunktionen wie Reload.
    # op bedeutet: nur Operatoren haben sie standardmäßig.
    default: op
  craftplayplotextras.team:
    # Erlaubt das Öffnen des Team-Menüs.
    description: Erlaubt das Öffnen des Team-Menüs.
    default: op
  craftplayplotextras.team.reports:
    # Erlaubt teaminterne Report-Buttons.
    description: Erlaubt Report-Funktionen im Team-Menü.
    default: op
  craftplayplotextras.team.community:
    # Erlaubt teaminterne Community-Prüfbuttons.
    description: Erlaubt Community-Prüffunktionen im Team-Menü.
    default: op
  craftplayplotextras.reports.create:
    # Erlaubt Spielern, plugininterne Plotreports zu erstellen.
    description: Erlaubt das Erstellen von Plotreports.
    default: true
  craftplayplotextras.reports.manage:
    # Erlaubt Teammitgliedern, Reports zu sehen und zu bearbeiten.
    description: Erlaubt das Verwalten von Plotreports.
    default: op
  craftplayplotextras.roles.manage:
    # Erlaubt das Verwalten eigener Plotrollen.
    description: Erlaubt das Verwalten von Plotrollen.
    default: op
  craftplayplotextras.future:
    # Erlaubt das Öffnen des Zukunftsfeature-Menüs.
    description: Erlaubt Zugriff auf optionale Featureprofile.
    default: op
  craftplayplotextras.future.heatmaps:
    description: Erlaubt Heatmap-Profile.
    default: op
  craftplayplotextras.future.visitors:
    description: Erlaubt Besucherstatistik-Profile.
    default: op
  craftplayplotextras.future.ranking:
    description: Erlaubt das interne Plotranking.
    default: op
  craftplayplotextras.future.ai:
    description: Erlaubt AI-Tagging-Profile.
    default: op
  craftplayplotextras.future.gallery:
    description: Erlaubt die interne Plot-Galerie.
    default: op
  craftplayplotextras.future.templates:
    description: Erlaubt Template-Profile.
    default: op
  craftplayplotextras.future.backups:
    description: Erlaubt Future-Backup-Aktionen.
    default: op
  craftplayplotextras.future.undo:
    description: Erlaubt das Wiederherstellen des letzten Plotbackups.
    default: op
  craftplayplotextras.future.redstone:
    description: Erlaubt Redstone-Analysen.
    default: op
  craftplayplotextras.future.market:
    description: Erlaubt Plotmarkt-Profile.
    default: op
  craftplayplotextras.future.trading:
    description: Erlaubt Plothandel-Profile.
    default: op
  craftplayplotextras.future.auctions:
    description: Erlaubt Plotauktions-Profile.
    default: op
  craftplayplotextras.future.npcs:
    description: Erlaubt Plot-NPC-Profile.
    default: op
  craftplayplotextras.future.discord:
    description: Erlaubt Discord-Profile.
    default: op
  craftplayplotextras.future.web:
    description: Erlaubt Webübersicht-Profile.
    default: op
  craftplayplotextras.future.manage:
    description: Erlaubt das Bearbeiten fremder Future-Plotdaten.
    default: op
  craftplayplotextras.backup.create:
    # Erlaubt das Erstellen von Plotbackups.
    description: Erlaubt das Erstellen von Plotbackups.
    default: op
  craftplayplotextras.backup.list:
    # Erlaubt das Anzeigen der Plotbackup-Liste.
    description: Erlaubt das Anzeigen der Plotbackup-Liste.
    default: op
  craftplayplotextras.backup.restore:
    # Erlaubt das Wiederherstellen von Plotbackups.
    description: Erlaubt das Wiederherstellen von Plotbackups.
    default: op
