# Entity-Limits fuer Plots und Plotmerges.
# Diese Datei wird beim Start installiert und bei Versionsupdates um fehlende neue Eintraege ergaenzt.
# Jeder Abschnitt unter limits ist ein eigenes Limit. Mit enabled: false deaktivierst du nur dieses Limit.
# Unter permission-limits gewinnt der hoechste Wert, fuer den der Spieler die Permission hat. -1 bedeutet unbegrenzt.

settings:
  # Aktiviert das Entity-Limit-System.
  enabled: true
  # Wenn true, werden bei gemergten Plots alle verbundenen Plotbereiche zusammen gezaehlt.
  count-merged-plots: true
  # Wenn true, zaehlen bei alten Gruppenlimits die konkreten Einzellimits zuerst. Dadurch bremsen alte Kategorien die neuen Einzelwerte nicht aus.
  prefer-single-entity-limits: true
  # Wenn true, werden auch Item-Spawns wie Drops von Kakteen, Farmen oder Blockabbau aktiv limitiert.
  # Standardmäßig false, weil Item-Spawns sehr häufig auftreten und sonst bei großen Plotwelten stark laggen können.
  limit-item-spawns: false
  # Wenn true, werden Projektile wie Pfeile beim Abschießen geprüft.
  limit-projectiles: true
  # Cachezeit für PlotSquared-Regionen in Millisekunden. Reduziert teure Region-Abfragen bei vielen Spawn-Events.
  region-cache-millis: 5000
  # Cachezeit für Entity-Zählungen in Millisekunden. 1000 bedeutet: maximal einmal pro Sekunde pro Plot/Limit neu zählen.
  count-cache-millis: 1000
  warnings:
    # Wenn true, erhalten Spieler vor dem harten Limit Warnungen.
    enabled: true
    # Prozentwerte, bei denen gewarnt wird. 80 bedeutet: Warnung ab 80 Prozent Auslastung.
    percentages:
      - 80
      - 100
    # Cooldown pro Spieler, Plot, Limit und Prozentwert in Sekunden.
    cooldown-seconds: 30
  # Spieler mit dieser Permission umgehen alle Entity-Limits.
  bypass-permission: craftplayplotextras.entitylimit.bypass
  # Diese Entity-Typen werden nicht mitgezaehlt und nicht limitiert.
  excluded-types:
    - PLAYER
    - UNKNOWN
  # Diese CreatureSpawnEvent-Gruende werden aktiv begrenzt. Natuerliche Spawns bleiben standardmaessig frei.
  limited-spawn-reasons:
    - EGG
    - DISPENSE_EGG
    - BUCKET
    - BREEDING
    - BUILD_IRONGOLEM
    - BUILD_SNOWMAN
    - BUILD_WITHER

