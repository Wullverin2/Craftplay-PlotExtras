# CraftplayPlotExtras Entity-Limits.
# In dieser Datei stellst du ein, wie viele Entities pro Plot oder Plotmerge erlaubt sind.
# Ein ungemergtes Plot wird einzeln gezählt, ein Merge wird als gemeinsamer Bereich gezählt.

# Dateiversion dieser Datei. Das Plugin nutzt diesen Wert, um neue Einstellungen automatisch zu ergänzen.
file-version: 1

# Aktiviert oder deaktiviert das komplette Entity-Limit-System.
enabled: true

# Sendet Spielern eine Nachricht, wenn ein Entity wegen eines Limits blockiert wurde.
notify-player: true

# Spieler mit dieser Permission umgehen alle Entity-Limits.
bypass-permission: "craftplayplotextras.entitylimits.bypass"

# Zeit in Sekunden, wie lange gezählte Entity-Mengen zwischengespeichert werden.
# Kleine Werte sind genauer, größere Werte sparen Leistung bei vielen Spawn-Versuchen.
cache-seconds: 1.0

# Fügt beim Laden automatisch alle Entity-Arten hinzu, die auf der Serverversion existieren,
# aber noch nicht in dieser Datei stehen. Die Werte kommen aus defaults.missing-entities.
auto-add-missing-entities: true

# Spawn-Gründe, die nie limitiert werden sollen. Beispiele: CUSTOM, COMMAND, SPAWNER_EGG.
ignored-spawn-reasons: []

defaults:
  missing-entities:
    # Standard-Aktivierung für automatisch ergänzte Entity-Arten.
    enabled: false
    # Standard-Limit für automatisch ergänzte Entity-Arten. -1 bedeutet unbegrenzt.
    limit: 100

# Jede Entity-Art kann einzeln aktiviert, limitiert und mit höheren Permission-Limits versehen werden.
# limit: -1 bedeutet unbegrenzt, limit: 0 blockiert diese Entity-Art komplett auf Plots.
# permission-limits nutzt "Permission: Limit". Das höchste passende Limit gewinnt, -1 bedeutet unbegrenzt.
entities:
  VILLAGER:
    enabled: true
    limit: 12
    permission-limits:
      craftplayplotextras.entitylimits.villager.vip: 20
      craftplayplotextras.entitylimits.villager.premium: 35
