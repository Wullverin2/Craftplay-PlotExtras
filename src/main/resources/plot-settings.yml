# Ploteinstellungen für Wetter, Zeit und Biom.
# Diese Datei steuert die dynamischen Optionen in den Settings-GUIs.
# Jeder Eintrag kann einzeln deaktiviert, mit einer Permission versehen oder mit eigenen Aktionen erweitert werden.

# Optionen für den Wetter-Tab. value wird direkt als PlotSquared weather-Flag gesetzt.
weather:
  options:
    clear:
      # Schaltet nur diese Wetteroption ab.
      enabled: true
      display: "Klar"
      value: clear
      material: SUNFLOWER
      actions:
        - "SET_FLAG:weather:{value}:{option_display}"
    rain:
      # Schaltet nur diese Wetteroption ab.
      enabled: true
      display: "Regen"
      value: rain
      material: WATER_BUCKET
      actions:
        - "SET_FLAG:weather:{value}:{option_display}"
    reset:
      # Schaltet nur diese Wetteroption ab.
      enabled: true
      display: "Standard"
      value: reset
      material: BARRIER
      actions:
        - "SET_FLAG:weather:{value}:{option_display}"

# Optionen für den Zeit-Tab. value ist die Minecraft-Tageszeit.
time:
  options:
    sunrise:
      # Schaltet nur diese Zeitoption ab.
      enabled: true
      display: "Sonnenaufgang"
      value: "0"
      material: ORANGE_DYE
      actions:
        - "SET_FLAG:time:{value}:{option_display}"
    day:
      # Schaltet nur diese Zeitoption ab.
      enabled: true
      display: "Tag"
      value: "1000"
      material: SUNFLOWER
      actions:
        - "SET_FLAG:time:{value}:{option_display}"
    noon:
      # Schaltet nur diese Zeitoption ab.
      enabled: true
      display: "Mittag"
      value: "6000"
      material: CLOCK
      actions:
        - "SET_FLAG:time:{value}:{option_display}"
    night:
      # Schaltet nur diese Zeitoption ab.
      enabled: true
      display: "Nacht"
      value: "13000"
      material: BLACK_DYE
      actions:
        - "SET_FLAG:time:{value}:{option_display}"
    midnight:
      # Schaltet nur diese Zeitoption ab.
      enabled: true
      display: "Mitternacht"
      value: "18000"
      material: ENDER_EYE
      actions:
        - "SET_FLAG:time:{value}:{option_display}"
    reset:
      # Schaltet nur diese Zeitoption ab.
      enabled: true
      display: "Standard"
      value: reset
      material: BARRIER
      actions:
        - "SET_FLAG:time:{value}:{option_display}"

