# Zentrale Funktionsschalter für CraftplayPlotExtras.
# Jeder Bereich hat ein eigenes enabled. Wenn ein übergeordneter Bereich deaktiviert ist,
# sind automatisch alle Unterpunkte deaktiviert.
# Beispiel: player.decor.enabled: false deaktiviert Wand und Rand.

features:
  # Hauptschalter für alle Zusatzfunktionen dieses Plugins.
  enabled: true

  player:
    # Schaltet alle Spielerfunktionen ab, lässt Admin-/Teamwerkzeuge aber separat steuerbar.
    enabled: true

    gui:
      # Haupt-GUI und frei erstellte GUI-Seiten.
      enabled: true
      bedrock:
        # Wenn Floodgate erkannt wird, werden fuer Bedrock-Spieler passende GUI-Dateien wie gui/de-bedrock/main.yml bevorzugt.
        enabled: true
      skull-owner-lookups:
        # Spieler-Köpfe in GUIs über Mojang-Profile auflösen. Standardmäßig aus, um Rate-Limits zu vermeiden.
        enabled: false
      custom:
        # Eigene GUI-Dateien und eigene Buttons, die nicht direkt einem Standardbereich zugeordnet sind.
        enabled: true

    language:
      # Sprach-GUI und Sprachwechsel.
      enabled: true

    dashboard:
      # Plot-Dashboard mit Status, Notizen, Likes, Besucherzahlen, Warps und Limits.
      enabled: true

    tools:
      # Zusatzmenü für Spielerwerkzeuge wie Assistent, Suche, Gästebuch und Cleanup.
      enabled: true

    assistant:
      # Neuer-Spieler-/Plot-Assistent mit Status, Tipps und Schnellübersicht.
      enabled: true

    flags:
      # Flags-GUI und einzelne Flag-Umschaltungen.
      enabled: true

    flag-presets:
      # Vordefinierte Flag-Presets aus config.yml.
      enabled: true

    decor:
      # Deko-Menü für Wand und Rand.
      enabled: true
      wall:
        # Plotwand ändern.
        enabled: true
      border:
        # Plotrand ändern oder entfernen.
        enabled: true

    settings:
      # Ploteinstellungen-Menü.
      enabled: true
      home:
        # Plot-Home setzen und nutzen.
        enabled: true
        set:
          enabled: true
        teleport:
          enabled: true
      weather:
        # Plot-Wetter ändern oder zurücksetzen.
        enabled: true
      time:
        # Plot-Zeit ändern oder zurücksetzen.
        enabled: true
      biome:
        # Plot-Biom ändern oder zurücksetzen.
        enabled: true

    members:
      # Mitglieder-GUI.
      enabled: true
      invite:
        # Spieler per GUI einladen.
        enabled: true
      remove:
        # Spieler vom Plot entfernen/untrusten.
        enabled: true
      roles:
        # Rollen an Mitglieder vergeben oder entfernen.
        enabled: true
      promote:
        # Mitglieder per Rollenreihenfolge befördern.
        enabled: true
      demote:
        # Mitglieder per Rollenreihenfolge degradieren.
        enabled: true

    roles:
      # Rollen erstellen, bearbeiten, umbenennen und löschen.
      enabled: true

    entity-limits:
      # Entity-Limit-Anzeige im GUI. Die eigentliche Limit-Erzwingung steht zusätzlich in limits.yml.
      enabled: true

    plot-notes:
      # Besitzer-Notizen im Plot-Dashboard.
      enabled: true

    plot-status:
      # Plotstatus wie privat, offen, Wartung oder Team-geprüft.
      enabled: true

    plot-likes:
      # Plot-Likes/Favorisieren.
      enabled: true

    plot-visits:
      # Besucherzähler und letzter Besucher.
      enabled: true

    plot-favorites:
      # Persönliche Favoritenliste für Plots.
      enabled: true

    plot-profile:
      # Plotbeschreibung, Kategorie, Tags und Besuchsmodus.
      enabled: true

    plot-search:
      # Suche nach Plotprofilen, Tags, Kategorien und Beschreibungen.
      enabled: true

    guestbook:
      # Öffentliches Gästebuch pro Plot.
      enabled: true

    requests:
      # Spieleranfragen an Plotbesitzer oder Team, z. B. Trust, Backup, Restore oder Umzug.
      enabled: true

    temporary-trusts:
      # Temporäre Trusts, die automatisch nach Ablauf entfernt werden.
      enabled: true

    cleanup:
      # Spieler können harmlose Entity-Arten auf dem eigenen Plot bereinigen.
      enabled: true

    visit-mode:
      # Speichert Besuchsmodi wie öffentlich, privat, Mitglieder oder gesperrt im Plotprofil.
      enabled: true

    plot-warps:
      # Plot-Warp-System.
      enabled: true
      set:
        enabled: true
      teleport:
        enabled: true
      delete:
        enabled: true

    reports:
      # Spieler können den aktuellen Plot mit Grund an das Team melden.
      enabled: true

    competitions:
      # Spieler können Plots für Wettbewerbe anmelden.
      enabled: true

    plot-limits:
      # Hartes Plotlimit über Permission-Werte wie plots.plot.84.
      enabled: true

    config-options:
      # Dynamische Optionen aus config.yml in GUIs, z. B. Wetter, Zeit, Biom und Presets.
      enabled: true

    custom-buttons:
      # Eigene Button-Aktionen in GUI-Dateien.
      enabled: true
      commands:
        # Eigene Spieler- und Konsolenbefehle über GUI-Buttons.
        enabled: true
      messages:
        # Eigene Nachrichten über GUI-Buttons.
        enabled: true

  protection:
    # Schutzfunktionen außerhalb der reinen GUI-Bedienung.
    enabled: true
    flight:
      # Fly-Schutz in Plotwelten und Fly-Deaktivierung außerhalb von Plotwelten.
      enabled: true
      restore-inside-plot-worlds:
        enabled: true
      disable-outside-plot-worlds:
        enabled: true
    named-entity-despawn:
      # Verhindert Despawn benannter Kreaturen.
      enabled: true
    dragon-egg-teleport:
      # Verhindert, dass Enderdracheneier beim Anklicken wegteleportieren.
      enabled: true
    cooldowns:
      # Schuetzt schwere oder spammbare Befehle mit konfigurierbaren Cooldowns.
      enabled: true
    furniture:
      # Integrierte Möbel-Flags und Möbelinteraktionsschutz.
      enabled: true
      interact-flag:
        enabled: true
      sit-flag:
        enabled: true
      modify-flag:
        enabled: true
      crop-trample-flag:
        enabled: true

  limits:
    # Entity-Limit-System. Einzelne Entity-Limits werden zusätzlich in limits.yml geschaltet.
    enabled: true
    enforce:
      enabled: true
    gui:
      enabled: true

  backups:
    # Backup-System. Einzelne Gründe werden zusätzlich in config.yml unter plot-backups.automatic geschaltet.
    enabled: true
    manual:
      # Erlaubt manuelle Admin-Backups vom aktuellen Plot.
      enabled: true
    automatic:
      enabled: true
      on-delete:
        enabled: true
      on-unmerge:
        enabled: true
      on-clear:
        enabled: true
    restore:
      enabled: true

  redstone:
    # Redstone-Lagmaschinen-Erkennung.
    enabled: true
    detection:
      enabled: true
    alerts:
      enabled: true
    disable-plot-redstone:
      enabled: true
    reactivate:
      enabled: true

  team:
    # Teamfunktionen für Leitung, Admin, Mod, Supporter, Support JR und Builder.
    enabled: true
    tools:
      # Zentrales Team-Werkzeugmenü.
      enabled: true
    inspector:
      enabled: true
    audit-log:
      enabled: true
    notes:
      enabled: true
    backups:
      enabled: true
      create:
        enabled: true
      restore:
        enabled: true
    redstone-alerts:
      enabled: true
    requests:
      # Teamübersicht und Bearbeitung von Spieleranfragen.
      enabled: true
    permission-checker:
      # Reservierter Schalter für Rechte-Debug/Anzeige in Team-GUIs.
      enabled: true
    config-validator:
      # Reservierter Schalter für spätere Config-Prüfungen.
      enabled: true
    statistics:
      # Reservierter Schalter für spätere Team-Statistiken.
      enabled: true
    feature-toggles:
      # Admin-GUI zum Ein- und Ausschalten einzelner Features aus features.yml.
      enabled: true
    builder:
      # Builder-Werkzeuge wie Builder-Modus und Bauaufgaben.
      enabled: true
      mode:
        enabled: true
      tasks:
        enabled: true

    reports:
      # Teamübersicht für Plot-Meldungen.
      enabled: true
      close:
        enabled: true
    moderation:
      # Teamfunktionen zum Einfrieren, Freigeben und Bereinigen von Plots.
      enabled: true
      freeze:
        enabled: true
        block-spawns:
          enabled: true
        block-redstone:
          enabled: true
      cleanup:
        enabled: true
    performance:
      # Performance-Schnappschuss für den aktuellen Plot.
      enabled: true
    competitions:
      # Teamfunktionen für Bauwettbewerbe.
      enabled: true
      judge:
        enabled: true

  integrations:
    # Externe Integrationen.
    enabled: true
    placeholder-api:
      enabled: true
    head-database:
      enabled: true
    cmi:
      enabled: true
    jobs:
      enabled: true
    quests:
      enabled: true
    floodgate:
      # Floodgate-Erkennung fuer Bedrock-Spieler und Bedrock-GUI-Varianten.
      enabled: true
