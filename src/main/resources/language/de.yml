# Deutsche Standardtexte.
# In dieser Datei stehen alle deutschen Nachrichten, die das Plugin an Spieler
# oder die Konsole sendet. Farbcodes werden mit & geschrieben, z. B. &a für Grün.

# Dateiversion dieser Sprachdatei.
# Das Plugin nutzt diesen Wert, um neue Nachrichten automatisch zu ergänzen.
file-version: 27

# Nachricht, wenn ein Spieler oder die Konsole keine passende Permission hat.
no-permission: "&cDazu hast du keine Berechtigung."
# Nachricht, wenn ein Befehl nur von Spielern genutzt werden kann.
only-players: "&cDieser Befehl kann nur von Spielern genutzt werden."
# Nachricht nach /plotextras reload.
reloaded: "&aCraftplayPlotExtras wurde neu geladen."
# Nachricht nach /cpe version. Platzhalter: {plugin}, {version}, {developer}
plugin-version: "&a{plugin} &7Version: &f{version} &8| &7Entwickler: &f{developer}"
# Nachricht, wenn die GUI-Datei fehlt oder nicht geladen werden konnte.
menu-missing: "&cDas Plot-Menü konnte nicht geladen werden. Bitte informiere ein Teammitglied."
# Nachricht, wenn ein reines Bedrock-Form-Menü von einem Java-Spieler geöffnet wird.
bedrock-only: "&cDieses Menü ist nur für Bedrock-Spieler verfügbar."
# Nachricht, wenn Floodgate/Cumulus keine Bedrock-Form öffnen konnte.
bedrock-form-failed: "&cDas Bedrock-Menü konnte nicht geöffnet werden."
# Nachricht, wenn ein Spieler für eine Plotfunktion auf einem Plot stehen muss.
no-plot: "&cDu stehst auf keinem Plot."
# Nachricht, wenn ein Entity wegen des Plot- oder Merge-Limits blockiert wurde. Platzhalter: {entity}, {type}, {current}, {limit}, {plot}, {world}, {merge}
entity-limit-reached: "&cAuf diesem Plot sind bereits &f{current}/{limit} &cEntities vom Typ &f{entity} &cvorhanden."
# Nachricht, wenn das Plotkauf-System deaktiviert ist.
plotbuy-disabled: "&cDer Plotkauf ist aktuell deaktiviert."
# Nachricht, wenn die ausgewählte Kaufmenge ungültig ist.
plotbuy-invalid-amount: "&cBitte wähle mindestens ein Plot zum Kaufen aus."
# Nachricht, wenn Vault/CMI-Economy für den Plotkauf nicht verfügbar ist.
plotbuy-economy-missing: "&cDas Economy-System ist nicht verfügbar. Der Plotkauf wurde abgebrochen."
# Nachricht, wenn der Spieler nicht genug Taler hat. Platzhalter: {price}, {selected_plots}, {currency}
plotbuy-not-enough-money: "&cDu hast nicht genug Taler. Benötigt: &f{price}&c."
# Nachricht, wenn die PlotSquared-Permission nicht gesetzt werden konnte.
