# Nachricht, wenn Plotbackups deaktiviert sind.
backup-disabled: "&cPlotbackups sind aktuell deaktiviert."
# Nachricht, wenn WorldEdit oder FAWE fehlt.
backup-worldedit-missing: "&cWorldEdit oder FAWE wurde nicht gefunden. Plotbackups können nicht erstellt werden."
