# Deutsche Standardtexte.
# In dieser Datei stehen alle deutschen Nachrichten, die das Plugin an Spieler
# oder die Konsole sendet. Farbcodes werden mit & geschrieben, z. B. &a für Grün.

# Dateiversion dieser Sprachdatei.
# Das Plugin nutzt diesen Wert, um neue Nachrichten automatisch zu ergänzen.
file-version: 6

# Nachricht, wenn ein Spieler oder die Konsole keine passende Permission hat.
no-permission: "&cDazu hast du keine Berechtigung."
# Nachricht, wenn ein Befehl nur von Spielern genutzt werden kann.
only-players: "&cDieser Befehl kann nur von Spielern genutzt werden."
# Nachricht nach /plotextras reload.
reloaded: "&aCraftplayPlotExtras wurde neu geladen."
# Nachricht, wenn die GUI-Datei fehlt oder nicht geladen werden konnte.
menu-missing: "&cDas Plot-Menü konnte nicht geladen werden. Bitte informiere ein Teammitglied."
# Nachricht, wenn ein reines Bedrock-Form-Menü von einem Java-Spieler geöffnet wird.
bedrock-only: "&cDieses Menü ist nur für Bedrock-Spieler verfügbar."
# Nachricht, wenn Floodgate/Cumulus keine Bedrock-Form öffnen konnte.
bedrock-form-failed: "&cDas Bedrock-Menü konnte nicht geöffnet werden."
# Nachricht, wenn ein Spieler für eine Plotfunktion auf einem Plot stehen muss.
no-plot: "&cDu stehst auf keinem Plot."
# Nachricht, wenn ein Spieler eine Flag nicht umschalten darf.
flag-no-permission: "&cDu darfst diese Plot-Flag nicht ändern."
# Nachricht nach dem Umschalten einer Flag. Platzhalter: {flag}, {status}
flag-toggled: "&a{flag} &7ist jetzt {status}&7."
# Nachricht, wenn Plotbackups deaktiviert sind.
backup-disabled: "&cPlotbackups sind aktuell deaktiviert."
# Nachricht, wenn WorldEdit oder FAWE fehlt.
backup-worldedit-missing: "&cWorldEdit oder FAWE wurde nicht gefunden. Plotbackups können nicht erstellt werden."
# Nachricht, wenn ein Spieler keine Backup-Rechte hat.
backup-no-permission: "&cDu darfst keine Plotbackups nutzen."
# Nachricht, wenn die Plotdaten nicht gelesen werden konnten.
backup-plot-read-failed: "&cDie Plotregion konnte nicht gelesen werden."
# Nachricht beim Start eines Backups.
backup-started: "&eDas Plotbackup wird erstellt. Das kann je nach Plotgröße einen Moment dauern."
# Nachricht nach einem erfolgreichen Backup. Platzhalter: {id}, {file}, {owner}, {created_by}, {created_at}, {action}, {world}, {plot}, {plots}, {merge}
backup-created: "&aPlotbackup erstellt: &f{id}"
# Nachricht bei einem fehlgeschlagenen Backup.
backup-failed: "&cDas Plotbackup konnte nicht erstellt werden. Bitte prüfe die Konsole."
# Nachricht, wenn eine abgefangene PlotSquared-Aktion ein Backup braucht. Platzhalter: {action}, {command}
backup-protected-action-start: "&eDiese Aktion erstellt zuerst ein Backup des Plots oder Merges. Das kann je nach Größe einige Momente dauern."
# Sicherheitsabfrage für abgefangene Aktionen.
backup-confirm-question: "&7Bestätige mit &a/{prefix} confirm &7oder brich mit &c/{prefix} cancel &7ab."
# Sicherheitsabfrage für Restore. Platzhalter wie backup-created.
backup-restore-confirm: "&eDieses Backup wird auf dem Plot wiederhergestellt, auf dem du stehst: &f{id}&e. Bestätige mit &a/{prefix} confirm &eoder brich mit &c/{prefix} cancel &eab."
# Nachricht, wenn keine Aktion bestätigt werden kann.
backup-no-pending-action: "&cEs wartet keine Backup-Aktion auf deine Bestätigung."
# Nachricht, wenn eine Aktion abgebrochen wurde.
backup-action-cancelled: "&cDie Backup-Aktion wurde abgebrochen."
# Nachricht, wenn ein Backup nicht gefunden wurde.
backup-not-found: "&cDieses Plotbackup wurde nicht gefunden."
# Nachricht, wenn die .schem-Datei zu einem Backup fehlt.
backup-schematic-missing: "&cDie Schematic-Datei zu diesem Backup fehlt: &f{file}"
# Nachricht beim Start einer Wiederherstellung.
backup-restore-started: "&eDas Plotbackup wird wiederhergestellt. Bitte warte einen Moment."
# Nachricht nach einer Wiederherstellung.
backup-restored: "&aPlotbackup wurde wiederhergestellt: &f{id}"
# Nachricht bei einer fehlgeschlagenen Wiederherstellung.
backup-restore-failed: "&cDas Plotbackup konnte nicht wiederhergestellt werden. Bitte prüfe die Konsole."
# Nutzungshinweis für Backup-Befehle.
backup-command-usage: "&eNutze: &f/{prefix} backup create&7, &f/{prefix} backup list &7oder &f/{prefix} backup restore <id>&7."

# Nachricht, wenn ein Plot aus dem Meine-Plots-Menü nicht mehr gefunden wurde.
myplots-plot-not-found: "&cDieser Plot wurde nicht gefunden oder gehört dir nicht mehr."
# Nachricht beim Teleportieren über das Meine-Plots-Menü. Platzhalter: {name}, {plot}, {world}
myplots-teleport: "&aDu wirst zu &f{name} &7({plot}) &ateleportiert."
# Nachricht, wenn ein Plot als Favorit markiert wurde. Platzhalter: {name}, {status}
myplots-favorite-added: "&a{name} wurde zu deinen Favoriten hinzugefügt."
# Nachricht, wenn ein Plot aus den Favoriten entfernt wurde. Platzhalter: {name}, {status}
myplots-favorite-removed: "&e{name} wurde aus deinen Favoriten entfernt."
# Nachricht, wenn die gespeicherte Sichtbarkeit geändert wurde. Platzhalter: {name}, {status}
myplots-visibility-changed: "&aSichtbarkeit von &f{name} &aist jetzt &f{status}&a."
# Nachricht, wenn die Kategorie geändert wurde. Platzhalter: {name}, {category}
myplots-category-changed: "&aKategorie von &f{name} &aist jetzt &f{category}&a."
# Nachricht, wenn ein Tag aktiviert wurde. Platzhalter: {name}, {tag}, {status}
myplots-tag-added: "&aTag &f{tag} &awurde für &f{name} &aaktiviert."
# Nachricht, wenn ein Tag deaktiviert wurde. Platzhalter: {name}, {tag}, {status}
myplots-tag-removed: "&eTag &f{tag} &ewurde für &f{name} &eentfernt."
# Text für aktive Tags.
myplots-tag-active: "Aktiv"
# Text für inaktive Tags.
myplots-tag-inactive: "Inaktiv"
# Text, wenn ein Plot keine Tags hat.
myplots-no-tags: "Keine"
# Text, wenn ein Plot öffentlich erkannt wird.
myplots-public: "Öffentlich"
# Text, wenn ein Plot privat erkannt wird.
myplots-private: "Privat"
# Sichtbarkeitsmodus automatisch. In diesem Modus wird der PlotSquared-Status angezeigt.
myplots-visibility-auto: "Automatisch"
# Sichtbarkeitsmodus öffentlich.
myplots-visibility-public: "Öffentlich"
# Sichtbarkeitsmodus privat.
myplots-visibility-private: "Privat"
# Symbol für Favoriten.
myplots-favorite-yes: "★"
# Symbol für Nicht-Favoriten.
myplots-favorite-no: "☆"
# Text für aktiven Favoritenstatus.
myplots-favorite-active: "Favorit"
# Text für inaktiven Favoritenstatus.
myplots-favorite-inactive: "Kein Favorit"
# Text, wenn ein Plot noch nie über das Menü besucht wurde.
myplots-never: "Nie"
# Anzeigenamen der Sortierungen.
myplots-sort-name: "Name"
myplots-sort-size: "Größe"
myplots-sort-activity: "Aktivität"
myplots-sort-rating: "Bewertung"
myplots-sort-category: "Kategorie"
# Anzeigenamen der Filter.
myplots-filter-all: "Alle"
myplots-filter-favorites: "Favoriten"
myplots-filter-public: "Öffentlich"
myplots-filter-private: "Privat"

# Nachricht, wenn eine Chat-Eingabe falsch konfiguriert ist.
chat-input-invalid: "&cDiese Chat-Eingabe ist falsch konfiguriert."
# Nachricht, wenn eine Chat-Eingabe abgebrochen wurde.
chat-input-cancelled: "&cEingabe abgebrochen."
# Nachricht, wenn eine Chat-Eingabe angenommen wurde.
chat-input-accepted: "&aEingabe übernommen."
# Chatfrage für Spielernamen. Die Eingabe ist für andere nicht sichtbar.
chat-member-player: "&eSchreibe den Spielernamen in den Chat. &7Tippe &ccancel &7zum Abbrechen."
# Chatfrage für Plotnamen.
chat-plot-name: "&eSchreibe den neuen Plotnamen in den Chat. &7Tippe &ccancel &7zum Abbrechen."
# Chatfrage für Plotbeschreibung.
chat-plot-description: "&eSchreibe die neue Plotbeschreibung in den Chat. &7Tippe &ccancel &7zum Abbrechen."
# Chatfrage für Suchbegriffe.
chat-plot-search: "&eSchreibe den Suchbegriff oder Spielernamen in den Chat. &7Tippe &ccancel &7zum Abbrechen."
# Chatfrage für Reports.
chat-plot-report: "&eBeschreibe kurz das Problem auf diesem Plot. &7Tippe &ccancel &7zum Abbrechen."
