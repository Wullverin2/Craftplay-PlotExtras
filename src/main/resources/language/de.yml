myplots-visibility-changed: "&aSichtbarkeit von &f{name} &aist jetzt &f{status}&a."
# Nachricht, wenn die Kategorie geändert wurde. Platzhalter: {name}, {category}
myplots-category-changed: "&aKategorie von &f{name} &aist jetzt &f{category}&a."
# Nachricht, wenn ein Tag aktiviert wurde. Platzhalter: {name}, {tag}, {status}
