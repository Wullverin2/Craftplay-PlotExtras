backup-confirm-question: "&7Bestätige mit &a/{prefix} confirm &7oder brich mit &c/{prefix} cancel &7ab."
# Sicherheitsabfrage für Restore. Platzhalter wie backup-created.
backup-restore-confirm: "&eDieses Backup wird auf dem Plot wiederhergestellt, auf dem du stehst: &f{id}&e. Bestätige mit &a/{prefix} confirm &eoder brich mit &c/{prefix} cancel &eab."
# Nachricht, wenn keine Aktion bestätigt werden kann.
