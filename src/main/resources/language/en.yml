# English default messages.
# This file contains all English messages sent by the plugin to players
# or the console. Color codes use &, for example &a for green.

# File version of this language file.
# The plugin uses this value to add new messages automatically.
file-version: 13

# Message shown when a player or the console lacks the required permission.
no-permission: "&cYou do not have permission to do that."
# Message shown when a command can only be used by players.
only-players: "&cOnly players can use this command."
# Message shown after /plotextras reload.
reloaded: "&aCraftplayPlotExtras has been reloaded."
# Message shown when the GUI file is missing or could not be loaded.
menu-missing: "&cThe plot menu could not be loaded. Please contact a staff member."
# Message shown when a Java player tries to open a Bedrock-only form menu.
bedrock-only: "&cThis menu is only available for Bedrock players."
# Message shown when Floodgate/Cumulus could not open a Bedrock form.
bedrock-form-failed: "&cThe Bedrock menu could not be opened."
# Message shown when a player needs to stand on a plot for a plot feature.
no-plot: "&cYou are not standing on a plot."
# Message shown when a player may not toggle a flag.
flag-no-permission: "&cYou may not change this plot flag."
# Message shown after toggling a flag. Placeholders: {flag}, {status}
flag-toggled: "&a{flag} &7is now {status}&7."
# Message shown when plot backups are disabled.
backup-disabled: "&cPlot backups are currently disabled."
# Message shown when WorldEdit or FAWE is missing.
backup-worldedit-missing: "&cWorldEdit or FAWE was not found. Plot backups cannot be created."
# Message shown when a player lacks backup permissions.
backup-no-permission: "&cYou may not use plot backups."
# Message shown when plot data could not be read.
backup-plot-read-failed: "&cThe plot region could not be read."
# Message shown when a backup starts.
backup-started: "&eThe plot backup is being created. This can take a moment depending on plot size."
# Message shown after a successful backup. Placeholders: {id}, {file}, {owner}, {created_by}, {created_at}, {action}, {world}, {plot}, {plots}, {merge}
backup-created: "&aPlot backup created: &f{id}"
# Message shown when a backup failed.
backup-failed: "&cThe plot backup could not be created. Please check the console."
# Message shown when an intercepted PlotSquared action needs a backup. Placeholders: {action}, {command}
backup-protected-action-start: "&eThis action creates a backup of the plot or merge first. This can take a few moments depending on size."
# Safety confirmation for intercepted actions.
backup-confirm-question: "&7Confirm with &a/{prefix} confirm &7or cancel with &c/{prefix} cancel&7."
# Safety confirmation for restore. Same placeholders as backup-created.
backup-restore-confirm: "&eThis backup will be restored on the plot you are standing on: &f{id}&e. Confirm with &a/{prefix} confirm &eor cancel with &c/{prefix} cancel&e."
# Message shown when nothing is waiting for confirmation.
backup-no-pending-action: "&cNo backup action is waiting for confirmation."
# Message shown when an action was cancelled.
backup-action-cancelled: "&cThe backup action was cancelled."
# Message shown when a backup was not found.
backup-not-found: "&cThat plot backup was not found."
# Message shown when the .schem file for a backup is missing.
backup-schematic-missing: "&cThe schematic file for this backup is missing: &f{file}"
# Message shown when a restore starts.
backup-restore-started: "&eThe plot backup is being restored. Please wait a moment."
# Message shown after a restore.
backup-restored: "&aPlot backup restored: &f{id}"
# Message shown when restore failed.
backup-restore-failed: "&cThe plot backup could not be restored. Please check the console."
# Usage message for backup commands.
backup-command-usage: "&eUse: &f/{prefix} backup create&7, &f/{prefix} backup list &7or &f/{prefix} backup restore <id>&7."

# Message shown when reports are disabled.
reports-disabled: "&cThe report system is currently disabled."
# Message shown after creating a report. Placeholders: {id}, {category}, {plot}
report-created: "&aReport created: &f{id} &7({category})"
# Message sent to staff when a new report was created.
report-team-notify: "&cNew plot report: &f{id} &7by &f{reporter} &7on &f{world};{plot}&7."
# Message shown when a report was not found.
report-not-found: "&cThat report was not found."
# Message shown when a report was closed.
report-closed: "&aReport &f{id} &awas closed."
# Message shown when a report was reopened.
report-reopened: "&eReport &f{id} &ewas reopened."
# Message shown when report priority changed.
report-priority-changed: "&aPriority of report &f{id} &ais now &f{priority}&a."
# Message shown when a report note was saved.
report-note-saved: "&aNote for report &f{id} &asaved."

# Message shown when a role name is invalid.
role-invalid-name: "&cThat role name is invalid."
# Message shown when a role already exists.
role-already-exists: "&cRole &f{role} &calready exists."
# Message shown when a role was not found.
role-not-found: "&cRole &f{role} &cwas not found."
# Message shown when a protected role cannot be deleted.
role-protected: "&cRole &f{role} &cis protected and cannot be deleted."
# Message shown when a role was created.
role-created: "&aRole &f{role} &awas created."
# Message shown when a role was deleted.
role-deleted: "&eRole &f{role} &ewas deleted."
# Message shown when a role was renamed.
role-renamed: "&aRole &f{old_role} &ais now called &f{role}&a."
# Message shown when a player was assigned to a role.
role-assigned: "&a{member} was assigned to role &f{role}&a."
# Message shown when a player was removed from a role.
role-unassigned: "&e{member} was removed from the plot role."
# Message shown when a right was added.
role-permission-added: "&aRight &f{permission} &awas added to &f{role}&a."
# Message shown when a right was removed.
role-permission-removed: "&eRight &f{permission} &ewas removed from &f{role}&e."
# Text when a role right is active.
role-permission-active: "Active"
# Text when a role right is inactive.
role-permission-inactive: "Inactive"
# Text when a player is assigned to the opened role.
role-assigned-yes: "Yes"
# Text when a player is not assigned to the opened role.
role-assigned-no: "No"

