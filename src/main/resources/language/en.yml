# Message shown when no plot was detected.
extras-worldedit-no-plot: "&cYou must use this item on your plot or plot merge."
# Message shown when the player is not the plot owner.
extras-worldedit-not-owner: "&cYou can only use the WorldEdit service on your own plot."
# Message shown when one corner is outside the current plot.
