# Wand-Blöcke sind in 5 Wertgruppen aufgeteilt. Spieler sehen nur Optionen,
# für deren Permission-Gruppe sie die jeweilige Permission besitzen.
# Jede Option unter options kann mit enabled: false ausgeschaltet werden.
# Mit permission: kann pro Option eine eigene Permission gesetzt werden. Leer bedeutet: nutze die permission-group.
